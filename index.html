us dans PowerShell.", "'Get-RemoteExec' n'est pas une cmdlet reconnue."]}, {"q": "Quelle politique PowerShell contrôle si des scripts (.ps1) peuvent s'exécuter sur une machine ?", "options": ["Execution Policy", "Script Policy", "Run Policy", "PS Guard"], "answer": 0, "def": "L'Execution Policy* (Restricted, RemoteSigned, AllSigned, Unrestricted...) est une mesure de sécurité, pas un système de permission au sens NTFS.", "why": ["Correct : 'Get-ExecutionPolicy' affiche la politique actuelle, 'Set-ExecutionPolicy RemoteSigned' l'assouplit pour autoriser les scripts locaux.", "'Script Policy' n'est pas le nom officiel de ce mécanisme dans PowerShell.", "'Run Policy' n'existe pas non plus comme terme PowerShell officiel.", "'PS Guard' est un nom fictif, ne correspondant à aucune fonctionnalité réelle de PowerShell."]}, {"q": "Quelle cmdlet liste les modules PowerShell actuellement chargés en mémoire ?", "options": ["Get-Module", "Get-Command", "Get-Item", "Get-Process"], "answer": 0, "def": "Get-Module* affiche les modules chargés (ajouter -ListAvailable pour voir tous les modules installés, même non chargés).", "why": ["Correct : 'Get-Module' liste les modules importés dans la session ; 'Get-Module -ListAvailable' liste tous ceux installés sur le système.", "Get-Command liste les commandes disponibles (cmdlets, fonctions, alias), pas spécifiquement les modules.", "Get-Item récupère un élément du système de fichiers ou d'un autre lecteur (registre...), sans rapport avec les modules PowerShell.", "Get-Process liste les processus Windows en cours d'exécution, sans lien avec les modules PowerShell."]}, {"q": "Comment ajoute-t-on un commentaire sur une ligne en PowerShell ?", "options": ["// commentaire", "# commentaire", "-- commentaire", "' commentaire"], "answer": 1, "def": "Le dièse # introduit un commentaire de fin de ligne en PowerShell (comme en Python ou Bash).", "why": ["'//' est la syntaxe de commentaire de C, C++, JavaScript..., pas de PowerShell.", "Correct : tout ce qui suit un # sur la ligne est ignoré par l'interpréteur PowerShell.", "'--' est utilisé en SQL pour les commentaires, pas en PowerShell.", "L'apostrophe simple ' délimite une chaîne de caractères en PowerShell, ce n'est pas un marqueur de commentaire."]}, {"q": "Quelle cmdlet crée un nouvel objet, par exemple un objet personnalisé (PSCustomObject) ?", "options": ["Get-Object", "New-Object (ou [PSCustomObject]@{...})", "Set-Object", "Add-Object"], "answer": 1, "def": "New-Object* instancie un objet .NET classique ; la syntaxe moderne [PSCustomObject]@{...} crée rapidement un objet personnalisé à partir d'une hashtable.", "why": ["'Get-Object' n'est pas une cmdlet PowerShell existante (on utilise Get-Item, Get-Process... selon le contexte).", "Correct : 'New-Object PSObject -Property @{Nom=\"Alice\"; Age=30}' ou plus simplement '[PSCustomObject]@{Nom=\"Alice\"; Age=30}' créent un nouvel objet structuré.", "'Set-Object' n'existe pas comme cmdlet générique en PowerShell.", "'Add-Object' n'est pas non plus une cmdlet standard de PowerShell."]}, {"q": "À quoi sert la cmdlet Get-Help en PowerShell ?", "options": ["Elle exécute automatiquement un script d'aide", "Elle affiche la documentation d'une cmdlet (syntaxe, paramètres, exemples)", "Elle envoie une demande de support à Microsoft", "Elle liste les erreurs récentes du système"], "answer": 1, "def": "Get-Help* est la première commande à connaître : elle documente précisément l'usage, les paramètres et donne des exemples pour toute cmdlet.", "why": ["Get-Help ne lance aucun script, elle affiche uniquement de la documentation textuelle.", "Correct : 'Get-Help Get-Process -Examples' (ou -Full, -Detailed) affiche la documentation complète avec des exemples d'utilisation.", "Get-Help n'a aucune connexion à un service de support Microsoft, toute la documentation est locale ou mise à jour via Update-Help.", "Lister les erreurs système est le rôle de Get-EventLog ou Get-WinEvent, pas de Get-Help."]}];

const linuxPermsQ = [{"q": "Combien de catégories de permissions existe-t-il par défaut sous Linux pour un fichier ?", "options": ["2 (utilisateur, groupe)", "3 (propriétaire, groupe, autres)", "4 (root, propriétaire, groupe, autres)", "1 (globale)"], "answer": 1, "def": "Chaque fichier a un propriétaire (owner/user), un groupe propriétaire, et une catégorie 'autres' (others/world) pour tout le reste.", "why": ["Il manque la catégorie 'autres' qui s'applique à tous les utilisateurs non concernés par le propriétaire ou le groupe.", "Correct : propriétaire (u), groupe (g), autres (o) sont les 3 catégories classiques de permission sous Linux.", "Root n'est pas une catégorie de permission séparée : il est simplement soumis aux mêmes 3 catégories, mais les contourne souvent grâce à ses privilèges.", "Il existe bien 3 catégories distinctes, pas une seule permission globale identique pour tous."]}, {"q": "Que signifient les lettres r, w, x dans les permissions Linux ?", "options": ["Read, Write, eXecute", "Root, Write, eXtend", "Read, Wait, eXit", "Remove, Write, eXport"], "answer": 0, "def": "r (lecture), w (écriture), x (exécution)* sont les trois droits de base applicables à chaque catégorie (propriétaire/groupe/autres).", "why": ["Correct : r=lire le contenu, w=modifier/écrire, x=exécuter (ou traverser un répertoire).", "'Root' n'est ni une lettre ni un droit ; ce n'est pas une des permissions elles-mêmes.", "'Wait' et 'eXit' ne correspondent à aucune permission Linux standard.", "'Remove' et 'eXport' ne sont pas des permissions Linux ; supprimer un fichier dépend en réalité des droits du RÉPERTOIRE parent, pas d'un droit 'remove' sur le fichier lui-même."]}, {"q": "Que signifie chmod 644 sur un fichier ?", "options": ["rwxrwxrwx", "rw-r--r--", "rwxr-xr-x", "rw-rw-rw-"], "answer": 1, "def": "Chaque chiffre encode 3 bits (r=4, w=2, x=1) : 6=rw- (4+2), 4=r-- , 4=r--.", "why": ["777 donnerait rwxrwxrwx (tous les droits pour tout le monde), pas 644.", "Correct : 6(propriétaire: rw-=4+2) 4(groupe: r--=4) 4(autres: r--=4), soit rw-r--r--.", "755 donnerait rwxr-xr-x (exécution incluse), typique d'un script ou dossier, pas de 644.", "666 donnerait rw-rw-rw- (écriture pour tous), une permission différente de 644 qui restreint l'écriture au seul propriétaire."]}, {"q": "Que signifie chmod 755 sur un script shell ?", "options": ["rwxr-xr-x", "rw-rw-rw-", "rwxrwxrwx", "r--r--r--"], "answer": 0, "def": "755 : 7=rwx (propriétaire peut tout faire), 5=r-x (groupe et autres peuvent lire et exécuter, mais pas modifier).", "why": ["Correct : 7(rwx=4+2+1) 5(r-x=4+1) 5(r-x=4+1) — typique pour un script exécutable que tout le monde peut lancer mais que seul le propriétaire peut modifier.", "666 (rw-rw-rw-) ne donne aucun droit d'exécution, inutilisable pour lancer un script directement.", "777 (rwxrwxrwx) donnerait aussi le droit de MODIFICATION à tout le monde, une permission bien plus permissive et risquée que 755.", "444 (r--r--r--) ne permettrait même pas au propriétaire d'exécuter ou modifier le script."]}, {"q": "Quelle commande change le PROPRIÉTAIRE d'un fichier sous Linux ?", "options": ["chmod", "chown", "chgrp", "chattr"], "answer": 1, "def": "chown (CHange OWNer)* modifie le propriétaire (et optionnellement le groupe) d'un fichier : 'chown alice fichier.txt'.", "why": ["chmod modifie les PERMISSIONS (rwx), pas l'identité du propriétaire.", "Correct : chown alice:groupe fichier.txt change à la fois le propriétaire (alice) et le groupe.", "chgrp change uniquement le GROUPE propriétaire, pas l'utilisateur propriétaire.", "chattr modifie des attributs spéciaux du système de fichiers (immuable, append-only...), sans rapport avec la propriété classique."]}, {"q": "Quelle commande change uniquement le GROUPE propriétaire d'un fichier ?", "options": ["chown", "chgrp", "chmod", "umask"], "answer": 1, "def": "chgrp* est dédiée au changement de groupe, alors que chown peut aussi le faire mais avec une syntaxe différente (chown :groupe).", "why": ["chown change principalement le propriétaire (utilisateur), même s'il peut aussi changer le groupe avec la syntaxe 'user:group'.", "Correct : 'chgrp compta fichier.txt' change uniquement le groupe propriétaire du fichier, sans toucher à son propriétaire utilisateur.", "chmod modifie les permissions (rwx), pas l'identité du groupe propriétaire.", "umask définit les permissions PAR DÉFAUT des nouveaux fichiers créés, sans modifier un fichier existant."]}, {"q": "Qu'est-ce que l'umask sous Linux ?", "options": ["Le masque de sous-réseau du serveur Linux", "Un masque qui retire des droits par défaut aux nouveaux fichiers/dossiers créés", "Un outil de chiffrement de disque", "Le mot de passe root masqué"], "answer": 1, "def": "L'umask* (typiquement 022) est SOUSTRAIT des permissions maximales par défaut (666 pour les fichiers, 777 pour les dossiers) à la création.", "why": ["L'umask Linux ne concerne pas le réseau, il s'agit d'un concept totalement différent du masque de sous-réseau IP.", "Correct : avec un umask de 022, un nouveau fichier reçoit 666-022=644 et un nouveau dossier 777-022=755 par défaut.", "Ce n'est pas un outil de chiffrement, mais un paramètre de permissions par défaut à la création de fichiers.", "L'umask n'a aucun rapport avec un mot de passe ; c'est une valeur numérique de permissions par défaut."]}, {"q": "Quelle commande affiche les permissions détaillées d'un fichier (dont le propriétaire et le groupe) ?", "options": ["ls -l", "cat", "pwd", "find"], "answer": 0, "def": "ls -l* (format long) affiche : type, permissions, nombre de liens, propriétaire, groupe, taille, date, nom.", "why": ["Correct : 'ls -l fichier.txt' affiche par exemple '-rw-r--r-- 1 alice compta 1024 juil. 22 10:00 fichier.txt'.", "cat affiche le CONTENU d'un fichier texte, pas ses métadonnées de permissions.", "pwd affiche uniquement le répertoire de travail courant, sans information sur les permissions d'un fichier.", "find recherche des fichiers selon des critères (nom, taille, date...), il ne les affiche pas en détail par défaut comme ls -l."]}, {"q": "Que signifie le premier caractère '-' (ou 'd', 'l'...) dans la sortie de 'ls -l' ?", "options": ["Le niveau de sécurité du fichier", "Le type de fichier : '-' pour fichier normal, 'd' pour dossier, 'l' pour lien symbolique", "Le nombre de propriétaires", "La date de dernière modification"], "answer": 1, "def": "Ce premier caractère* précède toujours les 9 caractères de permissions (rwxrwxrwx) et indique la NATURE de l'élément.", "why": ["Il n'existe pas de 'niveau de sécurité' encodé ainsi ; ce caractère indique uniquement le TYPE d'élément.", "Correct : '-' = fichier régulier, 'd' = dossier (directory), 'l' = lien symbolique (il existe aussi 'b', 'c', 's', 'p' pour des types spéciaux).", "Le nombre de liens physiques (hardlinks) est un CHAMP séparé, affiché après les permissions, pas ce premier caractère.", "La date de modification est affichée bien plus loin dans la ligne, ce premier caractère ne concerne que le type de fichier."]}, {"q": "Qu'est-ce que le bit SUID (Set User ID) sur un exécutable ?", "options": ["Il chiffre automatiquement le fichier", "Il fait s'exécuter le programme avec les droits de son PROPRIÉTAIRE, quel que soit l'utilisateur qui le lance", "Il interdit toute exécution du fichier", "Il synchronise l'heure du système"], "answer": 1, "def": "Le SUID* est utilisé par des commandes comme 'passwd' : un utilisateur normal peut ainsi modifier /etc/shadow (réservé à root) le temps de l'exécution du programme.", "why": ["Le SUID n'a aucun effet de chiffrement, c'est un mécanisme de délégation temporaire de privilèges d'exécution.", "Correct : avec le SUID actif, le processus s'exécute avec l'identité (UID) du propriétaire du fichier, pas celle de l'utilisateur qui le lance — un mécanisme puissant mais sensible en sécurité s'il est mal utilisé.", "Le SUID ne bloque pas l'exécution ; au contraire, il l'autorise avec des privilèges élevés temporaires.", "La synchronisation de l'heure est le rôle de NTP, totalement sans rapport avec le bit SUID."]}, {"q": "Qu'est-ce que le bit SGID (Set Group ID) appliqué à un DOSSIER ?", "options": ["Il chiffre tous les fichiers du dossier", "Les nouveaux fichiers créés dans ce dossier héritent automatiquement de son groupe propriétaire", "Il supprime automatiquement les anciens fichiers", "Il rend le dossier invisible"], "answer": 1, "def": "Le SGID sur un dossier* est très utile pour le travail collaboratif : tous les fichiers créés dedans appartiennent au même groupe, facilitant le partage.", "why": ["Le SGID n'a aucun effet de chiffrement automatique sur les fichiers.", "Correct : sans SGID, un nouveau fichier hérite du groupe PRINCIPAL de son créateur ; avec SGID sur le dossier parent, il hérite du groupe DU DOSSIER, uniformisant les partages d'équipe.", "Le SGID ne supprime aucun fichier automatiquement, il concerne uniquement l'héritage du groupe propriétaire.", "Le SGID n'a aucun impact sur la visibilité du dossier, seulement sur l'héritage de groupe des nouveaux fichiers créés dedans."]}, {"q": "À quoi sert le sticky bit sur un dossier partagé comme /tmp ?", "options": ["Il empêche la lecture du dossier par les autres utilisateurs", "Il permet à chacun d'écrire dans le dossier, mais seul le propriétaire d'un fichier peut le supprimer/renommer", "Il chiffre le contenu du dossier", "Il augmente les performances d'écriture"], "answer": 1, "def": "Le sticky bit* (affiché par un 't' final dans les permissions, ex: drwxrwxrwt) protège les fichiers des AUTRES utilisateurs dans un dossier partagé en écriture par tous.", "why": ["Le sticky bit ne restreint pas la lecture, il concerne la suppression/renommage des fichiers dans un dossier partagé.", "Correct : dans /tmp (souvent en 1777), tout le monde peut créer des fichiers, mais seul le propriétaire (ou root) peut supprimer SON PROPRE fichier, empêchant les autres de supprimer les fichiers d'autrui.", "Le sticky bit n'a aucun rapport avec le chiffrement des données du dossier.", "Il n'a aucun effet sur la vitesse d'écriture, c'est une mesure de sécurité/permission, pas de performance."]}, {"q": "Comment ajoute-t-on le SUID en notation numérique chmod (en plus des permissions classiques) ?", "options": ["En ajoutant un 4e chiffre devant, par exemple chmod 4755", "En utilisant chmod +s uniquement", "En modifiant /etc/passwd", "Ce n'est pas possible en notation numérique"], "answer": 0, "def": "Un 4e chiffre optionnel (avant les 3 habituels) code les bits spéciaux : 4=SUID, 2=SGID, 1=sticky bit, cumulables.", "why": ["Correct : 'chmod 4755 script.sh' active le SUID (4) en plus des permissions rwxr-xr-x (755).", "'chmod +s' est la notation symbolique, une alternative valide, mais la question porte sur la notation NUMÉRIQUE, où l'on ajoute un chiffre devant (ex: 4755).", "/etc/passwd contient les comptes utilisateurs, pas les permissions d'un fichier précis.", "La notation numérique permet bien de définir les bits spéciaux via un chiffre supplémentaire devant les 3 habituels."]}, {"q": "Quelle commande affiche/gère les listes de contrôle d'accès étendues (ACL) sous Linux ?", "options": ["chmod/getfacl", "getfacl/setfacl", "chown/chgrp", "umask/lsattr"], "answer": 1, "def": "Les ACL POSIX* permettent d'aller au-delà des 3 catégories classiques (propriétaire/groupe/autres) en donnant des droits précis à des utilisateurs ou groupes supplémentaires.", "why": ["chmod ne gère que les permissions classiques rwx de base, il ne permet pas de créer une ACL étendue à plusieurs utilisateurs spécifiques.", "Correct : 'getfacl fichier' affiche les ACL, 'setfacl -m u:bob:rwx fichier' ajoute un droit spécifique pour l'utilisateur bob.", "chown/chgrp changent le propriétaire ou le groupe, mais ne gèrent pas les droits ACL étendus pour des utilisateurs supplémentaires.", "umask définit les permissions par défaut à la création, lsattr affiche des attributs spéciaux (immuable...), ni l'un ni l'autre ne gère les ACL."]}, {"q": "Quelle commande symbolique (non numérique) donne le droit d'exécution au propriétaire d'un fichier ?", "options": ["chmod u+x fichier", "chmod g+x fichier", "chmod o+x fichier", "chmod a-x fichier"], "answer": 0, "def": "La notation symbolique* utilise u (user/propriétaire), g (group), o (others), a (all), combinés avec + (ajouter), - (retirer), = (définir).", "why": ["Correct : 'chmod u+x fichier' ajoute le droit d'exécution (x) uniquement pour le propriétaire (u = user).", "'chmod g+x' ajoute le droit d'exécution au GROUPE, pas au propriétaire.", "'chmod o+x' ajoute le droit d'exécution aux AUTRES utilisateurs (others), pas au propriétaire.", "'chmod a-x' RETIRE (signe -) le droit d'exécution à TOUT LE MONDE (all), l'inverse de ce qui est demandé."]}, {"q": "Un fichier appartient à 'root' avec permissions 600. Un utilisateur normal peut-il le lire ?", "options": ["Oui, tout le monde peut toujours lire un fichier root", "Non : 600 = rw------- signifie que seul le propriétaire (root) a des droits", "Oui, mais seulement en lecture seule via sudo automatique", "Cela dépend uniquement du nom du fichier"], "answer": 1, "def": "600* décompose en 6=rw- pour le propriétaire, 0=--- pour le groupe, 0=--- pour les autres : aucun accès pour qui n'est pas root.", "why": ["C'est faux : les permissions à 0 pour groupe et autres bloquent explicitement tout accès, y compris la lecture, pour les non-propriétaires.", "Correct : rw------- signifie que seul root (le propriétaire) peut lire et écrire ; groupe et autres n'ont absolument aucun droit (souvent utilisé pour des fichiers sensibles comme certaines clés privées).", "sudo ne s'active pas automatiquement pour la simple lecture d'un fichier ; il faut l'invoquer explicitement, et cela reste soumis à la politique sudoers.", "Le nom du fichier n'a aucune incidence sur le contrôle d'accès Linux, qui repose uniquement sur les permissions (et éventuellement les ACL), pas sur une convention de nommage."]}, {"q": "Pourquoi le fichier /etc/shadow est-il en permission 640 ou 600 et appartient-il souvent au groupe 'shadow' plutôt qu'à tous ?", "options": ["Pour des raisons esthétiques uniquement", "Pour empêcher les utilisateurs non privilégiés de lire les hash des mots de passe", "Parce que Linux l'exige par défaut sans raison de sécurité", "Pour accélérer la connexion au système"], "answer": 1, "def": "/etc/shadow* contient les empreintes (hash) des mots de passe : si un utilisateur normal pouvait le lire, il pourrait tenter de casser les hash hors-ligne (attaque par dictionnaire).", "why": ["Il ne s'agit absolument pas d'une question d'esthétique, mais d'une mesure de sécurité fondamentale du système.", "Correct : restreindre la lecture de /etc/shadow (contrairement à /etc/passwd, lisible par tous) protège les hash des mots de passe contre une tentative de cassage hors-ligne par un utilisateur non privilégié.", "Cette restriction est un choix de sécurité délibéré des distributions Linux, pas un hasard sans justification.", "Cette permission n'a aucun impact sur la vitesse de connexion, elle protège uniquement la confidentialité des hash de mots de passe."]}, {"q": "Quelle commande affiche les attributs étendus spéciaux d'un fichier (comme l'attribut immuable) sous Linux ?", "options": ["lsattr", "ls -la", "chmod -l", "stat --attr"], "answer": 0, "def": "lsattr* révèle des attributs indépendants des permissions classiques rwx, comme l'attribut immuable (i) qui empêche toute modification même par root.", "why": ["Correct : 'lsattr fichier' affiche des attributs comme 'i' (immuable) ou 'a' (append-only), invisibles avec un simple 'ls -l'.", "'ls -la' affiche les fichiers cachés et les permissions classiques (rwx), mais pas les attributs étendus spéciaux du système de fichiers.", "'chmod -l' n'est pas une syntaxe reconnue de chmod.", "'stat --attr' n'est pas une option standard de la commande stat pour ce besoin ; c'est bien lsattr qui est l'outil dédié."]}, {"q": "Un dossier a les permissions 'drwxr-x---'. Un utilisateur du groupe propriétaire peut-il exécuter 'cd' dans ce dossier ?", "options": ["Non, car il n'a pas la permission d'écriture", "Oui, car le bit x (exécution) est présent pour le groupe, qui permet de traverser/entrer dans le dossier", "Non, seul le propriétaire peut y accéder", "Cela dépend uniquement du umask actuel"], "answer": 1, "def": "Sur un DOSSIER, le bit x* ne signifie pas 'exécuter un programme' mais 'avoir le droit d'y entrer/traverser' (nécessaire pour cd, ou pour accéder aux fichiers qu'il contient).", "why": ["L'écriture (w) donnerait le droit de créer/supprimer des fichiers DANS le dossier, mais ce n'est pas ce qui permet d'y entrer avec cd (c'est le rôle du bit x).", "Correct : 'r-x' pour le groupe inclut le bit x, qui autorise justement à traverser (cd) le dossier et à accéder aux fichiers qu'il contient (si on connaît leur nom).", "Le groupe propriétaire A des droits ici (r-x), ce n'est pas réservé au seul propriétaire du dossier.", "L'umask ne s'applique qu'à la CRÉATION de nouveaux fichiers/dossiers, il n'a aucun effet sur les permissions déjà existantes de ce dossier."]}];const courseTexts = {"subnetting": "\n<h3>🧮 Comprendre le Subnetting (pas à pas)</h3>\n<p>Le <strong>subnetting</strong> (découpage en sous-réseaux) consiste à diviser un grand réseau IP en petits morceaux plus faciles à gérer et à sécuriser. C'est l'une des compétences les plus attendues en certification AIS : on la reprend ici depuis zéro.</p>\n\n<h3>1. Rappel : une adresse IPv4</h3>\n<p>Une adresse IPv4 comme <code>192.168.1.10</code> est composée de 4 nombres (octets) de 8 bits chacun, soit 32 bits au total. Chaque octet va de 0 à 255.</p>\n<p>Un masque de sous-réseau (ex : <code>255.255.255.0</code>) indique quelle partie de l'adresse désigne le <strong>réseau</strong> et quelle partie désigne <strong>l'hôte</strong> (la machine). On l'écrit aussi en notation CIDR : <code>/24</code> signifie que les 24 premiers bits (sur 32) sont réservés au réseau.</p>\n\n<h3>2. La méthode en 4 étapes (à refaire à chaque exercice)</h3>\n<p><strong>Étape 1 — Trouver le masque en binaire.</strong> Pour un /26, on pose 26 bits à 1 puis on complète avec des 0 jusqu'à 32 : <code>11111111.11111111.11111111.11000000</code>. En reconvertissant en décimal, cela donne <code>255.255.255.192</code>.</p>\n<p><strong>Étape 2 — Compter les machines utilisables.</strong> S'il reste \"h\" bits à 0 (bits hôtes), le nombre d'adresses total est 2^h, et le nombre de machines réellement utilisables est <code>2^h - 2</code> (on retire toujours l'adresse réseau et l'adresse de broadcast).</p>\n<p><strong>Étape 3 — Trouver l'adresse réseau.</strong> C'est la plus petite adresse du bloc : on met tous les bits hôtes à 0. Astuce rapide : les sous-réseaux se répètent par \"sauts\" de taille 256-valeur_du_masque (pour /26, le masque vaut 192 sur le dernier octet, donc les blocs font 256-192=64 de large : 0, 64, 128, 192...).</p>\n<p><strong>Étape 4 — Trouver le broadcast.</strong> C'est la plus grande adresse du bloc : on met tous les bits hôtes à 1. C'est simplement l'adresse juste avant le début du bloc suivant.</p>\n\n<h3>3. Exemple complet : 82.82.59.132/26</h3>\n<table>\n<tr><th>Étape</th><th>Résultat</th></tr>\n<tr><td>Masque</td><td>255.255.255.192</td></tr>\n<tr><td>Bits hôtes restants</td><td>6 bits (32-26)</td></tr>\n<tr><td>Machines utilisables</td><td>2^6 - 2 = 62</td></tr>\n<tr><td>Taille des blocs</td><td>256-192 = 64 (blocs : 0,64,128,192)</td></tr>\n<tr><td>Adresse réseau</td><td>82.82.59.128 (132 est dans le bloc 128-191)</td></tr>\n<tr><td>Broadcast</td><td>82.82.59.191 (dernière adresse du bloc)</td></tr>\n</table>\n\n<h3>4. Table de référence à connaître par cœur</h3>\n<table>\n<tr><th>CIDR</th><th>Masque</th><th>Bits hôtes</th><th>Machines utilisables</th><th>Taille du bloc</th></tr>\n<tr><td>/24</td><td>255.255.255.0</td><td>8</td><td>254</td><td>256</td></tr>\n<tr><td>/25</td><td>255.255.255.128</td><td>7</td><td>126</td><td>128</td></tr>\n<tr><td>/26</td><td>255.255.255.192</td><td>6</td><td>62</td><td>64</td></tr>\n<tr><td>/27</td><td>255.255.255.224</td><td>5</td><td>30</td><td>32</td></tr>\n<tr><td>/28</td><td>255.255.255.240</td><td>4</td><td>14</td><td>16</td></tr>\n<tr><td>/29</td><td>255.255.255.248</td><td>3</td><td>6</td><td>8</td></tr>\n<tr><td>/30</td><td>255.255.255.252</td><td>2</td><td>2</td><td>4</td></tr>\n</table>\n\n<h3>5. Le VLSM (masques de taille variable)</h3>\n<p>En pratique, on n'utilise pas le même masque partout : un lien entre deux routeurs n'a besoin que de 2 adresses (un <code>/30</code> suffit), alors qu'un LAN de 100 postes a besoin d'un <code>/25</code>. Le <strong>VLSM</strong> (Variable Length Subnet Mask) consiste à adapter la taille de chaque sous-réseau à son besoin réel, pour ne pas gaspiller d'adresses.</p>\n\n<h3>6. Le masque wildcard (pour les ACL Cisco)</h3>\n<p>Le masque wildcard est l'<strong>inverse binaire</strong> du masque de sous-réseau : là où le masque a un 1, le wildcard a un 0, et inversement. Astuce rapide : <code>255 - valeur_du_masque = valeur_du_wildcard</code> sur chaque octet. Exemple : masque 255.255.255.192 → wildcard 0.0.0.63.</p>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Entraîne-toi maintenant avec le quiz ci-dessous : il reprend exactement cette méthode sur des cas variés (calcul de masque, de machines, d'adresse réseau, de broadcast, VLSM, wildcard...).</p>\n", "powershell": "\n<h3>💻 Scripting PowerShell pour les débutants</h3>\n<p>PowerShell est le langage de script et d'administration de Windows (multiplateforme depuis PowerShell 7). Contrairement à un shell classique (Bash, CMD) qui ne manipule que du texte, PowerShell manipule de <strong>vrais objets</strong> avec des propriétés et des méthodes : c'est ce qui le rend particulièrement puissant pour l'administration système.</p>\n\n<h3>1. Les cmdlets : la brique de base</h3>\n<p>Une commande PowerShell s'appelle une <strong>cmdlet</strong> et suit toujours la structure <code>Verbe-Nom</code> : le verbe décrit l'action (Get, Set, New, Remove, Start, Stop...), le nom décrit la ressource ciblée (Process, Service, Item, ADUser...).</p>\n<table>\n<tr><th>Verbe</th><th>Signification</th><th>Exemple</th></tr>\n<tr><td>Get</td><td>Récupérer / afficher</td><td>Get-Process</td></tr>\n<tr><td>Set</td><td>Modifier une propriété existante</td><td>Set-ItemProperty</td></tr>\n<tr><td>New</td><td>Créer un nouvel élément</td><td>New-Item</td></tr>\n<tr><td>Remove</td><td>Supprimer</td><td>Remove-Item</td></tr>\n<tr><td>Start / Stop</td><td>Démarrer / arrêter</td><td>Start-Service</td></tr>\n<tr><td>Invoke</td><td>Exécuter une action / un script</td><td>Invoke-Command</td></tr>\n</table>\n\n<h3>2. Les variables</h3>\n<p>Une variable se déclare avec le signe <code>$</code> : <code>$nom = \"Alice\"</code>. PowerShell est typé dynamiquement : la même variable peut contenir un texte, un nombre, un tableau, ou même un objet complexe.</p>\n\n<h3>3. Le pipeline : l'ADN de PowerShell</h3>\n<p>Le symbole <code>|</code> transmet le résultat (les objets) d'une commande à la commande suivante. Exemple : <code>Get-Process | Where-Object {$_.CPU -gt 50} | Sort-Object CPU -Descending</code> filtre les processus gourmands en CPU puis les trie. La variable <code>$_</code> représente \"l'objet courant\" dans le pipeline.</p>\n<table>\n<tr><th>Cmdlet</th><th>Rôle</th></tr>\n<tr><td>Where-Object</td><td>Filtrer selon une condition (les LIGNES)</td></tr>\n<tr><td>Select-Object</td><td>Choisir des propriétés (les COLONNES) ou un nombre d'objets</td></tr>\n<tr><td>Sort-Object</td><td>Trier</td></tr>\n<tr><td>Group-Object</td><td>Regrouper par valeur commune</td></tr>\n<tr><td>ForEach-Object</td><td>Exécuter une action sur chaque objet</td></tr>\n<tr><td>Format-Table / Format-List</td><td>Changer uniquement l'AFFICHAGE final</td></tr>\n</table>\n\n<h3>4. Tableaux et hashtables</h3>\n<p>Un <strong>tableau</strong> (array) contient une liste ordonnée de valeurs : <code>$tab = 1,2,3</code>, accessible par index <code>$tab[0]</code>.</p>\n<p>Une <strong>hashtable</strong> associe des clés à des valeurs : <code>$h = @{nom='Alice'; age=30}</code>, accessible via <code>$h.nom</code> ou <code>$h['nom']</code>.</p>\n\n<h3>5. Conditions et boucles</h3>\n<table>\n<tr><th>Structure</th><th>Usage</th></tr>\n<tr><td>if / elseif / else</td><td>Tester une ou plusieurs conditions</td></tr>\n<tr><td>switch</td><td>Tester plusieurs valeurs possibles d'une même variable</td></tr>\n<tr><td>for</td><td>Boucle avec compteur classique</td></tr>\n<tr><td>foreach</td><td>Parcourir chaque élément d'une collection</td></tr>\n<tr><td>while</td><td>Répéter tant qu'une condition est vraie (testée AVANT)</td></tr>\n<tr><td>do-while / do-until</td><td>Répéter au moins une fois (condition testée APRÈS)</td></tr>\n</table>\n\n<h3>6. Les opérateurs de comparaison</h3>\n<p>PowerShell n'utilise pas <code>==</code> comme d'autres langages, mais des opérateurs textuels préfixés par un tiret :</p>\n<table>\n<tr><th>Opérateur</th><th>Signification</th></tr>\n<tr><td>-eq / -ne</td><td>Égal / différent</td></tr>\n<tr><td>-gt / -lt</td><td>Supérieur / inférieur à</td></tr>\n<tr><td>-ge / -le</td><td>Supérieur ou égal / inférieur ou égal</td></tr>\n<tr><td>-like</td><td>Correspond à un motif avec jokers simples (*, ?)</td></tr>\n<tr><td>-match</td><td>Correspond à une expression régulière (regex)</td></tr>\n<tr><td>-contains</td><td>Une collection contient une valeur précise</td></tr>\n</table>\n\n<h3>7. Fonctions et modules</h3>\n<p>On définit une fonction avec <code>function MaFonction { param($x) ... }</code>. Un <strong>module</strong> regroupe plusieurs fonctions/cmdlets réutilisables ; <code>Get-Module -ListAvailable</code> liste tous les modules installés, <code>Import-Module</code> en charge un en mémoire.</p>\n\n<h3>8. Gestion des erreurs</h3>\n<p>PowerShell utilise <code>try { ... } catch { ... } finally { ... }</code>, comme de nombreux langages modernes, pour intercepter proprement les exceptions plutôt que de laisser le script planter.</p>\n\n<h3>9. Export de données et remoting</h3>\n<p><code>Export-Csv</code> et <code>ConvertTo-Json</code> permettent d'exporter des objets vers des formats exploitables ailleurs (Excel, une API...). <code>Invoke-Command -ComputerName Serveur1 -ScriptBlock {...}</code> exécute du code sur une machine distante via WinRM (remoting).</p>\n\n<h3>10. Sécurité : l'Execution Policy</h3>\n<p>Par défaut, Windows empêche l'exécution de scripts .ps1 pour limiter les risques. La politique d'exécution (<code>Get-ExecutionPolicy</code> / <code>Set-ExecutionPolicy</code>) contrôle ce comportement, sans remplacer les permissions NTFS classiques.</p>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Le quiz ci-dessous couvre tous ces concepts avec des cas pratiques : cmdlets, variables, pipeline, tableaux/hashtables, boucles, opérateurs, fonctions, gestion d'erreurs, remoting et sécurité.</p>\n", "linux": "\n<h3>🔐 Les permissions Linux, expliquées simplement</h3>\n<p>Sous Linux, chaque fichier et chaque dossier appartient à un <strong>propriétaire</strong> (un utilisateur) et à un <strong>groupe</strong>, et possède des permissions définies pour 3 catégories bien distinctes.</p>\n\n<h3>1. Les 3 catégories et les 3 droits</h3>\n<table>\n<tr><th>Catégorie</th><th>Symbole</th><th>Concerne</th></tr>\n<tr><td>Propriétaire (user)</td><td>u</td><td>La personne qui possède le fichier</td></tr>\n<tr><td>Groupe (group)</td><td>g</td><td>Les membres du groupe propriétaire</td></tr>\n<tr><td>Autres (others)</td><td>o</td><td>Tout le monde d'autre sur la machine</td></tr>\n</table>\n<table>\n<tr><th>Droit</th><th>Lettre</th><th>Sur un fichier</th><th>Sur un dossier</th></tr>\n<tr><td>Lecture</td><td>r (4)</td><td>Lire le contenu</td><td>Lister le contenu (ls)</td></tr>\n<tr><td>Écriture</td><td>w (2)</td><td>Modifier le contenu</td><td>Créer/supprimer des fichiers dedans</td></tr>\n<tr><td>Exécution</td><td>x (1)</td><td>Exécuter comme un programme</td><td>\"Traverser\" le dossier (cd, accès aux fichiers)</td></tr>\n</table>\n\n<h3>2. Lire une ligne \"ls -l\"</h3>\n<p>Exemple : <code>-rwxr-xr-- 1 alice compta 1024 juil. 22 10:00 script.sh</code></p>\n<ul>\n<li><code>-</code> : type de fichier (- = fichier normal, d = dossier, l = lien symbolique)</li>\n<li><code>rwx</code> : droits du propriétaire (alice) : tout faire</li>\n<li><code>r-x</code> : droits du groupe (compta) : lire et exécuter, pas modifier</li>\n<li><code>r--</code> : droits des autres : lecture seule</li>\n</ul>\n\n<h3>3. La notation numérique (chmod)</h3>\n<p>Chaque droit vaut un chiffre : r=4, w=2, x=1. On additionne les droits voulus pour chaque catégorie, ce qui donne un chiffre de 0 à 7.</p>\n<table>\n<tr><th>Chiffre</th><th>Droits</th><th>Signification</th></tr>\n<tr><td>7</td><td>rwx</td><td>4+2+1 : tout faire</td></tr>\n<tr><td>6</td><td>rw-</td><td>4+2 : lire et écrire</td></tr>\n<tr><td>5</td><td>r-x</td><td>4+1 : lire et exécuter</td></tr>\n<tr><td>4</td><td>r--</td><td>4 : lecture seule</td></tr>\n<tr><td>0</td><td>---</td><td>Aucun droit</td></tr>\n</table>\n<p>Exemple : <code>chmod 755 script.sh</code> = propriétaire rwx (7), groupe r-x (5), autres r-x (5) — typique d'un script exécutable partagé. <code>chmod 644 fichier.txt</code> = propriétaire rw- (6), groupe r-- (4), autres r-- (4) — typique d'un document classique.</p>\n\n<h3>4. La notation symbolique (chmod)</h3>\n<p>On peut aussi modifier un droit précis sans tout recalculer : <code>chmod u+x fichier</code> (ajoute l'exécution au propriétaire), <code>chmod g-w fichier</code> (retire l'écriture au groupe), <code>chmod o=r fichier</code> (fixe exactement le droit des autres à lecture seule), <code>chmod a+r fichier</code> (ajoute la lecture à tout le monde : a = all).</p>\n\n<h3>5. Changer propriétaire et groupe</h3>\n<p><code>chown alice fichier</code> change le propriétaire. <code>chown alice:compta fichier</code> change propriétaire ET groupe en une seule commande. <code>chgrp compta fichier</code> change uniquement le groupe.</p>\n\n<h3>6. L'umask : les permissions par défaut</h3>\n<p>Quand un fichier est créé, Linux part d'un maximum théorique (666 pour un fichier, 777 pour un dossier) et lui <strong>soustrait</strong> l'umask. Avec un umask de 022 (valeur très courante), un nouveau fichier reçoit 666-022=644, et un nouveau dossier 777-022=755.</p>\n\n<h3>7. Les permissions spéciales (bits avancés)</h3>\n<table>\n<tr><th>Bit</th><th>Effet</th><th>Exemple d'usage</th></tr>\n<tr><td>SUID (chmod 4xxx)</td><td>Le programme s'exécute avec les droits de son PROPRIÉTAIRE</td><td>La commande passwd (modifie /etc/shadow, réservé root)</td></tr>\n<tr><td>SGID (chmod 2xxx)</td><td>Sur un dossier : les nouveaux fichiers héritent du GROUPE du dossier</td><td>Dossiers de travail collaboratif en équipe</td></tr>\n<tr><td>Sticky bit (chmod 1xxx)</td><td>Dans un dossier partagé en écriture, seul le propriétaire d'un fichier peut le supprimer</td><td>/tmp (souvent en permission 1777)</td></tr>\n</table>\n\n<h3>8. Les ACL (listes de contrôle d'accès étendues)</h3>\n<p>Les 3 catégories classiques (u/g/o) ne suffisent pas toujours. Les <strong>ACL POSIX</strong> permettent de donner un droit précis à un utilisateur ou groupe supplémentaire : <code>setfacl -m u:bob:rwx fichier</code> ajoute des droits rwx spécifiquement pour bob, sans toucher au propriétaire ni au groupe classique. <code>getfacl fichier</code> affiche les ACL en place.</p>\n\n<h3>9. /etc/passwd vs /etc/shadow</h3>\n<p><code>/etc/passwd</code> liste les comptes utilisateurs (lisible par tous). <code>/etc/shadow</code> contient les mots de passe hashés et n'est lisible que par root, précisément pour empêcher un utilisateur normal de tenter de casser les hash hors-ligne.</p>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Le quiz ci-dessous te fait pratiquer chmod numérique et symbolique, chown/chgrp, umask, SUID/SGID/sticky bit, ACL, et la lecture d'un \"ls -l\" complet.</p>\n"};

const memoireHtml = "\n<h3>📄 Fiche de révision — Mémoire HA « Kali-Brazza »</h3>\n<p>Cette section rassemble, pour réviser ta soutenance, le <strong>glossaire complet</strong> de ton mémoire ainsi que <strong>tous les concepts et protocoles</strong> que tu as mobilisés tout au long du projet — classés par grand thème, dans l'ordre où ils apparaissent dans ton document.</p>\n\n<h3>1. Glossaire complet (section 11 du mémoire)</h3>\n<p><strong>Active Directory (AD)</strong> : Service d'annuaire développé par Microsoft. Il permet de centraliser la gestion des identités, des droits d'accès et des politiques de sécurité pour l'ensemble des utilisateurs et ordinateurs du réseau.</p>\n<p><strong>AES-256 (Advanced Encryption Standard)</strong> : Algorithme de chiffrement symétrique utilisant une clé de 256 bits. Il est reconnu comme l'un des standards de cryptographie les plus robustes pour sécuriser la confidentialité des données.</p>\n<p><strong>ANSSI</strong> : Agence Nationale de la Sécurité des Systèmes d'Information. Autorité française chargée d'accompagner et de sécuriser le développement du numérique, notamment en éditant des référentiels et des guides de bonnes pratiques.</p>\n<p><strong>RGPD (Règlement Général sur la Protection des Données)</strong> : règlement européen de 2018 imposant aux organisations des mesures techniques et organisationnelles pour protéger les données personnelles qu'elles traitent.</p>\n<p><strong>ISO 27001</strong> : norme internationale de référence en matière de management de la sécurité de l'information (SMSI), définissant un ensemble de mesures de sécurité organisées en annexes.</p>\n<p><strong>Apache Guacamole (ou Bastion)</strong> : Passerelle d'accès à distance (bastion) permettant de se connecter de manière sécurisée et tracée aux serveurs internes (via les protocoles RDP ou SSH) directement depuis un navigateur web, sans exposer directement les ports du réseau interne.</p>\n<p><strong>Backblaze / S3</strong> : Service de stockage cloud de type objet (compatible avec le standard S3). Utilisé dans ce projet pour l'externalisation des sauvegardes afin de garantir la disponibilité des données hors site.</p>\n<p><strong>CARP (Common Address Redundancy Protocol)</strong> : Protocole réseau de redondance permettant à plusieurs routeurs ou pare-feux (ici, pfSense) de partager une même adresse IP virtuelle. Il assure la haute disponibilité en basculant automatiquement le trafic vers un équipement de secours en cas de panne du maître (failover).</p>\n<p><strong>Chiffrement</strong> : Procédé de cryptographie consistant à transformer une donnée lisible en un format inintelligible, nécessitant une clé spécifique pour être déchiffrée et exploitée.</p>\n<p><strong>Cluster</strong> : Grappe de serveurs ou d'équipements réseau configurés pour fonctionner de concert, augmentant ainsi la tolérance aux pannes et la disponibilité globale des services.</p>\n<p><strong>DMZ (Zone Démilitarisée)</strong> : Sous-réseau informatique isolé de part et d'autre par des pare-feux, servant de zone tampon entre le réseau interne de l'entreprise (LAN) et Internet. Elle héberge les services devant être accessibles depuis l'extérieur.</p>\n<p><strong>Duplicati</strong> : Logiciel de sauvegarde open source permettant de chiffrer les données à la source avant de les transférer de manière automatisée vers un espace de stockage distant.</p>\n<p><strong>Failover (Bascule)</strong> : Processus automatisé par lequel un équipement ou un système de secours prend le relais d'un composant principal défaillant, garantissant la continuité de service.</p>\n<p><strong>GPO (Group Policy Object)</strong> : Stratégie de groupe Microsoft permettant d'appliquer, de distribuer et de forcer de manière centralisée des configurations de sécurité et des restrictions (ex : verrouillage des sessions, blocage des ports USB) sur les postes membres du domaine.</p>\n<p><strong>LDAP (Lightweight Directory Access Protocol)</strong> : Protocole réseau standard permettant d'interroger et de modifier un annuaire centralisé pour l'authentification et l'autorisation des utilisateurs.</p>\n<p><strong>Nessus</strong> : Outil professionnel d'évaluation des vulnérabilités. Il analyse les systèmes et le réseau pour identifier les failles de sécurité, les erreurs de configuration et les correctifs logiciels manquants.</p>\n<p><strong>pfSense</strong> : Solution de pare-feu et de routage open source basée sur le système d'exploitation FreeBSD. Elle assure la protection du périmètre réseau, le filtrage des flux et la gestion des VPN.</p>\n<p><strong>PRA (Plan de Reprise d'Activité)</strong> : Ensemble de procédures techniques et organisationnelles documentées, conçues pour restaurer rapidement le système d'information de l'entreprise après un sinistre majeur (cyberattaque, incendie).</p>\n<p><strong>Ransomware (Rançongiciel)</strong> : Logiciel malveillant qui bloque l'accès aux données d'une organisation (généralement par un chiffrement fort) et exige le paiement d'une rançon pour en restituer l'accès.</p>\n<p><strong>Remédiation</strong> : Ensemble des actions correctives appliquées sur un système d'information (application de patchs, reconfiguration) suite à la découverte d'une vulnérabilité.</p>\n<p><strong>SIEM (Security Information and Event Management)</strong> : Solution de sécurité (comme Wazuh) permettant de collecter, corréler et analyser en temps réel les journaux d'événements (logs) pour détecter et alerter sur les incidents de sécurité.</p>\n<p><strong>SNMP (Simple Network Management Protocol)</strong> : Protocole de communication permettant à un serveur de supervision de collecter des métriques d'état et de performance (CPU, statut des interfaces) sur des équipements réseau distants.</p>\n<p><strong>TrueNAS / ZFS</strong> : TrueNAS est un système d'exploitation orienté stockage réseau (NAS). ZFS est le système de fichiers sous-jacent, reconnu pour sa robustesse, sa détection automatique de la corruption des données et sa gestion optimisée des snapshots.</p>\n<p><strong>VLAN (Virtual Local Area Network)</strong> : Réseau local virtuel permettant de segmenter logiquement une infrastructure réseau physique en plusieurs domaines de diffusion isolés, limitant ainsi la surface d'attaque et améliorant les performances.</p>\n<p><strong>VPN (Virtual Private Network)</strong> : Technologie établissant un tunnel chiffré et authentifié sur un réseau public (Internet), permettant d'interconnecter des sites distants ou de sécuriser les accès nomades.</p>\n<p><strong>Zabbix</strong> : Plateforme logicielle open source de supervision réseau et applicative. Elle permet de surveiller la disponibilité, la capacité et la santé des équipements en temps réel via le déploiement de sondes ou d'agents.</p>\n<p><strong>Zero Trust</strong> : Modèle d'architecture de sécurité fondé sur le principe du \"ne jamais faire confiance, toujours vérifier\". Toute tentative d'accès au réseau ou aux ressources nécessite une authentification et une autorisation strictes et continues, quelle que soit la provenance de la connexion (interne ou externe).</p>\n\n<h3>2. Réseau & Haute Disponibilité</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>pfSense</td><td>Pare-feu/routeur open source (FreeBSD) : filtrage, NAT, VPN. Deux nœuds Master/Backup dans ton projet.</td></tr>\n<tr><td>CARP + pfSync</td><td>CARP gère les IP virtuelles (VIP) partagées entre les 2 nœuds ; pfSync synchronise en temps réel la table d'états entre eux via le VLAN 99 dédié. Sans pfSync, la bascule couperait les connexions en cours.</td></tr>\n<tr><td>VLAN 802.1Q (trunk)</td><td>Tes VLAN (10 Admin, 20 Serveurs, 30 Utilisateurs, 40 DMZ, 50 Supervision, 60 Sauvegardes, 99 Sync, 100/110 site de secours) sont tous tagués sur une interface unique (LAN_TRUNK) grâce au 802.1Q, contrainte imposée par le lab (une seule carte physique disponible).</td></tr>\n<tr><td>DHCP + réservation MAC</td><td>Réservation d'adresse IP par adresse MAC pour que Guacamole pointe toujours vers le bon poste malgré l'attribution dynamique.</td></tr>\n<tr><td>VPN nomade (OpenVPN Road Warrior)</td><td>Tunnel chiffré pour les utilisateurs distants, authentifié via LDAP/AD, sans accès direct au LAN une fois connecté (double sécurité avec Guacamole).</td></tr>\n<tr><td>VPN Site-à-Site</td><td>Tunnel OpenVPN permanent entre le site principal (Paris) et le site de secours (Aubervilliers), utilisé pour la réplication ZFS et Veeam.</td></tr>\n<tr><td>Dual WAN</td><td>Deux box (Orange + Free) rattachées aux deux pare-feux du cluster pour la redondance de la sortie Internet.</td></tr>\n<tr><td>Failover</td><td>Bascule automatique et transparente : si pf1 (Master) tombe, pf2 (Backup) prend le rôle Master en quelques secondes (heartbeats CARP perdus).</td></tr>\n</table>\n\n<h3>3. Identités & Zero Trust</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Active Directory (AD DS)</td><td>Annuaire central déployé sur le VLAN 20, unique source de vérité pour l'authentification (postes, VPN, Guacamole). Un compte désactivé perd tous ses accès en une seule manipulation.</td></tr>\n<tr><td>LDAP (Bind DN, OU, samAccountName)</td><td>Le Bind DN (ex: CN=LDAP,OU=Services,OU=Kali-Brazza,DC=dracine,DC=local) est le compte de service utilisé par pfSense/Guacamole pour interroger l'annuaire. samAccountName est l'attribut de connexion utilisateur, memberOf sert à lire l'appartenance aux groupes.</td></tr>\n<tr><td>GPO (stratégies de groupe)</td><td>3 axes de durcissement appliqués sur le VLAN 30 : mot de passe renforcé (12 caractères), restriction du stockage amovible (clés USB), verrouillage automatique de l'écran de veille.</td></tr>\n<tr><td>Apache Guacamole (bastion)</td><td>Portail web dans la DMZ (VLAN 40), authentifié en LDAP (extension guacamole-auth-ldap), qui relaie des sessions RDP/SSH sans jamais exposer directement les serveurs internes.</td></tr>\n<tr><td>Zero Trust</td><td>Stratégie « double sécurité » : VPN authentifié PUIS ré-authentification sur Guacamole, aucun accès direct au réseau de production même une fois le VPN monté.</td></tr>\n</table>\n\n<h3>4. Sécurité, Supervision & Conformité</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Nessus (scan authentifié)</td><td>Basic Network Scan avec Credentials Windows injectés, pour auditer aussi les vulnérabilités internes (pas seulement celles visibles de l'extérieur). Exemple trouvé : Visual Studio Code obsolète sur le contrôleur de domaine.</td></tr>\n<tr><td>Zabbix (supervision)</td><td>Ciblée sur les points critiques : statut CARP du cluster, trafic WAN, disponibilité DNS, service LDAP/AD DS (threads actifs, sessions, recherches/écritures par seconde).</td></tr>\n<tr><td>SNMP</td><td>Protocole utilisé par Zabbix pour interroger l'état des équipements réseau (pfSense) à distance.</td></tr>\n<tr><td>Wazuh (SIEM)</td><td>Centralise les logs de sécurité des agents Windows/Linux, détecte les comportements suspects (échecs d'authentification LDAP observés concrètement pendant le projet) et génère des alertes en temps réel.</td></tr>\n<tr><td>RGPD / ISO 27001 / ANSSI</td><td>Cadre réglementaire et normatif justifiant le durcissement (GPO), le chiffrement (AES-256) et la traçabilité (SIEM) mis en place.</td></tr>\n<tr><td>AMDEC (méthode de gestion des risques)</td><td>Cotation Fréquence x Gravité = Criticité pour prioriser les risques internes, externes et climatiques (ex : Cyberattaque cotée 8, la plus critique du tableau).</td></tr>\n<tr><td>Ransomware</td><td>Menace principale justifiant les snapshots immuables en lecture seule sur le TrueNAS de secours (protection même si le site principal est chiffré par une attaque).</td></tr>\n</table>\n\n<h3>5. Sauvegarde & Plan de Reprise d'Activité (PRA)</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Règle 3-2-1</td><td>3 copies des données, sur 2 supports différents, dont 1 hors site : ici TrueNAS local + Backblaze B2 (cloud) + TrueNAS du site de secours.</td></tr>\n<tr><td>Duplicati (AES-256, chiffrement à la source)</td><td>2 jobs : « Local » (Zabbix, Wazuh, Nessus vers TrueNAS) et « Cloud » (System State AD + Zabbix vers Backblaze B2), chiffrés avant tout transfert.</td></tr>\n<tr><td>SHA-256 (vérification d'intégrité)</td><td>Empreinte utilisée pour prouver, après restauration, que le fichier restauré est bit-à-bit identique à l'original (aucune perte/corruption).</td></tr>\n<tr><td>wbadmin / System State</td><td>Commande PowerShell native Windows sauvegardant l'annuaire Active Directory directement sur un partage SMB TrueNAS.</td></tr>\n<tr><td>TrueNAS / ZFS (pool, dataset, snapshot, replication)</td><td>Pool de stockage (backup-pool), dataset dédié (duplicati), snapshots périodiques planifiés, et réplication native ZFS (zfs send/receive via SSH) vers le site de secours chaque nuit à 5h00, rétention 15 jours.</td></tr>\n<tr><td>Backblaze B2 (S3)</td><td>Stockage objet cloud compatible S3, utilisé comme copie externalisée hors site à faible coût (~132 €/an pour 2 To).</td></tr>\n<tr><td>Veeam Backup & Replication</td><td>Réplication de VM critiques (pfSense x2, AD, serveur applicatif) vers l'hôte ESXi de secours, en mode standalone (sans vCenter).</td></tr>\n<tr><td>CBT (Changed Block Tracking)</td><td>Mécanisme Veeam qui n'identifie que les blocs disque modifiés depuis la dernière sauvegarde, expliquant le gain de temps entre la sauvegarde complète (48 min) et l'incrémentielle (6 min 52s).</td></tr>\n<tr><td>Guest Processing</td><td>Fonctionnalité Veeam nécessitant un agent Windows (VSS) ; échoue normalement sur les VM non-Windows (pfSense, Debian).</td></tr>\n<tr><td>Failover / Failback (Veeam)</td><td>Failover = démarrage des VM répliquées sur le site de secours en cas de sinistre. Failback = resynchronisation des réplicas vers le site de production une fois celui-ci rétabli.</td></tr>\n<tr><td>PRA (Plan de Reprise d'Activité)</td><td>Ensemble cohérent : tunnel VPN S2S + réplication ZFS + réplication Veeam, formalisé et testé (recette) avant la mise en production.</td></tr>\n</table>\n\n<h3>6. Méthodologie & Gestion de Projet</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Bête à cornes</td><td>Diagramme d'analyse fonctionnelle du besoin : à qui rend-il service (staff, invités), sur quoi agit-il (politique de sécurité du SI), dans quel but (améliorer sécurité et disponibilité).</td></tr>\n<tr><td>Cahier des charges (CDCF / CDCT)</td><td>CDCF = besoins fonctionnels et périmètre (ce que le projet couvre / ne couvre pas). CDCT = exigences et contraintes techniques (matériel existant, interface réseau unique, absence de vCenter...).</td></tr>\n<tr><td>Méthode Scrumban (Agile)</td><td>6 sprints d'une semaine, chacun avec réunion de planification + revue de validation ; hybride entre Scrum (sprints) et Kanban (flux continu de tâches).</td></tr>\n<tr><td>Matrice RACI</td><td>Réalisateur / Approbateur / Consulté / Informé — clarifie qui fait quoi sur chaque lot du projet (toi en R, le tuteur en A).</td></tr>\n<tr><td>Diagramme de Gantt</td><td>Visualisation des 6 sprints, jalons (losanges) et liaisons fin-début, avec la pause de congés intégrée sans décaler la deadline finale.</td></tr>\n</table>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Relis cette fiche juste avant ta soutenance : sois capable d'expliquer, pour chaque ligne, le POURQUOI (le besoin auquel ça répond) et pas seulement le COMMENT (la manipulation technique) — c'est souvent ce que recherchent les jurys AIS.</p>\n";

// ─── STATE ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = "ais_progress_v4";
let progress = {};
let currentScreen = "home";
let quizData = null;
let quizResults = [];
let quizIdx = 0;
let quizAnswered = false;
let quizSelected = null;
let currentCourseId = null;

// ─── OFFLINE/SYNC ─────────────────────────────────────────────────────────────
function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch {}
}
function updateProgress(chId, origIdx, correct) {
  if (!progress[chId]) progress[chId] = {};
  progress[chId][origIdx] = correct;
  saveProgress();
}

// ─── OFFLINE DETECTION ────────────────────────────────────────────────────────
window.addEventListener('online', () => { document.getElementById('offlineBadge').classList.remove('show'); });
window.addEventListener('offline', () => { document.getElementById('offlineBadge').classList.add('show'); });
if (!navigator.onLine) document.getElementById('offlineBadge').classList.add('show');

// ─── UTILS ────────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
// Parses [[key]] or [[key:Display Label]] markup into clickable glossary terms.
function linkTerms(html) {
  if (!html) return '';
  return html.replace(/\[\[([a-zA-Z0-9_\-]+)(?::([^\]]+))?\]\]/g, (m, key, disp) => {
    const label = disp || key;
    if (!glossary[key]) return label;
    return `<span class="term" onclick="showTerm('${key}')">${label}*</span>`;
  });
}
function showTerm(key) {
  const def = glossary[key];
  if (!def) return;
  const title = def.split(/[:：]/)[0].trim();
  document.getElementById('termTitle').textContent = title;
  document.getElementById('termDef').textContent = def;
  document.getElementById('termModal').classList.add('open');
}
function closeTermModal() {
  document.getElementById('termModal').classList.remove('open');
}

function findModule(chId) {
  return chapters.find(c => c.id === chId) || extraModules.find(m => m.id === chId);
}
function getChapterPct(chId) {
  const ch = findModule(chId);
  if (!ch || !progress[chId]) return 0;
  return Math.round(Object.keys(progress[chId]).length / ch.questions.length * 100);
}
function getChapterCorrectPct(chId) {
  const ch = findModule(chId);
  if (!ch || !progress[chId]) return 0;
  return Math.round(Object.values(progress[chId]).filter(Boolean).length / ch.questions.length * 100);
}
function getGlobalStats() {
  const totalQ = chapters.reduce((s,c) => s+c.questions.length, 0);
  const totalA = chapters.reduce((s,c) => s+(progress[c.id]?Object.keys(progress[c.id]).length:0), 0);
  const totalC = chapters.reduce((s,c) => s+(progress[c.id]?Object.values(progress[c.id]).filter(Boolean).length:0), 0);
  return { totalQ, totalA, totalC, pct: Math.round(totalA/totalQ*100), correctPct: Math.round(totalC/totalQ*100) };
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function navigate(to, data) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  currentScreen = to;
  if (data) quizData = data;
  renderScreen(to);
  const el = document.getElementById('screen-'+to);
  el.classList.add('active');
  el.scrollTop = 0;
  window.scrollTo(0,0);
}

// ─── DOWNLOAD ─────────────────────────────────────────────────────────────────
function downloadApp() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'revisions-ais.html';
  a.click();
}

// ─── QUIT MODAL ───────────────────────────────────────────────────────────────
function openQuitModal() {
  const correct = quizResults.filter(r=>r.correct).length;
  document.getElementById('quitScore').textContent = `${correct}/${quizResults.length} réponses correctes jusqu'ici (${quizResults.length > 0 ? Math.round(correct/quizResults.length*100) : 0}%)`;
  document.getElementById('quitModal').classList.add('open');
}
function closeQuitModal() {
  document.getElementById('quitModal').classList.remove('open');
}
function confirmQuit() {
  document.getElementById('quitModal').classList.remove('open');
  if (quizResults.length > 0) {
    navigate('results', { ...quizData, results: quizResults, questions: quizData.questions.slice(0, quizResults.length) });
  } else {
    navigate('home');
  }
}

// ─── SVG RING ─────────────────────────────────────────────────────────────────
function progressRing(pct, size=54, stroke=5, color='var(--accent)') {
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c-(pct/100)*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-card-alt)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset 0.6s ease"/>
  </svg>`;
}
function progressBar(pct, h=8, color='') {
  const col = color || 'var(--accent)';
  return `<div class="progress-bar" style="height:${h}px"><div class="progress-bar-inner" style="width:${pct}%;background:${col}"></div></div>`;
}
function barColor(cpct) {
  return cpct >= 80 ? 'var(--success)' : cpct >= 50 ? 'var(--warning)' : 'var(--accent)';
}

// ─── SCREENS ──────────────────────────────────────────────────────────────────
function renderScreen(screen) {
  const el = document.getElementById('screen-'+screen);
  if (screen==='home') el.innerHTML = renderHome();
  else if (screen==='chapters') el.innerHTML = renderChapters();
  else if (screen==='groups') el.innerHTML = renderGroups();
  else if (screen==='coursehub') el.innerHTML = renderCourseHub();
  else if (screen==='course') el.innerHTML = renderCourse();
  else if (screen==='memoire') el.innerHTML = renderMemoire();
  else if (screen==='quiz') { quizIdx=0; quizResults=[]; quizAnswered=false; quizSelected=null; el.innerHTML = renderQuiz(); }
  else if (screen==='results') el.innerHTML = renderResults();
}

        <div style="opacity:0.7;font-size:20px">›</div>
      </button>
      <button class="btn card-hover" onclick="startChapter('q120')" style="background:linear-gradient(135deg,#3d2e1f 0%,#5C4A31 100%);border-radius:16px;padding:20px 24px;color:#FDF6F0;display:flex;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(93,74,49,0.25);animation:slideUp 0.65s ease">

        <div style="text-align:left;flex:1">

      <button class="btn card-hover" onclick="navigate('coursehub')" style="background:var(--bg-card);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);animation:slideUp 0.7s ease;border:2px solid var(--bg-card-alt)">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#F0E6DA,#E8DDD0);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📚</div>
        <div style="text-align:left;flex:1">
          <div style="font-weight:600;font-size:16px;color:var(--text)">Cours & Théorie</div>

        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#E8DDD0,#D4C4AE);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">📄</div>
        <div style="text-align:left;flex:1">
          <div style="font-weight:600;font-size:16px;color:var(--text)">Mon Mémoire — Fiche de révision</div>
          <div style="font-size:13px;color:var(--text-light);margin-top:2px">Glossaire complet + tous les concepts à maîtriser</div>

    <div style="margin-top:28px">

      Réinitialiser la progression
    </button>`;
}

function renderChapters() {
  const rows = chapters.map((ch,i) => {
    const p = getChapterPct(ch.id);
    const cp = getChapterCorrectPct(ch.id);
    return `<button class="btn card-hover" onclick="startChapter('${ch.id}')" style="background:var(--bg-card);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);animation:slideUp ${0.2+i*0.05}s ease;text-align:left;width:100%">
      <div style="font-size:28px;width:44px;text-align:center">${ch.icon}</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px">${ch.title}</div>
        <div style="font-size:12px;color:var(--text-light);margin-bottom:8px">${ch.questions.length} questions</div>
        ${progressBar(p,6,barColor(cp))}
      </div>
      <div style="text-align:center;min-width:44px">
        ${progressRing(cp,44,4,cp>=80?'var(--success)':'var(--accent)')}
        <div style="font-size:10px;color:var(--text-light);margin-top:2px">${cp}%</div>
      </div>
    </button>`;
  }).join('');
  return `
    <button class="btn" onclick="navigate('home')" style="background:none;color:var(--accent);font-size:15px;font-weight:500;padding:20px 0;display:flex;align-items:center;gap:6px">‹ Accueil</button>
    <h2 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--accent-dark);margin-bottom:20px">Chapitres</h2>
    <div style="display:flex;flex-direction:column;gap:12px">${rows}</div>`;
}

function renderGroups() {
  const rows = chapterGroups.map((g,i) => {
    const gChs = chapters.filter(c => g.chapterIds.includes(c.id));
    const totalQ = gChs.reduce((s,c) => s+c.questions.length, 0);
    const avgPct = Math.round(g.chapterIds.reduce((s,id) => s+getChapterPct(id), 0) / g.chapterIds.length);
    const tags = gChs.map(ch => `<span style="font-size:11px;padding:3px 10px;border-radius:20px;background:var(--bg-card-alt);color:var(--text-light)">${ch.icon} ${ch.title}</span>`).join('');
    return `<button class="btn card-hover" onclick="startGroup('${g.id}')" style="background:var(--bg-card);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);text-align:left;width:100%;animation:slideUp ${0.2+i*0.1}s ease">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
        <div style="font-size:28px">${g.icon}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:16px;color:var(--text)">${g.title}</div>
          <div style="font-size:12px;color:var(--text-light);margin-top:2px">${totalQ} questions • 20 tirées au sort</div>
        </div>
        <div style="font-size:22px;font-weight:700;color:var(--accent)">${avgPct}%</div>
      </div>
      ${progressBar(avgPct,6)}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${tags}</div>
    </button>`;
  }).join('');
  return `
    <button class="btn" onclick="navigate('home')" style="background:none;color:var(--accent);font-size:15px;font-weight:500;padding:20px 0;display:flex;align-items:center;gap:6px">‹ Accueil</button>
    <h2 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--accent-dark);margin-bottom:20px">Examens par groupe</h2>
    <div style="display:flex;flex-direction:column;gap:14px">${rows}</div>`;
}

function renderCourseHub() {
  const rows = courses.map((c,i) => {
    const mod = extraModules.find(m => m.id === c.quizId);
    const cp = mod ? getChapterCorrectPct(mod.id) : 0;
    return `<button class="btn card-hover" onclick="openCourse('${c.id}')" style="background:var(--bg-card);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);animation:slideUp ${0.2+i*0.1}s ease;text-align:left;width:100%">
      <div style="font-size:28px;width:44px;text-align:center">${c.icon}</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:15px;color:var(--text)">${c.title}</div>
        <div style="font-size:12px;color:var(--text-light);margin-top:2px">Théorie + quiz d'entraînement</div>
      </div>
      <div style="text-align:center;min-width:40px">
        ${progressRing(cp,36,4,cp>=80?'var(--success)':'var(--accent)')}
      </div>
    </button>`;
  }).join('');
  return `
    <button class="btn" onclick="navigate('home')" style="background:none;color:var(--accent);font-size:15px;font-weight:500;padding:20px 0;display:flex;align-items:center;gap:6px">‹ Accueil</button>
    <h2 style="font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--accent-dark);margin-bottom:8px">Cours & Théorie</h2>
    <p style="color:var(--text-light);font-size:14px;margin-bottom:20px">Trois modules essentiels pour l'AIS, avec une explication pas à pas suivie d'un quiz pour t'entraîner.</p>
    <div style="display:flex;flex-direction:column;gap:12px">${rows}</div>`;
}

function openCourse(id) {
  currentCourseId = id;
  navigate('course');
}
function renderCourse() {
  const c = courses.find(x => x.id === currentCourseId);
  if (!c) return '';
  return `
    <button class="btn" onclick="navigate('coursehub')" style="background:none;color:var(--accent);font-size:15px;font-weight:500;padding:20px 0;display:flex;align-items:center;gap:6px">‹ Cours & Théorie</button>
    <div class="course-content" style="background:var(--bg-card);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:20px;animation:slideUp 0.3s ease">
      ${c.html}
    </div>
    <button class="btn" onclick="startChapter('${c.quizId}')" style="width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#FDF6F0;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(93,74,49,0.2)">
      Commencer le quiz →
    </button>`;
}

function renderMemoire() {
  return `
    <button class="btn" onclick="navigate('home')" style="background:none;color:var(--accent);font-size:15px;font-weight:500;padding:20px 0;display:flex;align-items:center;gap:6px">‹ Accueil</button>
    <div class="course-content" style="background:var(--bg-card);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:24px;animation:slideUp 0.3s ease">
      ${memoireHtml}
    </div>`;
}

function renderQuiz() {
  return `<div id="quiz-inner"></div>`;
}

// Builds the "always shown" explanation panel: works for BOTH the new rich
// format ({def, why[]}) used by all newly-added content, and the legacy
// single-string format ({explain}) used by the original 9 chapters.
function renderExplanationBox(q, isCorrect) {
  const boxClass = isCorrect ? 'correct-explain' : 'wrong-explain';
  const header = isCorrect
    ? `<div style="font-weight:700;color:var(--success);margin-bottom:8px;font-size:13.5px">✅ Bonne réponse — voici pourquoi, en détail</div>`
    : `<div style="font-weight:700;color:var(--error);margin-bottom:8px;font-size:13.5px">❌ Pas tout à fait — comprenons pourquoi</div>`;

  if (q.why && Array.isArray(q.why)) {
    const defHtml = q.def ? `<div class="def-box">📖 ${linkTerms(q.def)}</div>` : '';
    const rows = q.options.map((opt, i) => {
      const isAns = i === q.answer;
      const icon = isAns ? '✅' : '❌';
      const color = isAns ? 'var(--success)' : 'var(--error)';
      const label = String.fromCharCode(65+i);
      return `<div class="why-row">
        <span style="flex-shrink:0;font-weight:700;color:${color}">${icon} ${label}.</span>
        <span>${linkTerms(q.why[i] || '')}</span>
      </div>`;
    }).join('');
    return `<div class="explanation-box ${boxClass}">${header}${defHtml}${rows}</div>`;
  }
  // Legacy format (original 9 chapters): single explain string, shown always now.
  const legacyText = q.explain ? linkTerms(q.explain) : '';
  return `<div class="explanation-box ${boxClass}">${header}<div style="font-size:13.5px;color:var(--text);line-height:1.6">${legacyText}</div>
    ${!isCorrect ? `<div style="margin-top:10px;font-size:13px;color:var(--success);font-weight:600">✅ Bonne réponse : ${q.options[q.answer]}</div>` : ''}
  </div>`;
}

function renderQuizQuestion() {
  const el = document.getElementById('quiz-inner');
  if (!el) return;
  const { title, questions } = quizData;
  const q = questions[quizIdx];
  const pct = Math.round(quizIdx / questions.length * 100);

  const optButtons = q.options.map((opt, oi) => {
    let extra = '';
    if (quizAnswered) {
      if (oi === q.answer) extra = 'correct';
      else if (oi === quizSelected && oi !== q.answer) extra = 'wrong';
    }
    const labelBg = quizAnswered && oi===q.answer ? 'var(--success)' : quizAnswered && oi===quizSelected ? 'var(--error)' : 'var(--bg-card-alt)';
    const labelColor = quizAnswered && (oi===q.answer||oi===quizSelected) ? '#fff' : 'var(--text-light)';
    return `<button class="option-btn ${extra}" ${quizAnswered?'disabled':''} onclick="selectAnswer(${oi})" style="animation:slideUp ${0.2+oi*0.06}s ease">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;margin-right:12px;font-size:13px;font-weight:600;background:${labelBg};color:${labelColor};transition:all 0.25s ease;flex-shrink:0">${String.fromCharCode(65+oi)}</span>${opt}
    </button>`;
  }).join('');

  let explainBox = '';
  if (quizAnswered) explainBox = renderExplanationBox(q, quizSelected===q.answer);

  const nextBtn = quizAnswered ? `<button class="btn" onclick="nextQuestion()" style="width:100%;padding:16px;border-radius:14px;margin-top:20px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#FDF6F0;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(93,74,49,0.2);animation:pop 0.3s ease">
    ${quizIdx+1 >= questions.length ? 'Voir les résultats 🎯' : 'Question suivante →'}
  </button>` : '';

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding-top:20px;padding-bottom:16px">
      <button class="btn" onclick="openQuitModal()" style="background:none;color:var(--accent);font-size:22px;padding:4px 8px;line-height:1;border-radius:8px;border:1.5px solid var(--bg-card-alt)">✕</button>
      <div style="flex:1">${progressBar(pct,8)}</div>
      <span style="font-size:14px;font-weight:600;color:var(--accent);min-width:50px;text-align:right">${quizIdx+1}/${questions.length}</span>
    </div>
    <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">${title}</div>
    <div key="${quizIdx}" style="background:var(--bg-card);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow);animation:pop 0.35s ease">
      <div style="font-size:17px;font-weight:600;line-height:1.5;color:var(--text)">${q.q}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${optButtons}
    </div>
    ${explainBox}
    ${nextBtn}`;
}

function selectAnswer(oi) {
  if (quizAnswered) return;
  quizSelected = oi;
  quizAnswered = true;
  const q = quizData.questions[quizIdx];
  const correct = oi === q.answer;
  quizResults.push({ correct });
  if (q.chId !== undefined) {
    updateProgress(q.chId, q.origIdx, correct);
  }
  renderQuizQuestion();
}

function nextQuestion() {
  if (quizIdx+1 >= quizData.questions.length) {
    navigate('results', { ...quizData, results: quizResults });
    return;
  }
  quizIdx++;
  quizAnswered = false;
  quizSelected = null;
  renderQuizQuestion();
}

function renderResults() {
  const { title, results, questions } = quizData;
  const correct = results.filter(r=>r.correct).length;
  const total = results.length;
  const pct = Math.round((correct/total)*100);
  const grade = pct>=80?'Excellent !':pct>=60?'Bien !':pct>=40?'À revoir':'À travailler';
  const gradeColor = pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--error)';
  const gradeEmoji = pct>=80?'🏆':pct>=60?'👍':pct>=40?'📖':'💪';

  const reviewItems = results.map((r,i) => {
    const q = questions[i];
    const short = q?.explain ? q.explain.substring(0,120) : (q?.def ? q.def.replace(/\[\[([a-zA-Z0-9_\-]+)(?::([^\]]+))?\]\]/g,(m,k,d)=>d||k).substring(0,120) : '');
    return `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--bg-card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);border-left:3px solid ${r.correct?'var(--success)':'var(--error)'};animation:slideUp ${0.2+i*0.03}s ease">
      <span style="font-size:16px;flex-shrink:0;margin-top:1px">${r.correct?'✅':'❌'}</span>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--text);line-height:1.4">${q?.q?.substring(0,80)}${q?.q?.length>80?'...':''}</div>
        ${!r.correct && short ? `<div style="font-size:12px;color:var(--text-light);margin-top:4px;line-height:1.4">💡 ${short}${short.length>=120?'...':''}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div style="text-align:center;padding-top:48px;padding-bottom:20px;animation:pop 0.5s ease">
      <div style="font-size:60px;margin-bottom:8px">${gradeEmoji}</div>
      <h2 style="font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--accent-dark);margin-bottom:6px">${grade}</h2>
      <p style="color:var(--text-light);font-size:14px">${title}</p>
    </div>
    <div style="background:var(--bg-card);border-radius:20px;padding:28px;text-align:center;box-shadow:var(--shadow-lg);margin-bottom:24px;animation:slideUp 0.4s ease">
      <div style="position:relative;display:inline-block;margin-bottom:16px">
        ${progressRing(pct,120,10,gradeColor)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span style="font-size:32px;font-weight:700;color:${gradeColor}">${pct}%</span>
        </div>
      </div>
      <div style="display:flex;justify-content:center;gap:32px">
        <div><div style="font-size:24px;font-weight:700;color:var(--success)">${correct}</div><div style="font-size:12px;color:var(--text-light)">Correctes</div></div>
        <div style="width:1px;background:var(--bg-card-alt)"></div>
        <div><div style="font-size:24px;font-weight:700;color:var(--error)">${total-correct}</div><div style="font-size:12px;color:var(--text-light)">Incorrectes</div></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px">Résumé des réponses</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">${reviewItems}</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" onclick="navigate('home')" style="width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#FDF6F0;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(93,74,49,0.2)">Retour à l'accueil</button>
      <button class="btn" onclick="restartQuiz()" style="width:100%;padding:14px;border-radius:14px;background:transparent;border:2px solid var(--accent-light);color:var(--accent);font-size:15px;font-weight:600">Recommencer 🔄</button>
    </div>`;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function startChapter(chId) {
  const ch = findModule(chId);
  const qs = shuffle(ch.questions.map((q,idx) => ({...q, chId:ch.id, origIdx:idx})));
  navigate('quiz', { title:ch.title, questions:qs, mode:'chapter', chapterId:ch.id });
}
function startGroup(gId) {
  const g = chapterGroups.find(g => g.id===gId);
  const gChs = chapters.filter(c => g.chapterIds.includes(c.id));
  const qs = [];
  gChs.forEach(ch => ch.questions.forEach((q,idx) => qs.push({...q, chId:ch.id, origIdx:idx})));
  navigate('quiz', { title:`Examen : ${g.title}`, questions:shuffle(qs).slice(0,20), mode:'group-exam' });
}
function startGlobalExam() {
  const allQ = [];
  chapters.forEach(ch => ch.questions.forEach((q,i) => allQ.push({...q, chId:ch.id, origIdx:i})));
  navigate('quiz', { title:'Examen Blanc Global', questions:shuffle(allQ).slice(0,40), mode:'exam' });
}
function restartQuiz() {
  const qs = shuffle(quizData.questions);
  navigate('quiz', { ...quizData, questions:qs });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadProgress();
renderScreen('home');
document.getElementById('screen-home').classList.add('active');

// Render first quiz question after navigating to the quiz screen.
const _origNavigate = navigate;
window.navigate = function(to, data) {
  _origNavigate(to, data);
  if (to === 'quiz') {
    setTimeout(() => renderQuizQuestion(), 0);
  }
};
navigate('home');
</script>
