open source sous Linux, sans rapport avec Lotus.", "Sendmail est un autre MTA historique sous Unix, également sans lien avec Lotus/IBM."]}, {"q": "Quel est le protocole de messagerie propriétaire utilisé par le client Outlook avec Exchange ?", "options": ["IMAP", "POP3", "MAPI", "SIP"], "answer": 2, "def": "MAPI (Messaging API)* est le protocole propriétaire Microsoft utilisé en profondeur par Outlook pour dialoguer avec Exchange (calendrier, contacts, mails...).", "why": ["IMAP est un protocole ouvert et standard, utilisable par de nombreux clients différents, pas propriétaire à Microsoft.", "POP3 est également un protocole standard ouvert, sans lien avec l'écosystème propriétaire Outlook/Exchange.", "Correct : MAPI est le protocole natif et propriétaire qu'Outlook utilise pour exploiter toutes les fonctionnalités riches d'Exchange (pas seulement le mail, mais aussi calendrier et contacts).", "SIP est un protocole de signalisation VoIP, totalement hors du contexte de la messagerie Exchange/Outlook."]}, {"q": "Quel est le nom du client/service de messagerie de Microsoft utilisé pour lire ses emails ?", "options": ["Thunderbird", "Outlook", "Evolution", "Apple Mail"], "answer": 1, "def": "Outlook* est le client de messagerie phare de Microsoft, étroitement intégré à Exchange (via MAPI) et Microsoft 365.", "why": ["Thunderbird est un client de messagerie open source de Mozilla, pas un produit Microsoft.", "Correct : Outlook est LE client de messagerie développé par Microsoft, disponible en version bureau et web (OWA).", "Evolution est le client de messagerie historique de l'environnement GNOME sous Linux, pas un produit Microsoft.", "Apple Mail est le client de messagerie natif de macOS/iOS, développé par Apple et non par Microsoft."]}, {"q": "Qu'est-ce que le Load Balancing ?", "options": ["Le chiffrement des sauvegardes", "La répartition de charge entre plusieurs serveurs", "La détection d'intrusion", "Le blocage des ports inutiles"], "answer": 1, "def": "Le Load Balancing* distribue les requêtes entrantes sur plusieurs serveurs pour améliorer performance et disponibilité.", "why": ["Le chiffrement des sauvegardes concerne la protection des données stockées, sans rapport avec la répartition de charge.", "Correct : un répartiteur de charge (load balancer) distribue le trafic entre plusieurs serveurs backend équivalents.", "La détection d'intrusion est le rôle d'un IDS, une fonction de sécurité différente du load balancing.", "Le blocage de ports est une fonction de pare-feu (filtrage), pas de répartition de charge."]}, {"q": "Qu'est-ce qu'un IDS ?", "options": ["Un système de détection d'intrusion", "Un répartiteur de charge", "Un serveur DNS interne", "Un protocole de chiffrement"], "answer": 0, "def": "Un IDS (Intrusion Detection System)* surveille le trafic ou les journaux pour repérer des comportements suspects, sans forcément bloquer (contrairement à un IPS).", "why": ["Correct : l'IDS analyse en continu le trafic/les logs pour détecter des signatures ou comportements d'attaque, et alerter l'administrateur.", "Un répartiteur de charge distribue le trafic entre serveurs, une fonction de performance et non de sécurité.", "Un serveur DNS interne résout des noms en IP, sans lien avec la détection d'intrusion.", "Un protocole de chiffrement protège la confidentialité des données, ce n'est pas un outil de détection d'attaque."]}, {"q": "Qu'est-ce qu'un proxy transparent ?", "options": ["Un proxy configuré manuellement par chaque utilisateur", "Un proxy imposé par le réseau/FAI sans configuration côté client", "Un proxy qui chiffre systématiquement le trafic", "Un proxy réservé aux connexions VPN"], "answer": 1, "def": "Un proxy transparent* intercepte le trafic au niveau du réseau (routeur/pare-feu) sans que l'utilisateur n'ait rien à configurer sur son poste.", "why": ["C'est l'inverse d'un proxy transparent : celui-ci ne nécessite aucune configuration manuelle côté client.", "Correct : le proxy transparent redirige automatiquement le trafic (souvent HTTP) sans configuration explicite sur le poste utilisateur, l'utilisateur ignore parfois même qu'il passe par un proxy.", "Le proxy transparent n'ajoute pas nécessairement de chiffrement, sa particularité est d'être invisible pour l'utilisateur, pas de sécuriser le trafic.", "Il n'est pas réservé aux connexions VPN ; il s'agit d'une technique d'interception de trafic générale, indépendante du VPN."]}, {"q": "Qu'est-ce que l'ingénierie sociale (Social Engineering) ?", "options": ["Une technique de chiffrement avancée", "L'exploitation de failles humaines (manipulation) pour obtenir des informations ou un accès", "Un protocole de routage social", "Une méthode de sauvegarde collaborative"], "answer": 1, "def": "L'ingénierie sociale* manipule la psychologie humaine (confiance, urgence, autorité) plutôt que d'exploiter une faille technique.", "why": ["L'ingénierie sociale ne relève pas de la cryptographie, mais de la manipulation psychologique.", "Correct : elle consiste à tromper une personne (phishing, prétexting, appel téléphonique frauduleux...) pour obtenir un accès ou une information sensible.", "Il n'existe pas de 'protocole de routage social', cette réponse est fictive et sans rapport avec le sujet.", "Il ne s'agit pas d'une méthode de sauvegarde de données, mais d'une technique d'attaque ciblant l'humain."]}, {"q": "Qu'est-ce qu'une attaque SYN Flood ?", "options": ["Une attaque qui inonde une victime de mails", "Une attaque par déni de service exploitant l'établissement de connexion TCP (SYN, SYN-ACK, ACK)", "Une attaque de force brute sur un mot de passe", "Une attaque qui modifie les tables de routage"], "answer": 1, "def": "Le SYN Flood* envoie une multitude de paquets SYN* sans jamais terminer la poignée de main TCP (three-way handshake* : SYN → SYN-ACK → ACK), saturant les ressources du serveur qui attend chaque ACK final.", "why": ["Le bombardement de mails est plutôt du spam ou du mail-bombing, pas un SYN Flood qui cible la couche transport TCP.", "Correct : l'attaquant envoie de nombreux paquets SYN (demande de connexion) sans jamais répondre au SYN-ACK du serveur avec l'ACK final, laissant des connexions à moitié ouvertes qui épuisent les ressources serveur : c'est un déni de service (DoS).", "La force brute teste des mots de passe successifs, un principe différent d'une saturation de connexions réseau.", "Modifier des tables de routage relèverait plutôt d'une attaque de type usurpation de routage (BGP hijacking), pas d'un SYN Flood."]}, {"q": "Citez un protocole de couche 2 utilisable pour un VPN.", "options": ["IPSec (couche 3)", "L2TP ou PPTP", "BGP", "OSPF"], "answer": 1, "def": "Les VPN de couche 2* transportent des trames entières (et non juste des paquets IP), contrairement à IPSec qui opère en couche 3.", "why": ["IPSec fonctionne en couche 3 (il chiffre/encapsule les paquets IP), ce n'est donc pas un protocole de couche 2.", "Correct : L2TP (Layer 2 Tunneling Protocol) et PPTP créent des tunnels qui encapsulent des trames de couche 2.", "BGP est un protocole de routage entre systèmes autonomes, sans rapport avec les tunnels VPN de couche 2.", "OSPF est un protocole de routage interne à état de lien, également sans lien avec les VPN de couche 2."]}, {"q": "À quoi sert une DMZ (zone démilitarisée) ?", "options": ["À accélérer le trafic Internet", "À isoler des serveurs exposés du reste du réseau interne, pour limiter les dégâts en cas de compromission", "À chiffrer systématiquement les communications", "À remplacer le pare-feu"], "answer": 1, "def": "La DMZ* est une zone tampon entre Internet et le LAN, où l'on place les services exposés (web, mail) pour ne pas exposer directement le réseau interne.", "why": ["La DMZ n'a aucun effet sur la vitesse du trafic Internet, son rôle est purement sécuritaire.", "Correct : en isolant les serveurs exposés dans une zone séparée (comme un VLAN dédié), un serveur DMZ compromis ne peut pas directement atteindre le réseau interne sensible.", "La DMZ elle-même ne chiffre rien, elle segmente le réseau ; le chiffrement est une fonction séparée (TLS, IPSec...).", "La DMZ complète le pare-feu (qui la délimite et filtre les flux vers/depuis elle), elle ne le remplace pas."]}, {"q": "Citez un exemple de pare-feu (firewall).", "options": ["Wireshark", "pfSense (ou le pare-feu Windows)", "Nslookup", "Netstat"], "answer": 1, "def": "Un pare-feu* filtre le trafic réseau entrant/sortant selon des règles, contrairement à un simple outil d'analyse.", "why": ["Wireshark est un analyseur de paquets (sniffer), un outil de diagnostic, pas un pare-feu.", "Correct : pfSense (distribution dédiée) ou le pare-feu intégré à Windows sont des exemples concrets de pare-feux filtrant le trafic.", "Nslookup interroge le DNS, ce n'est pas un outil de filtrage réseau.", "Netstat liste les connexions actives d'une machine, il n'a pas de fonction de filtrage/blocage."]}, {"q": "Citez une méthode de filtrage réseau (pare-feu) sous Linux.", "options": ["Regedit", "iptables (ou nftables)", "MMC", "GPO"], "answer": 1, "def": "iptables* (et son successeur nftables) est l'outil natif de filtrage de paquets du noyau Linux (Netfilter).", "why": ["Regedit édite le registre Windows, un outil totalement propre à Windows, sans équivalent en filtrage Linux.", "Correct : iptables (ou nftables aujourd'hui) permet de définir des règles de filtrage/NAT au niveau du noyau Linux.", "MMC est une console d'administration Windows, sans équivalent direct comme outil de filtrage sous Linux.", "Les GPO sont des stratégies de groupe Windows/Active Directory, sans rapport avec le filtrage réseau Linux."]}, {"q": "Citez une méthode de filtrage sous un équipement Cisco.", "options": ["iptables", "Les ACL (Access Control Lists)", "GPO", "Regedit"], "answer": 1, "def": "Les ACL Cisco* filtrent le trafic selon des critères (IP source/destination, port...) appliqués sur une interface.", "why": ["iptables est l'équivalent Linux, pas la solution native de filtrage sur un équipement Cisco.", "Correct : les listes de contrôle d'accès (ACL) standard ou étendues permettent de filtrer le trafic sur les routeurs/switches Cisco.", "Les GPO sont propres à l'environnement Windows/Active Directory, sans équivalent direct sur Cisco.", "Regedit est un outil Windows de modification du registre, sans rapport avec le filtrage réseau Cisco."]}, {"q": "Quel est le successeur du chargeur de démarrage LILO sous Linux ?", "options": ["SYSV", "GRUB", "systemd", "Cron"], "answer": 1, "def": "GRUB (GRand Unified Bootloader)* a remplacé LILO en offrant plus de flexibilité (menu interactif, support de multiples OS/noyaux).", "why": ["SYSV désigne un système d'initialisation historique (SysV init), pas un chargeur de démarrage (bootloader).", "Correct : GRUB a progressivement remplacé LILO comme bootloader standard sur la plupart des distributions Linux.", "systemd est le système d'initialisation moderne des services, un rôle différent d'un chargeur de démarrage bas niveau.", "Cron est le planificateur de tâches périodiques sous Linux, sans rapport avec le démarrage du système."]}, {"q": "Quel symbole de redirection Linux permet d'AJOUTER du contenu à un fichier sans l'écraser ?", "options": [">", "<", ">>", "|"], "answer": 2, "def": "L'opérateur >>* ajoute (append) le résultat à la fin du fichier, contrairement à > qui écrase tout le contenu existant.", "why": ["Le simple '>' écrase entièrement le fichier de destination avant d'y écrire, l'inverse du besoin exprimé.", "'<' redirige une entrée depuis un fichier vers une commande, ce n'est pas une redirection de sortie.", "Correct : '>>' ajoute la sortie à la fin du fichier existant, en conservant son contenu précédent.", "Le pipe '|' envoie la sortie d'une commande vers l'entrée d'une autre commande, ce n'est pas une redirection vers un fichier."]}, {"q": "Quel est le runlevel typique d'un Ubuntu Server au démarrage (multi-utilisateur, réseau, sans interface graphique) ?", "options": ["Niveau 1", "Niveau 3", "Niveau 5", "Niveau 6"], "answer": 1, "def": "Le runlevel 3* correspond au mode multi-utilisateur avec réseau, mais sans interface graphique, typique d'un serveur.", "why": ["Le niveau 1 est le mode mono-utilisateur (maintenance), pas le mode normal de démarrage d'un serveur.", "Correct : le niveau 3 démarre le réseau et les services en mode texte, sans lancer d'environnement graphique — l'idéal pour un serveur.", "Le niveau 5 correspond au mode multi-utilisateur AVEC interface graphique, typique d'un poste de bureau, pas d'un serveur.", "Le niveau 6 correspond au redémarrage (reboot) du système, ce n'est pas un état de fonctionnement normal."]}, {"q": "Quelle commande Linux affiche le nombre d'octets, de mots et de lignes d'un fichier ?", "options": ["find", "pwd", "wc", "bind"], "answer": 2, "def": "wc (word count)* donne par défaut trois chiffres : lignes, mots, octets d'un fichier.", "why": ["find recherche des fichiers selon des critères, il ne compte pas les octets/mots/lignes d'un fichier.", "pwd affiche le répertoire de travail courant, sans lien avec le comptage de contenu.", "Correct : 'wc fichier.txt' affiche lignes, mots et octets, dans cet ordre par défaut.", "bind est une commande liée à la gestion du shell (raccourcis clavier), sans rapport avec le comptage d'un fichier."]}, {"q": "Quelle commande Linux affiche le chemin du répertoire courant (où l'on se situe dans l'arborescence) ?", "options": ["cd", "ls", "pwd", "cat"], "answer": 2, "def": "pwd (Print Working Directory)* renvoie le chemin absolu du dossier dans lequel on se trouve actuellement.", "why": ["cd sert à SE DÉPLACER dans l'arborescence, pas à afficher où l'on se trouve.", "ls liste le contenu du répertoire courant, sans afficher son chemin complet.", "Correct : pwd affiche précisément le chemin absolu du répertoire de travail actuel.", "cat affiche le contenu d'un fichier, sans rapport avec la localisation dans l'arborescence."]}, {"q": "Quel est le chemin d'accès typique au dossier personnel de l'utilisateur 'toto' sous Linux ?", "options": ["/root/toto/", "/home/toto/", "/usr/toto/", "/etc/toto/"], "answer": 1, "def": "Les répertoires personnels des utilisateurs standards se trouvent sous /home*, chacun ayant son propre sous-dossier.", "why": ["/root/ est réservé au compte administrateur root, pas aux utilisateurs standards comme 'toto'.", "Correct : chaque utilisateur non-root a son répertoire personnel sous /home/, ici /home/toto/.", "/usr/ contient les programmes et ressources partagées du système, pas les dossiers personnels des utilisateurs.", "/etc/ contient les fichiers de configuration système, pas les répertoires personnels des utilisateurs."]}, {"q": "Quelle(s) commande(s) Linux permettent de supprimer un répertoire ?", "options": ["mkdir", "touch", "rm (-r) ou rmdir", "cat"], "answer": 2, "def": "rmdir* supprime un dossier VIDE, tandis que 'rm -r'* supprime un dossier même non vide (avec son contenu).", "why": ["mkdir sert au contraire à CRÉER un répertoire, pas à le supprimer.", "touch crée un fichier vide ou met à jour sa date de modification, sans lien avec la suppression de dossier.", "Correct : rmdir supprime un dossier vide ; 'rm -r' (récursif) supprime un dossier avec tout son contenu.", "cat affiche le contenu d'un fichier texte, aucun rapport avec la suppression de répertoires."]}, {"q": "Que signifient les chiffres dans le nom d'une distribution Ubuntu, par exemple '09.10' ?", "options": ["Le numéro de version majeure/mineure classique (comme 9.10)", "L'année et le mois de sortie (octobre 2009)", "Le nombre de paquets inclus", "Le numéro de build interne"], "answer": 1, "def": "Ubuntu adopte un schéma de versionnage calendaire* : AA.MM (année à deux chiffres, puis mois).", "why": ["Ce n'est pas une simple version logicielle classique incrémentale, mais un calendrier précis.", "Correct : '09.10' signifie année 2009, mois 10 (octobre) — c'est la date de sortie de la version.", "Le nombre de paquets inclus n'a jamais fait partie du système de numérotation d'Ubuntu.", "Ce n'est pas non plus un numéro de build interne, mais bien une convention publique année.mois."]}, {"q": "À quoi sert le raccourci clavier Ctrl+Alt+F2 sous Linux ?", "options": ["Fermer la session en cours", "Changer de terminal virtuel (TTY)", "Redémarrer le système immédiatement", "Ouvrir le gestionnaire de paquets"], "answer": 1, "def": "Linux propose plusieurs consoles virtuelles* (TTY) accessibles via Ctrl+Alt+F1 à F6/F7, chacune étant une session indépendante.", "why": ["Ce raccourci ne ferme pas la session, il bascule simplement vers un autre terminal virtuel.", "Correct : Ctrl+Alt+F2 (ou F1, F3...) permet de basculer entre les différents terminaux virtuels (TTY) du système.", "Aucun redémarrage n'est déclenché par ce raccourci, juste un changement d'écran de connexion.", "Ce raccourci n'ouvre aucun gestionnaire de paquets, il change seulement de console virtuelle."]}, {"q": "Linux est-il un logiciel Freeware, Shareware, ou ni l'un ni l'autre ?", "options": ["Freeware", "Shareware", "Ni l'un ni l'autre : logiciel libre sous licence GPL", "Un logiciel propriétaire payant"], "answer": 2, "def": "Linux (le noyau) est distribué sous licence GPL*, garantissant la liberté d'utiliser, modifier et redistribuer le code source, ce qui diffère du simple 'gratuit' (freeware) ou 'à l'essai' (shareware).", "why": ["Un freeware est gratuit mais généralement fermé (sans code source ni droit de modification) — ce n'est pas la définition de Linux.", "Un shareware est un logiciel d'essai limité dans le temps ou les fonctionnalités, ce qui ne correspond pas du tout à Linux.", "Correct : Linux est un logiciel libre (GPL) : le code source est ouvert, modifiable et redistribuable, une notion plus riche que la simple gratuité.", "Linux n'est pas un logiciel propriétaire payant ; sa nature open source et gratuite s'oppose justement à ce modèle."]}, {"q": "Citez un hyperviseur.", "options": ["Docker", "Hyper-V (ou VMware ESXi, Proxmox...)", "Wireshark", "Apache"], "answer": 1, "def": "Un hyperviseur* virtualise le matériel pour exécuter plusieurs machines virtuelles complètes (chacune avec son propre OS).", "why": ["Docker fait de la conteneurisation (partage du même noyau), une approche différente d'un hyperviseur qui virtualise le matériel complet.", "Correct : Hyper-V, VMware ESXi ou Proxmox sont des hyperviseurs qui exécutent des machines virtuelles complètes.", "Wireshark est un analyseur de paquets réseau, totalement hors sujet ici.", "Apache est un serveur web, sans rapport avec la virtualisation matérielle."]}, {"q": "Qu'est-ce que l'iSCSI ?", "options": ["Un protocole de virtualisation applicative", "Un protocole de stockage réseau qui encapsule le SCSI dans IP", "Un protocole VPN", "Un protocole de messagerie"], "answer": 1, "def": "iSCSI (Internet SCSI)* permet à un serveur d'accéder à un disque distant (SAN) comme s'il était local, via le réseau IP.", "why": ["iSCSI ne fait pas de virtualisation applicative (comme Docker), c'est un protocole d'accès au stockage.", "Correct : iSCSI transporte les commandes SCSI (disque) à travers un réseau IP classique, permettant de relier un serveur à du stockage distant (SAN).", "Ce n'est pas un protocole VPN, même si le trafic iSCSI peut être sécurisé séparément (CHAP, IPSec).", "Il n'a aucun rapport avec l'envoi/réception de messagerie électronique."]}, {"q": "Citez un logiciel de conteneurisation (souvent qualifié de paravirtualisation légère).", "options": ["VMware ESXi", "Docker", "Hyper-V", "VirtualBox"], "answer": 1, "def": "Docker* partage le noyau de la machine hôte (contrairement aux hyperviseurs qui virtualisent le matériel complet), rendant les conteneurs très légers.", "why": ["VMware ESXi est un hyperviseur bare-metal complet, qui virtualise tout le matériel, pas un simple moteur de conteneurs.", "Correct : Docker crée des conteneurs isolés qui partagent le noyau Linux de l'hôte, bien plus légers qu'une VM complète.", "Hyper-V est également un hyperviseur complet de Microsoft, différent du modèle de conteneurs de Docker.", "VirtualBox est un hyperviseur de type 2 (hosted), qui virtualise tout le matériel plutôt que de partager le noyau hôte."]}, {"q": "Citez un jeu d'instructions processeur dédié à l'accélération de la virtualisation.", "options": ["SSE4", "Intel VT-x (ou AMD-V)", "AVX2", "MMX"], "answer": 1, "def": "Intel VT-x et AMD-V* sont des extensions matérielles du processeur qui accélèrent et sécurisent l'exécution des machines virtuelles.", "why": ["SSE4 est un jeu d'instructions pour le calcul vectoriel (multimédia), sans lien avec la virtualisation.", "Correct : Intel VT-x et son équivalent AMD-V permettent au CPU de gérer nativement certaines opérations de virtualisation, sans quoi un hyperviseur devrait tout émuler logiciellement (bien plus lent).", "AVX2 accélère les calculs vectoriels avancés, sans rapport direct avec la virtualisation.", "MMX est un ancien jeu d'instructions multimédia des années 1990, sans lien avec la virtualisation matérielle."]}, {"q": "Que contient un fichier avec l'extension .VMDK ?", "options": ["Une configuration réseau VMware", "Le disque virtuel d'une machine virtuelle VMware", "Un instantané (snapshot) Hyper-V", "Un fichier de licence VMware"], "answer": 1, "def": "Le format .VMDK* (Virtual Machine Disk) est le fichier qui stocke le contenu du disque dur virtuel d'une VM VMware.", "why": ["La configuration réseau d'une VM VMware se trouve plutôt dans le fichier .vmx, pas .vmdk.", "Correct : le fichier .vmdk contient les données du disque dur virtuel utilisé par la machine virtuelle VMware.", "Les snapshots Hyper-V utilisent un format différent (.avhdx), pas le format VMDK propre à VMware.", "Un fichier de licence ne contiendrait aucune donnée de disque, contrairement au .vmdk qui stocke le disque virtuel entier."]}, {"q": "Citez un protocole utilisé en téléphonie sur IP (VoIP).", "options": ["FTP", "SIP (ou RTP/RTCP)", "SNMP", "NTP"], "answer": 1, "def": "SIP (Session Initiation Protocol)* établit/termine les appels, tandis que RTP/RTCP* transportent la voix elle-même.", "why": ["FTP sert au transfert de fichiers, sans rapport avec la téléphonie IP.", "Correct : SIP gère la signalisation (établissement d'appel) et RTP/RTCP le transport du flux audio/vidéo en VoIP.", "SNMP est un protocole de supervision réseau, sans lien avec la téléphonie sur IP.", "NTP synchronise l'horloge des équipements, un rôle bien différent de la VoIP."]}, {"q": "Citez une ancienne technologie de téléphonie numérique (avant la VoIP).", "options": ["SIP", "NUMERIS (RNIS/ISDN)", "RTP", "H.323"], "answer": 1, "def": "NUMERIS* est le nom commercial français du RNIS (réseau numérique à intégration de services, ISDN en anglais), technologie de téléphonie numérique antérieure à la VoIP.", "why": ["SIP est justement un protocole de VoIP moderne, pas une ancienne technologie de téléphonie numérique classique.", "Correct : NUMERIS (RNIS/ISDN) était la technologie de téléphonie numérique commercialisée par France Télécom avant la généralisation de la VoIP.", "RTP est également un protocole VoIP (transport de la voix), pas une ancienne téléphonie numérique classique.", "H.323 est un ensemble de protocoles de VoIP historiques, mais plus récent que la téléphonie numérique classique RNIS/NUMERIS."]}, {"q": "Qu'est-ce que le provisioning en téléphonie IP ?", "options": ["La facturation automatique des appels", "L'auto-configuration à distance d'un équipement téléphonique (téléphone IP)", "Le chiffrement de la voix", "La mise en attente d'un appel"], "answer": 1, "def": "Le provisioning* permet à un téléphone IP de récupérer automatiquement sa configuration (identifiants SIP, sonneries...) dès son branchement, sans intervention manuelle.", "why": ["La facturation des appels est une fonction distincte (taxation/CDR), sans lien avec le provisioning.", "Correct : le provisioning automatise la configuration des postes téléphoniques IP en masse, un gain de temps énorme pour l'administrateur.", "Le chiffrement de la voix (SRTP) est une fonction de sécurité séparée, pas le rôle du provisioning.", "La mise en attente d'un appel est une fonctionnalité utilisateur du téléphone, sans rapport avec sa configuration initiale."]}, {"q": "Citez un serveur IPBX (autocommutateur téléphonique IP) open source connu.", "options": ["Exchange", "Asterisk", "Postfix", "Samba"], "answer": 1, "def": "Asterisk* est le logiciel IPBX open source le plus connu, permettant de créer un standard téléphonique complet basé sur SIP.", "why": ["Exchange est un serveur de messagerie électronique Microsoft, sans rapport avec la téléphonie IPBX.", "Correct : Asterisk est LE logiciel IPBX open source de référence, à la base de nombreuses solutions commerciales (FreePBX...).", "Postfix est un serveur de messagerie (MTA) sous Linux, sans lien avec la téléphonie.", "Samba fournit des partages de fichiers/impression compatibles Windows sous Linux, sans rapport avec la VoIP."]}, {"q": "Quel type de VLAN doit-on utiliser pour sécuriser un réseau de téléphonie IP ?", "options": ["VLAN par port uniquement", "VLAN voix dédié (souvent basé MAC ou par port avec priorité QoS)", "Aucun VLAN n'est nécessaire", "VLAN natif uniquement"], "answer": 1, "def": "Un VLAN voix* dédié isole le trafic téléphonique du trafic data classique, facilitant la QoS et la sécurité.", "why": ["Le VLAN par port seul ne suffit pas à garantir une vraie séparation dédiée et la qualité de service nécessaire à la voix.", "Correct : on crée un VLAN voix séparé (souvent identifié par l'adresse MAC du téléphone ou une configuration dédiée), permettant d'appliquer une QoS prioritaire et d'isoler le trafic voix du trafic data.", "Ne pas segmenter le trafic voix expose au contraire à des risques (écoute, saturation, attaques) et à une qualité d'appel dégradée.", "Le VLAN natif est celui non-taggé par défaut sur un trunk, un concept différent du VLAN voix dédié à la téléphonie."]}];

const subnettingQ = [{"q": "Combien d'adresses IP utilisables trouve-t-on dans un réseau /24 ?", "options": ["254", "256", "255", "510"], "answer": 0, "def": "Un /24 laisse 8 bits pour la partie hôte* (32-24). 2^8=256 adresses totales, moins l'adresse réseau et le broadcast.", "why": ["Correct : 256 adresses totales - 2 (réseau + broadcast) = 254 adresses utilisables pour des machines.", "256 est le nombre total d'adresses (2^8), mais il faut en retirer 2 (réseau et broadcast) pour obtenir les adresses réellement utilisables.", "255 ne correspond à aucun calcul standard de ce type de masque (ce serait une simple confusion avec la valeur du dernier octet du masque /24).", "510 correspondrait à un /23 (2^9-2), un préfixe plus court donc un bloc deux fois plus grand qu'un /24."]}, {"q": "Quel masque en notation décimale correspond au préfixe /27 ?", "options": ["255.255.255.224", "255.255.255.240", "255.255.255.192", "255.255.255.248"], "answer": 0, "def": "/27 = 27 bits à 1. Sur le dernier octet, il reste 3 bits réseau (24+3=27) : 11100000 = 224.", "why": ["Correct : 11100000 en binaire = 128+64+32 = 224, donc 255.255.255.224 pour un /27.", "255.255.255.240 (11110000=240) correspond à un /28 (4 bits réseau sur le dernier octet), un bit de plus que /27.", "255.255.255.192 (11000000=192) correspond à un /26 (2 bits réseau sur le dernier octet), un bit de moins que /27.", "255.255.255.248 (11111000=248) correspond à un /29 (5 bits réseau sur le dernier octet), deux bits de plus que /27."]}, {"q": "Combien de machines utilisables offre un sous-réseau en /28 ?", "options": ["30", "14", "62", "16"], "answer": 1, "def": "/28 laisse 4 bits pour la partie hôte (32-28=4). 2^4=16 adresses totales, moins 2 réservées.", "why": ["Correct : 2^4=16 adresses totales, moins 2 réservées (réseau et broadcast) = 14 machines utilisables en /28.", "30 correspondrait à un /27 (2^5-2=30), un préfixe plus court (donc un bloc plus grand) que /28.", "62 correspondrait à un /26 (2^6-2=62), un préfixe bien plus court que /28.", "16 est le nombre total d'adresses du bloc, mais il ne faut pas oublier de retirer les 2 adresses réservées pour obtenir le nombre de machines utilisables."]}, {"q": "Quelle est l'adresse réseau du sous-réseau contenant 192.168.1.77/28 ?", "options": ["192.168.1.64/28", "192.168.1.0/28", "192.168.1.32/28", "192.168.1.77/28"], "answer": 0, "def": "Un /28 découpe le dernier octet en blocs de 16 (256/16=16 sous-réseaux : 0,16,32,48,64,80...).", "why": ["Correct : 77 se situe entre 64 et 79 (bloc de 16 commençant à 64), donc l'adresse réseau est 192.168.1.64/28.", "192.168.1.0/28 couvre les adresses 0 à 15, bien avant 77.", "192.168.1.32/28 couvre les adresses 32 à 47, .77 n'y appartient pas non plus.", "192.168.1.77/28 est une adresse d'hôte, pas l'adresse réseau du bloc (qui doit se terminer par un multiple de 16 ici)."]}, {"q": "Quelle est l'adresse de broadcast du sous-réseau 192.168.1.64/28 ?", "options": ["192.168.1.79", "192.168.1.95", "192.168.1.127", "192.168.1.255"], "answer": 0, "def": "Le bloc /28 commençant à .64 s'étend sur 16 adresses : de .64 à .79. Le broadcast est la dernière adresse du bloc.", "why": ["Correct : le bloc va de .64 (réseau) à .79 (broadcast), soit 16 adresses au total (64 à 79 inclus).", "192.168.1.95 serait le broadcast du bloc suivant (.80-.95), pas celui de .64/28.", "192.168.1.127 correspondrait à un découpage /25 ou similaire, pas à ce /28 précis.", "192.168.1.255 est le broadcast du /24 entier, bien plus large que le sous-réseau /28 demandé ici."]}, {"q": "Vous devez créer 6 sous-réseaux de 30 machines maximum chacun à partir d'un réseau /24. Quel masque choisir ?", "options": ["/26 (62 machines, 4 sous-réseaux)", "/27 (30 machines, 8 sous-réseaux)", "/28 (14 machines, 16 sous-réseaux)", "/25 (126 machines, 2 sous-réseaux)"], "answer": 1, "def": "Il faut au moins 30 machines par sous-réseau ET au moins 6 sous-réseaux : on choisit le masque qui satisfait les deux contraintes avec le moins de gaspillage.", "why": ["/26 ne donne que 4 sous-réseaux possibles, insuffisant pour les 6 demandés malgré une bonne capacité par sous-réseau.", "Correct : /27 offre 30 machines utilisables par sous-réseau (2^5-2=30) et 8 sous-réseaux disponibles (256/32=8), ce qui couvre le besoin de 6 sous-réseaux de 30 machines.", "/28 ne fournit que 14 machines par sous-réseau, insuffisant pour les 30 machines demandées par sous-réseau.", "/25 ne donne que 2 sous-réseaux, très loin des 6 sous-réseaux nécessaires malgré une grande capacité par sous-réseau."]}, {"q": "Quelle est la formule pour calculer le nombre de sous-réseaux possibles quand on emprunte 'n' bits à la partie hôte ?", "options": ["n x 2", "2^n", "n^2", "2 x n - 2"], "answer": 1, "def": "Chaque bit emprunté* double le nombre de sous-réseaux possibles (2 valeurs possibles par bit : 0 ou 1).", "why": ["'n x 2' n'est pas la formule exponentielle correcte pour ce calcul de combinaisons binaires.", "Correct : emprunter n bits à la partie hôte crée 2^n sous-réseaux (chaque bit ayant 2 états possibles).", "'n^2' n'est pas non plus la bonne formule ; il s'agit d'une puissance de 2, pas d'un carré de n.", "'2 x n - 2' ressemble à la formule du nombre de machines utilisables (2^n-2), mais confond puissance et multiplication."]}, {"q": "Quelle est la formule pour calculer le nombre de machines (hôtes) utilisables dans un sous-réseau, avec 'h' bits restants pour la partie hôte ?", "options": ["2^h", "2^h - 2", "h^2 - 2", "2 x h"], "answer": 1, "def": "On soustrait toujours 2 adresses réservées : l'adresse réseau (tous les bits hôte à 0) et le broadcast (tous à 1).", "why": ["2^h donne le nombre total d'adresses du bloc, mais sans retirer les 2 adresses réservées (réseau et broadcast).", "Correct : 2^h - 2 exclut l'adresse réseau et l'adresse de broadcast, qui ne peuvent pas être attribuées à une machine.", "'h^2 - 2' confond puissance de 2 et carré de h, ce n'est pas la bonne opération mathématique.", "'2 x h' n'est pas une formule exponentielle et ne correspond à aucun calcul standard de subnetting."]}, {"q": "Qu'est-ce qu'un masque wildcard (wildcard mask), utilisé notamment dans les ACL Cisco ?", "options": ["Le même masque que le masque de sous-réseau classique", "L'inverse binaire du masque de sous-réseau (les 0 et les 1 sont inversés)", "Un masque uniquement utilisé en IPv6", "Un synonyme de broadcast"], "answer": 1, "def": "Le wildcard mask* indique quels bits doivent être IGNORÉS (bit à 1) et lesquels doivent correspondre exactement (bit à 0) — l'exact inverse logique du masque de sous-réseau.", "why": ["Ce n'est justement pas le même masque : le wildcard mask est l'inverse binaire du masque de sous-réseau classique.", "Correct : pour un masque 255.255.255.0, le wildcard correspondant est 0.0.0.255 (chaque bit est inversé).", "Le wildcard mask est utilisé en IPv4 (notamment dans les ACL et OSPF Cisco), ce n'est pas une spécificité IPv6.", "Le wildcard mask n'a rien à voir avec le broadcast, il sert à définir une plage d'adresses à filtrer/matcher dans une règle."]}, {"q": "Quel est le masque wildcard correspondant au masque de sous-réseau 255.255.255.192 (/26) ?", "options": ["0.0.0.63", "0.0.0.31", "0.0.0.127", "0.0.0.192"], "answer": 0, "def": "On inverse chaque bit du masque : 255.255.255.192 devient 0.0.0.63 (192 = 11000000, son inverse est 00111111 = 63).", "why": ["Correct : 255-192=63 (méthode rapide : 255 moins la valeur de l'octet du masque), donc le wildcard est 0.0.0.63.", "0.0.0.31 correspondrait à l'inverse d'un masque /27 (255.255.255.224), pas de /26.", "0.0.0.127 correspondrait à l'inverse d'un masque /25 (255.255.255.128), pas de /26.", "0.0.0.192 serait une simple recopie du masque original sans inversion, ce n'est pas un wildcard correct."]}, {"q": "Une entreprise dispose du réseau 10.0.0.0/16 et souhaite créer des sous-réseaux de taille variable (VLSM). Quel est l'intérêt du VLSM ?", "options": ["Utiliser un masque identique partout pour simplifier", "Adapter la taille de chaque sous-réseau au nombre réel de machines, évitant le gaspillage d'adresses", "Doubler automatiquement le nombre d'adresses disponibles", "Remplacer le besoin de routage"], "answer": 1, "def": "Le VLSM (Variable Length Subnet Mask)* permet de donner un masque différent à chaque sous-réseau selon son besoin réel (un petit lien point-à-point n'a besoin que de 2 adresses, par exemple en /30).", "why": ["Utiliser un masque unique partout est justement le contraire du VLSM (ce serait du FLSM, à taille fixe), et gaspille des adresses sur les petits segments.", "Correct : le VLSM adapte chaque sous-réseau à ses besoins réels (ex: /30 pour un lien routeur-à-routeur, /26 pour un LAN de 50 postes), optimisant l'usage de l'espace d'adressage.", "Le VLSM ne crée pas d'adresses supplémentaires par magie, il optimise simplement la répartition de l'espace existant.", "Le VLSM ne remplace pas le routage, il définit seulement la segmentation adressage ; le routage reste nécessaire entre les sous-réseaux."]}, {"q": "Quelle est la plus petite taille de sous-réseau utile pour un lien point-à-point entre deux routeurs (2 adresses utilisables) ?", "options": ["/28", "/29", "/30", "/31"], "answer": 2, "def": "Un /30 laisse 2 bits hôte (2^2=4 adresses), moins 2 réservées = exactement 2 adresses utilisables, parfait pour 2 routeurs.", "why": ["/28 offre 14 adresses utilisables, un gaspillage énorme pour un simple lien à 2 machines.", "/29 offre 6 adresses utilisables, encore plus que nécessaire pour un lien point-à-point.", "Correct : /30 (masque 255.255.255.252) donne exactement 2 adresses utilisables, le strict nécessaire pour deux routeurs reliés directement.", "/31 (RFC 3021) est une exception spéciale sans adresse réseau/broadcast dédiée, utilisée dans certains cas avancés mais /30 reste la réponse standard classique attendue ici."]}, {"q": "Combien de bits compose une adresse IPv4, au total ?", "options": ["24 bits", "32 bits", "48 bits", "64 bits"], "answer": 1, "def": "Une IPv4* est composée de 4 octets de 8 bits chacun : 4 x 8 = 32 bits.", "why": ["24 bits ne correspondrait qu'à 3 octets, il en manquerait un pour une adresse IPv4 complète.", "Correct : 4 octets x 8 bits = 32 bits au total pour une adresse IPv4.", "48 bits est la taille d'une adresse MAC, pas celle d'une adresse IPv4.", "64 bits serait le double d'une adresse IPv4 ; cela ne correspond à aucun standard IP courant."]}, {"q": "Dans l'adresse 192.168.10.0/23, combien d'adresses IP au total (utilisables ou non) contient ce bloc ?", "options": ["256", "512", "1024", "128"], "answer": 1, "def": "/23 laisse 9 bits pour la partie hôte (32-23=9). 2^9 = 512 adresses.", "why": ["256 correspondrait à un /24 classique (2^8), un préfixe plus long donc un bloc deux fois plus petit que /23.", "Correct : 2^9 = 512 adresses au total pour un bloc /23, soit l'équivalent de deux blocs /24 regroupés.", "1024 correspondrait à un /22 (2^10), un préfixe plus court donc un bloc deux fois plus grand que /23.", "128 correspondrait à un /25 (2^7), un préfixe bien plus long donc un bloc quatre fois plus petit que /23."]}, {"q": "Quelle est l'adresse réseau pour l'hôte 172.16.50.10 avec un masque /20 ?", "options": ["172.16.32.0/20", "172.16.48.0/20", "172.16.0.0/20", "172.16.16.0/20"], "answer": 1, "def": "/20 laisse 4 bits dans le 3e octet pour le réseau, découpant le 3e octet en blocs de 16 (0,16,32,48,64...).", "why": ["172.16.32.0/20 couvrirait les hôtes .32 à .47 dans le 3e octet, .50 n'y appartient pas.", "Correct : 50 se situe dans le bloc 48-63 (multiple de 16 le plus proche en dessous), donc l'adresse réseau est 172.16.48.0/20.", "172.16.0.0/20 couvrirait seulement .0 à .15 du 3e octet, bien avant .50.", "172.16.16.0/20 couvrirait .16 à .31 du 3e octet, .50 n'y appartient pas non plus."]}];

const powershellQ = [{"q": "Comment sont structurées les commandes PowerShell (cmdlets) ?", "options": ["Verbe-Nom (ex: Get-Process)", "Nom-Verbe (ex: Process-Get)", "Uniquement un nom (ex: dir)", "Verbe seul (ex: Get)"], "answer": 0, "def": "Une cmdlet* PowerShell suit toujours la convention Verbe-Nom, ce qui rend son rôle immédiatement lisible.", "why": ["Correct : Get-Process, Set-Item, New-Object... le verbe (l'action) précède toujours le nom (la ressource ciblée).", "'Nom-Verbe' inverse l'ordre réel de la convention PowerShell, qui place toujours le verbe en premier.", "PowerShell garde presque toujours la structure Verbe-Nom même pour les alias (comme 'dir', qui est un alias de Get-ChildItem).", "Le verbe seul ne suffit pas à cibler une ressource précise ; une cmdlet a toujours les deux parties."]}, {"q": "Quel symbole précède le nom d'une variable en PowerShell ?", "options": ["#", "$", "@", "%"], "answer": 1, "def": "En PowerShell, une variable* se déclare et s'utilise avec le préfixe $, par exemple $nom = 'Alice'.", "why": ["'#' introduit un commentaire en PowerShell, pas une variable.", "Correct : '$' précède toujours le nom d'une variable, comme $x, $result, $monTableau.", "'@' est utilisé pour les tableaux/hashtables littéraux (@() ou @{}) et le splatting, pas pour désigner une variable simple.", "'%' est un alias du verbe ForEach-Object dans un pipeline, sans rapport avec la déclaration de variables."]}, {"q": "Que fait l'opérateur pipeline '|' en PowerShell ?", "options": ["Il commente la ligne de code", "Il transmet la sortie (les objets) d'une commande vers l'entrée de la suivante", "Il déclare une nouvelle variable", "Il compare deux valeurs"], "answer": 1, "def": "Le pipeline* est au cœur de PowerShell : contrairement à un shell classique qui transmet du texte, PowerShell transmet de vrais objets .NET* riches en propriétés.", "why": ["Le symbole de commentaire en PowerShell est '#', pas le pipe.", "Correct : 'Get-Process | Where-Object {$_.CPU -gt 100}' transmet chaque objet Process du pipeline vers la commande suivante.", "Déclarer une variable se fait avec '$nom = valeur', le pipe ne sert pas à cela.", "La comparaison entre deux valeurs utilise des opérateurs dédiés (-eq, -gt...), pas le symbole pipe."]}, {"q": "Quelle cmdlet permet de filtrer des objets dans un pipeline selon une condition ?", "options": ["Select-Object", "Where-Object", "Sort-Object", "Group-Object"], "answer": 1, "def": "Where-Object* (alias '?' ou 'where') ne garde dans le pipeline que les objets qui satisfont une condition donnée.", "why": ["Select-Object choisit certaines propriétés (colonnes) ou un nombre d'objets, mais ne filtre pas selon une condition logique.", "Correct : 'Get-Service | Where-Object {$_.Status -eq \"Running\"}' ne garde que les services en cours d'exécution.", "Sort-Object trie les objets selon une propriété, sans les filtrer.", "Group-Object regroupe les objets par valeur commune d'une propriété, sans effectuer de filtrage conditionnel."]}, {"q": "Quelle cmdlet affiche uniquement certaines propriétés (colonnes) des objets du pipeline ?", "options": ["Where-Object", "Format-Table", "Select-Object", "ForEach-Object"], "answer": 2, "def": "Select-Object* réduit un objet à un sous-ensemble de propriétés (ou en calcule de nouvelles), ce qui est différent d'un simple affichage.", "why": ["Where-Object filtre les LIGNES (objets) selon une condition, il ne choisit pas les propriétés (colonnes) à garder.", "Format-Table change uniquement l'AFFICHAGE final en tableau, sans modifier réellement les objets qui continuent dans le pipeline.", "Correct : 'Get-Process | Select-Object Name, CPU' ne conserve que ces deux propriétés sur chaque objet.", "ForEach-Object exécute une action sur chaque objet du pipeline, il ne sert pas spécifiquement à choisir des propriétés."]}, {"q": "Comment déclare-t-on un tableau (array) en PowerShell ?", "options": ["$tab = {1,2,3}", "$tab = (1,2,3) ou @(1,2,3)", "$tab = [1,2,3]", "$tab = <1,2,3>"], "answer": 1, "def": "Un tableau* en PowerShell peut se créer simplement en séparant des valeurs par des virgules, entourées de parenthèses ou de @().", "why": ["Les accolades {} servent à définir un bloc de script (scriptblock), pas un tableau.", "Correct : $tab = 1,2,3 (ou avec parenthèses/@() explicites) crée un tableau que l'on peut ensuite indexer avec $tab[0].", "Les crochets [] servent à indexer un tableau existant ($tab[0]) ou à typer une variable, pas à le déclarer littéralement de cette façon.", "Les chevrons <> n'ont pas de syntaxe particulière pour les tableaux en PowerShell."]}, {"q": "Comment déclare-t-on une table de hachage (hashtable, clé/valeur) en PowerShell ?", "options": ["$h = (cle1=val1, cle2=val2)", "$h = @{cle1='val1'; cle2='val2'}", "$h = [cle1:val1]", "$h = {cle1,val1}"], "answer": 1, "def": "La hashtable* @{} associe des clés à des valeurs, accessibles ensuite via $h['cle1'] ou $h.cle1.", "why": ["Les parenthèses simples avec '=' ne sont pas la syntaxe reconnue pour une hashtable en PowerShell.", "Correct : @{cle1='val1'; cle2='val2'} crée une hashtable, avec point-virgule entre chaque paire clé/valeur.", "Les crochets avec ':' ne correspondent à aucune syntaxe PowerShell de hashtable.", "Les accolades seules {} sans @ définissent un bloc de script (scriptblock), pas une hashtable."]}, {"q": "Quelle structure conditionnelle PowerShell teste plusieurs cas possibles d'une même variable, de façon plus lisible qu'une longue chaîne de if/elseif ?", "options": ["foreach", "switch", "while", "do-until"], "answer": 1, "def": "Le switch* compare une valeur à plusieurs motifs possibles (valeurs, expressions régulières, wildcards) de façon condensée.", "why": ["foreach parcourt une collection d'éléments, ce n'est pas une structure de choix multiple sur une valeur.", "Correct : 'switch ($valeur) { 1 {\"un\"} 2 {\"deux\"} default {\"autre\"} }' remplace élégamment une longue série de if/elseif.", "while répète un bloc tant qu'une condition est vraie, en une seule étape.", "why": ["Correct : 'Get-Process | Export-Csv processus.csv -NoTypeInformation' écrit directement un fichier CSV exploitable.", "ConvertTo-Csv transforme les objets en texte CSV mais ne les écrit pas seul dans un fichier ; il faut ensuite les rediriger avec Out-File ou Set-Content.", "'Out-File -Csv' n'existe pas : Out-File écrit du texte brut, il n'a pas de paramètre CSV dédié.", "'Save-Csv' n'est pas une cmdlet PowerShell existante."]}, {"q": "Quelle cmdlet convertit un objet PowerShell en JSON ?", "options": ["Export-Json", "ConvertTo-Json", "Out-Json", "New-Json"], "answer": 1, "def": "ConvertTo-Json* sérialise un objet .NET en une chaîne JSON, très utile pour dialoguer avec des API REST.", "why": ["'Export-Json' n'existe pas nativement en PowerShell (contrairement à Export-Csv).", "Correct : 'Get-Process | Select -First 1 | ConvertTo-Json' transforme l'objet en une chaîne de texte au format JSON.", "'Out-Json' n'est pas une cmdlet standard de PowerShell.", "'New-Json' n'existe pas non plus ; ConvertTo-Json reste la cmdlet correcte."]}, {"q": "Quel opérateur PowerShell teste l'égalité entre deux valeurs ?", "options": ["==", "-eq", "=", "equals"], "answer": 1, "def": "PowerShell utilise des opérateurs de comparaison textuels* préfixés par un tiret, différents de la syntaxe C-like.", "why": ["'==' est la syntaxe de comparaison utilisée en C, Java, JavaScript... mais pas en PowerShell.", "Correct : '-eq' teste l'égalité, par exemple 'if ($x -eq 5) {...}'.", "'=' est réservé à l'AFFECTATION d'une valeur à une variable ($x = 5), pas à une comparaison.", "'equals' n'est pas un opérateur PowerShell natif (même si la méthode .Equals() existe sur les objets .NET, ce n'est pas la syntaxe attendue ici)."]}, {"q": "Quel opérateur PowerShell vérifie qu'une chaîne de caractères correspond à un motif avec caractères génériques (wildcard) ?", "options": ["-eq", "-match (regex)", "-like", "-contains"], "answer": 2, "def": "-like* utilise des jokers simples
