nnel de l'utilisateur 'toto' sous Linux ?", "options": ["/root/toto/", "/home/toto/", "/usr/toto/", "/etc/toto/"], "answer": 1, "def": "Les répertoires personnels des utilisateurs standards se trouvent sous /home*, chacun ayant son propre sous-dossier.", "why": ["/root/ est réservé au compte administrateur root, pas aux utilisateurs standards comme 'toto'.", "Correct : chaque utilisateur non-root a son répertoire personnel sous /home/, ici /home/toto/.", "/usr/ contient les programmes et ressources partagées du système, pas les dossiers personnels des utilisateurs.", "/etc/ contient les fichiers de configuration système, pas les répertoires personnels des utilisateurs."]}, {"q": "Quelle(s) commande(s) Linux permettent de supprimer un répertoire ?", "options": ["mkdir", "touch", "rm (-r) ou rmdir", "cat"], "answer": 2, "def": "rmdir* supprime un dossier VIDE, tandis que 'rm -r'* supprime un dossier même non vide (avec son contenu).", "why": ["mkdir sert au contraire à CRÉER un répertoire, pas à le supprimer.", "touch crée un fichier vide ou met à jour sa date de modification, sans lien avec la suppression de dossier.", "Correct : rmdir supprime un dossier vide ; 'rm -r' (récursif) supprime un dossier avec tout son contenu.", "cat affiche le contenu d'un fichier texte, aucun rapport avec la suppression de répertoires."]}, {"q": "Que signifient les chiffres dans le nom d'une distribution Ubuntu, par exemple '09.10' ?", "options": ["Le numéro de version majeure/mineure classique (comme 9.10)", "L'année et le mois de sortie (octobre 2009)", "Le nombre de paquets inclus", "Le numéro de build interne"], "answer": 1, "def": "Ubuntu adopte un schéma de versionnage calendaire* : AA.MM (année à deux chiffres, puis mois).", "why": ["Ce n'est pas une simple version logicielle classique incrémentale, mais un calendrier précis.", "Correct : '09.10' signifie année 2009, mois 10 (octobre) — c'est la date de sortie de la version.", "Le nombre de paquets inclus n'a jamais fait partie du système de numérotation d'Ubuntu.", "Ce n'est pas non plus un numéro de build interne, mais bien une convention publique année.mois."]}, {"q": "À quoi sert le raccourci clavier Ctrl+Alt+F2 sous Linux ?", "options": ["Fermer la session en cours", "Changer de terminal virtuel (TTY)", "Redémarrer le système immédiatement", "Ouvrir le gestionnaire de paquets"], "answer": 1, "def": "Linux propose plusieurs consoles virtuelles* (TTY) accessibles via Ctrl+Alt+F1 à F6/F7, chacune étant une session indépendante.", "why": ["Ce raccourci ne ferme pas la session, il bascule simplement vers un autre terminal virtuel.", "Correct : Ctrl+Alt+F2 (ou F1, F3...) permet de basculer entre les différents terminaux virtuels (TTY) du système.", "Aucun redémarrage n'est déclenché par ce raccourci, juste un changement d'écran de connexion.", "Ce raccourci n'ouvre aucun gestionnaire de paquets, il change seulement de console virtuelle."]}, {"q": "Linux est-il un logiciel Freeware, Shareware, ou ni l'un ni l'autre ?", "options": ["Freeware", "Shareware", "Ni l'un ni l'autre : logiciel libre sous licence GPL", "Un logiciel propriétaire payant"], "answer": 2, "def": "Linux (le noyau) est distribué sous licence GPL*, garantissant la liberté d'utiliser, modifier et redistribuer le code source, ce qui diffère du simple 'gratuit' (freeware) ou 'à l'essai' (shareware).", "why": ["Un freeware est gratuit mais généralement fermé (sans code source ni droit de modification) — ce n'est pas la définition de Linux.", "Un shareware est un logiciel d'essai limité dans le temps ou les fonctionnalités, ce qui ne correspond pas du tout à Linux.", "Correct : Linux est un logiciel libre (GPL) : le code source est ouvert, modifiable et redistribuable, une notion plus riche que la simple gratuité.", "Linux n'est pas un logiciel propriétaire payant ; sa nature open source et gratuite s'oppose justement à ce modèle."]}, {"q": "Citez un hyperviseur.", "options": ["Docker", "Hyper-V (ou VMware ESXi, Proxmox...)", "Wireshark", "Apache"], "answer": 1, "def": "Un hyperviseur* virtualise le matériel pour exécuter plusieurs machines virtuelles complètes (chacune avec son propre OS).", "why": ["Docker fait de la conteneurisation (partage du même noyau), une approche différente d'un hyperviseur qui virtualise le matériel complet.", "Correct : Hyper-V, VMware ESXi ou Proxmox sont des hyperviseurs qui exécutent des machines virtuelles complètes.", "Wireshark est un analyseur de paquets réseau, totalement hors sujet ici.", "Apache est un serveur web, sans rapport avec la virtualisation matérielle."]}, {"q": "Qu'est-ce que l'iSCSI ?", "options": ["Un protocole de virtualisation applicative", "Un protocole de stockage réseau qui encapsule le SCSI dans IP", "Un protocole VPN", "Un protocole de messagerie"], "answer": 1, "def": "iSCSI (Internet SCSI)* permet à un serveur d'accéder à un disque distant (SAN) comme s'il était local, via le réseau IP.", "why": ["iSCSI ne fait pas de virtualisation applicative (comme Docker), c'est un protocole d'accès au stockage.", "Correct : iSCSI transporte les commandes SCSI (disque) à travers un réseau IP classique, permettant de relier un serveur à du stockage distant (SAN).", "Ce n'est pas un protocole VPN, même si le trafic iSCSI peut être sécurisé séparément (CHAP, IPSec).", "Il n'a aucun rapport avec l'envoi/réception de messagerie électronique."]}, {"q": "Citez un logiciel de conteneurisation (souvent qualifié de paravirtualisation légère).", "options": ["VMware ESXi", "Docker", "Hyper-V", "VirtualBox"], "answer": 1, "def": "Docker* partage le noyau de la machine hôte (contrairement aux hyperviseurs qui virtualisent le matériel complet), rendant les conteneurs très légers.", "why": ["VMware ESXi est un hyperviseur bare-metal complet, qui virtualise tout le matériel, pas un simple moteur de conteneurs.", "Correct : Docker crée des conteneurs isolés qui partagent le noyau Linux de l'hôte, bien plus légers qu'une VM complète.", "Hyper-V est également un hyperviseur complet de Microsoft, différent du modèle de conteneurs de Docker.", "VirtualBox est un hyperviseur de type 2 (hosted), qui virtualise tout le matériel plutôt que de partager le noyau hôte."]}, {"q": "Citez un jeu d'instructions processeur dédié à l'accélération de la virtualisation.", "options": ["SSE4", "Intel VT-x (ou AMD-V)", "AVX2", "MMX"], "answer": 1, "def": "Intel VT-x et AMD-V* sont des extensions matérielles du processeur qui accélèrent et sécurisent l'exécution des machines virtuelles.", "why": ["SSE4 est un jeu d'instructions pour le calcul vectoriel (multimédia), sans lien avec la virtualisation.", "Correct : Intel VT-x et son équivalent AMD-V permettent au CPU de gérer nativement certaines opérations de virtualisation, sans quoi un hyperviseur devrait tout émuler logiciellement (bien plus lent).", "AVX2 accélère les calculs vectoriels avancés, sans rapport direct avec la virtualisation.", "MMX est un ancien jeu d'instructions multimédia des années 1990, sans lien avec la virtualisation matérielle."]}, {"q": "Que contient un fichier avec l'extension .VMDK ?", "options": ["Une configuration réseau VMware", "Le disque virtuel d'une machine virtuelle VMware", "Un instantané (snapshot) Hyper-V", "Un fichier de licence VMware"], "answer": 1, "def": "Le format .VMDK* (Virtual Machine Disk) est le fichier qui stocke le contenu du disque dur virtuel d'une VM VMware.", "why": ["La configuration réseau d'une VM VMware se trouve plutôt dans le fichier .vmx, pas .vmdk.", "Correct : le fichier .vmdk contient les données du disque dur virtuel utilisé par la machine virtuelle VMware.", "Les snapshots Hyper-V utilisent un format différent (.avhdx), pas le format VMDK propre à VMware.", "Un fichier de licence ne contiendrait aucune donnée de disque, contrairement au .vmdk qui stocke le disque virtuel entier."]}, {"q": "Citez un protocole utilisé en téléphonie sur IP (VoIP).", "options": ["FTP", "SIP (ou RTP/RTCP)", "SNMP", "NTP"], "answer": 1, "def": "SIP (Session Initiation Protocol)* établit/termine les appels, tandis que RTP/RTCP* transportent la voix elle-même.", "why": ["FTP sert au transfert de fichiers, sans rapport avec la téléphonie IP.", "Correct : SIP gère la signalisation (établissement d'appel) et RTP/RTCP le transport du flux audio/vidéo en VoIP.", "SNMP est un protocole de supervision réseau, sans lien avec la téléphonie sur IP.", "NTP synchronise l'horloge des équipements, un rôle bien différent de la VoIP."]}, {"q": "Citez une ancienne technologie de téléphonie numérique (avant la VoIP).", "options": ["SIP", "NUMERIS (RNIS/ISDN)", "RTP", "H.323"], "answer": 1, "def": "NUMERIS* est le nom commercial français du RNIS (réseau numérique à intégration de services, ISDN en anglais), technologie de téléphonie numérique antérieure à la VoIP.", "why": ["SIP est justement un protocole de VoIP moderne, pas une ancienne technologie de téléphonie numérique classique.", "Correct : NUMERIS (RNIS/ISDN) était la technologie de téléphonie numérique commercialisée par France Télécom avant la généralisation de la VoIP.", "RTP est également un protocole VoIP (transport de la voix), pas une ancienne téléphonie numérique classique.", "H.323 est un ensemble de protocoles de VoIP historiques, mais plus récent que la téléphonie numérique classique RNIS/NUMERIS."]}, {"q": "Qu'est-ce que le provisioning en téléphonie IP ?", "options": ["La facturation automatique des appels", "L'auto-configuration à distance d'un équipement téléphonique (téléphone IP)", "Le chiffrement de la voix", "La mise en attente d'un appel"], "answer": 1, "def": "Le provisioning* permet à un téléphone IP de récupérer automatiquement sa configuration (identifiants SIP, sonneries...) dès son branchement, sans intervention manuelle.", "why": ["La facturation des appels est une fonction distincte (taxation/CDR), sans lien avec le provisioning.", "Correct : le provisioning automatise la configuration des postes téléphoniques IP en masse, un gain de temps énorme pour l'administrateur.", "Le chiffrement de la voix (SRTP) est une fonction de sécurité séparée, pas le rôle du provisioning.", "La mise en attente d'un appel est une fonctionnalité utilisateur du téléphone, sans rapport avec sa configuration initiale."]}, {"q": "Citez un serveur IPBX (autocommutateur téléphonique IP) open source connu.", "options": ["Exchange", "Asterisk", "Postfix", "Samba"], "answer": 1, "def": "Asterisk* est le logiciel IPBX open source le plus connu, permettant de créer un standard téléphonique complet basé sur SIP.", "why": ["Exchange est un serveur de messagerie électronique Microsoft, sans rapport avec la téléphonie IPBX.", "Correct : Asterisk est LE logiciel IPBX open source de référence, à la base de nombreuses solutions commerciales (FreePBX...).", "Postfix est un serveur de messagerie (MTA) sous Linux, sans lien avec la téléphonie.", "Samba fournit des partages de fichiers/impression compatibles Windows sous Linux, sans rapport avec la VoIP."]}, {"q": "Quel type de VLAN doit-on utiliser pour sécuriser un réseau de téléphonie IP ?", "options": ["VLAN par port uniquement", "VLAN voix dédié (souvent basé MAC ou par port avec priorité QoS)", "Aucun VLAN n'est nécessaire", "VLAN natif uniquement"], "answer": 1, "def": "Un VLAN voix* dédié isole le trafic téléphonique du trafic data classique, facilitant la QoS et la sécurité.", "why": ["Le VLAN par port seul ne suffit pas à garantir une vraie séparation dédiée et la qualité de service nécessaire à la voix.", "Correct : on crée un VLAN voix séparé (souvent identifié par l'adresse MAC du téléphone ou une configuration dédiée), permettant d'appliquer une QoS prioritaire et d'isoler le trafic voix du trafic data.", "Ne pas segmenter le trafic voix expose au contraire à des risques (écoute, saturation, attaques) et à une qualité d'appel dégradée.", "Le VLAN natif est celui non-taggé par défaut sur un trunk, un concept différent du VLAN voix dédié à la téléphonie."]}];

const subnettingQ = [{"q": "Combien d'adresses IP utilisables trouve-t-on dans un réseau /24 ?", "options": ["254", "256", "255", "510"], "answer": 0, "def": "Un /24 laisse 8 bits pour la partie hôte* (32-24). 2^8=256 adresses totales, moins l'adresse réseau et le broadcast.", "why": ["Correct : 256 adresses totales - 2 (réseau + broadcast) = 254 adresses utilisables pour des machines.", "256 est le nombre total d'adresses (2^8), mais il faut en retirer 2 (réseau et broadcast) pour obtenir les adresses réellement utilisables.", "255 ne correspond à aucun calcul standard de ce type de masque (ce serait une simple confusion avec la valeur du dernier octet du masque /24).", "510 correspondrait à un /23 (2^9-2), un préfixe plus court donc un bloc deux fois plus grand qu'un /24."]}, {"q": "Quel masque en notation décimale correspond au préfixe /27 ?", "options": ["255.255.255.224", "255.255.255.240", "255.255.255.192", "255.255.255.248"], "answer": 0, "def": "/27 = 27 bits à 1. Sur le dernier octet, il reste 3 bits réseau (24+3=27) : 11100000 = 224.", "why": ["Correct : 11100000 en binaire = 128+64+32 = 224, donc 255.255.255.224 pour un /27.", "255.255.255.240 (11110000=240) correspond à un /28 (4 bits réseau sur le dernier octet), un bit de plus que /27.", "255.255.255.192 (11000000=192) correspond à un /26 (2 bits réseau sur le dernier octet), un bit de moins que /27.", "255.255.255.248 (11111000=248) correspond à un /29 (5 bits réseau sur le dernier octet), deux bits de plus que /27."]}, {"q": "Combien de machines utilisables offre un sous-réseau en /28 ?", "options": ["30", "14", "62", "16"], "answer": 1, "def": "/28 laisse 4 bits pour la partie hôte (32-28=4). 2^4=16 adresses totales, moins 2 réservées.", "why": ["Correct : 2^4=16 adresses totales, moins 2 réservées (réseau et broadcast) = 14 machines utilisables en /28.", "30 correspondrait à un /27 (2^5-2=30), un préfixe plus court (donc un bloc plus grand) que /28.", "62 correspondrait à un /26 (2^6-2=62), un préfixe bien plus court que /28.", "16 est le nombre total d'adresses du bloc, mais il ne faut pas oublier de retirer les 2 adresses réservées pour obtenir le nombre de machines utilisables."]}, {"q": "Quelle est l'adresse réseau du sous-réseau contenant 192.168.1.77/28 ?", "options": ["192.168.1.64/28", "192.168.1.0/28", "192.168.1.32/28", "192.168.1.77/28"], "answer": 0, "def": "Un /28 découpe le dernier octet en blocs de 16 (256/16=16 sous-réseaux : 0,16,32,48,64,80...).", "why": ["Correct : 77 se situe entre 64 et 79 (bloc de 16 commençant à 64), donc l'adresse réseau est 192.168.1.64/28.", "192.168.1.0/28 couvre les adresses 0 à 15, bien avant 77.", "192.168.1.32/28 couvre les adresses 32 à 47, .77 n'y appartient pas non plus.", "192.168.1.77/28 est une adresse d'hôte, pas l'adresse réseau du bloc (qui doit se terminer par un multiple de 16 ici)."]}, {"q": "Quelle est l'adresse de broadcast du sous-réseau 192.168.1.64/28 ?", "options": ["192.168.1.79", "192.168.1.95", "192.168.1.127", "192.168.1.255"], "answer": 0, "def": "Le bloc /28 commençant à .64 s'étend sur 16 adresses : de .64 à .79. Le broadcast est la dernière adresse du bloc.", "why": ["Correct : le bloc va de .64 (réseau) à .79 (broadcast), soit 16 adresses au total (64 à 79 inclus).", "192.168.1.95 serait le broadcast du bloc suivant (.80-.95), pas celui de .64/28.", "192.168.1.127 correspondrait à un découpage /25 ou similaire, pas à ce /28 précis.", "192.168.1.255 est le broadcast du /24 entier, bien plus large que le sous-réseau /28 demandé ici."]}, {"q": "Vous devez créer 6 sous-réseaux de 30 machines maximum chacun à partir d'un réseau /24. Quel masque choisir ?", "options": ["/26 (62 machines, 4 sous-réseaux)", "/27 (30 machines, 8 sous-réseaux)", "/28 (14 machines, 16 sous-réseaux)", "/25 (126 machines, 2 sous-réseaux)"], "answer": 1, "def": "Il faut au moins 30 machines par sous-réseau ET au moins 6 sous-réseaux : on choisit le masque qui satisfait les deux contraintes avec le moins de gaspillage.", "why": ["/26 ne donne que 4 sous-réseaux possibles, insuffisant pour les 6 demandés malgré une bonne capacité par sous-réseau.", "Correct : /27 offre 30 machines utilisables par sous-réseau (2^5-2=30) et 8 sous-réseaux disponibles (256/32=8), ce qui couvre le besoin de 6 sous-réseaux de 30 machines.", "/28 ne fournit que 14 machines par sous-réseau, insuffisant pour les 30 machines demandées par sous-réseau.", "/25 ne donne que 2 sous-réseaux, très loin des 6 sous-réseaux nécessaires malgré une grande capacité par sous-réseau."]}, {"q": "Quelle est la formule pour calculer le nombre de sous-réseaux possibles quand on emprunte 'n' bits à la partie hôte ?", "options": ["n x 2", "2^n", "n^2", "2 x n - 2"], "answer": 1, "def": "Chaque bit emprunté* double le nombre de sous-réseaux possibles (2 valeurs possibles par bit : 0 ou 1).", "why": ["'n x 2' n'est pas la formule exponentielle correcte pour ce calcul de combinaisons binaires.", "Correct : emprunter n bits à la partie hôte crée 2^n sous-réseaux (chaque bit ayant 2 états possibles).", "'n^2' n'est pas non plus la bonne formule ; il s'agit d'une puissance de 2, pas d'un carré de n.", "'2 x n - 2' ressemble à la formule du nombre de machines utilisables (2^n-2), mais confond puissance et multiplication."]}, {"q": "Quelle est la formule pour calculer le nombre de machines (hôtes) utilisables dans un sous-réseau, avec 'h' bits restants pour la partie hôte ?", "options": ["2^h", "2^h - 2", "h^2 - 2", "2 x h"], "answer": 1, "def": "On soustrait toujours 2 adresses réservées : l'adresse réseau (tous les bits hôte à 0) et le broadcast (tous à 1).", "why": ["2^h donne le nombre total d'adresses du bloc, mais sans retirer les 2 adresses réservées (réseau et broadcast).", "Correct : 2^h - 2 exclut l'adresse réseau et l'adresse de broadcast, qui ne peuvent pas être attribuées à une machine.", "'h^2 - 2' confond puissance de 2 et carré de h, ce n'est pas la bonne opération mathématique.", "'2 x h' n'est pas une formule exponentielle et ne correspond à aucun calcul standard de subnetting."]}, {"q": "Qu'est-ce qu'un masque wildcard (wildcard mask), utilisé notamment dans les ACL Cisco ?", "options": ["Le même masque que le masque de sous-réseau classique", "L'inverse binaire du masque de sous-réseau (les 0 et les 1 sont inversés)", "Un masque uniquement utilisé en IPv6", "Un synonyme de broadcast"], "answer": 1, "def": "Le wildcard mask* indique quels bits doivent être IGNORÉS (bit à 1) et lesquels doivent correspondre exactement (bit à 0) — l'exact inverse logique du masque de sous-réseau.", "why": ["Ce n'est justement pas le même masque : le wildcard mask est l'inverse binaire du masque de sous-réseau classique.", "Correct : pour un masque 255.255.255.0, le wildcard correspondant est 0.0.0.255 (chaque bit est inversé).", "Le wildcard mask est utilisé en IPv4 (notamment dans les ACL et OSPF Cisco), ce n'est pas une spécificité IPv6.", "Le wildcard mask n'a rien à voir avec le broadcast, il sert à définir une plage d'adresses à filtrer/matcher dans une règle."]}, {"q": "Quel est le masque wildcard correspondant au masque de sous-réseau 255.255.255.192 (/26) ?", "options": ["0.0.0.63", "0.0.0.31", "0.0.0.127", "0.0.0.192"], "answer": 0, "def": "On inverse chaque bit du masque : 255.255.255.192 devient 0.0.0.63 (192 = 11000000, son inverse est 00111111 = 63).", "why": ["Correct : 255-192=63 (méthode rapide : 255 moins la valeur de l'octet du masque), donc le wildcard est 0.0.0.63.", "0.0.0.31 correspondrait à l'inverse d'un masque /27 (255.255.255.224), pas de /26.", "0.0.0.127 correspondrait à l'inverse d'un masque /25 (255.255.255.128), pas de /26.", "0.0.0.192 serait une simple recopie du masque original sans inversion, ce n'est pas un wildcard correct."]}, {"q": "Une entreprise dispose du réseau 10.0.0.0/16 et souhaite créer des sous-réseaux de taille variable (VLSM). Quel est l'intérêt du VLSM ?", "options": ["Utiliser un masque identique partout pour simplifier", "Adapter la taille de chaque sous-réseau au nombre réel de machines, évitant le gaspillage d'adresses", "Doubler automatiquement le nombre d'adresses disponibles", "Remplacer le besoin de routage"], "answer": 1, "def": "Le VLSM (Variable Length Subnet Mask)* permet de donner un masque différent à chaque sous-réseau selon son besoin réel (un petit lien point-à-point n'a besoin que de 2 adresses, par exemple en /30).", "why": ["Utiliser un masque unique partout est justement le contraire du VLSM (ce serait du FLSM, à taille fixe), et gaspille des adresses sur les petits segments.", "Correct : le VLSM adapte chaque sous-réseau à ses besoins réels (ex: /30 pour un lien routeur-à-routeur, /26 pour un LAN de 50 postes), optimisant l'usage de l'espace d'adressage.", "Le VLSM ne crée pas d'adresses supplémentaires par magie, il optimise simplement la répartition de l'espace existant.", "Le VLSM ne remplace pas le routage, il définit seulement la segmentation adressage ; le routage reste nécessaire entre les sous-réseaux."]}, {"q": "Quelle est la plus petite taille de sous-réseau utile pour un lien point-à-point entre deux routeurs (2 adresses utilisables) ?", "options": ["/28", "/29", "/30", "/31"], "answer": 2, "def": "Un /30 laisse 2 bits hôte (2^2=4 adresses), moins 2 réservées = exactement 2 adresses utilisables, parfait pour 2 routeurs.", "why": ["/28 offre 14 adresses utilisables, un gaspillage énorme pour un simple lien à 2 machines.", "/29 offre 6 adresses utilisables, encore plus que nécessaire pour un lien point-à-point.", "Correct : /30 (masque 255.255.255.252) donne exactement 2 adresses utilisables, le strict nécessaire pour deux routeurs reliés directement.", "/31 (RFC 3021) est une exception spéciale sans adresse réseau/broadcast dédiée, utilisée dans certains cas avancés mais /30 reste la réponse standard classique attendue ici."]}, {"q": "Combien de bits compose une adresse IPv4, au total ?", "options": ["24 bits", "32 bits", "48 bits", "64 bits"], "answer": 1, "def": "Une IPv4* est composée de 4 octets de 8 bits chacun : 4 x 8 = 32 bits.", "why": ["24 bits ne correspondrait qu'à 3 octets, il en manquerait un pour une adresse IPv4 complète.", "Correct : 4 octets x 8 bits = 32 bits au total pour une adresse IPv4.", "48 bits est la taille d'une adresse MAC, pas celle d'une adresse IPv4.", "64 bits serait le double d'une adresse IPv4 ; cela ne correspond à aucun standard IP courant."]}, {"q": "Dans l'adresse 192.168.10.0/23, combien d'adresses IP au total (utilisables ou non) contient ce bloc ?", "options": ["256", "512", "1024", "128"], "answer": 1, "def": "/23 laisse 9 bits pour la partie hôte (32-23=9). 2^9 = 512 adresses.", "why": ["256 correspondrait à un /24 classique (2^8), un préfixe plus long donc un bloc deux fois plus petit que /23.", "Correct : 2^9 = 512 adresses au total pour un bloc /23, soit l'équivalent de deux blocs /24 regroupés.", "1024 correspondrait à un /22 (2^10), un préfixe plus court donc un bloc deux fois plus grand que /23.", "128 correspondrait à un /25 (2^7), un préfixe bien plus long donc un bloc quatre fois plus petit que /23."]}, {"q": "Quelle est l'adresse réseau pour l'hôte 172.16.50.10 avec un masque /20 ?", "options": ["172.16.32.0/20", "172.16.48.0/20", "172.16.0.0/20", "172.16.16.0/20"], "answer": 1, "def": "/20 laisse 4 bits dans le 3e octet pour le réseau, découpant le 3e octet en blocs de 16 (0,16,32,48,64...).", "why": ["172.16.32.0/20 couvrirait les hôtes .32 à .47 dans le 3e octet, .50 n'y appartient pas.", "Correct : 50 se situe dans le bloc 48-63 (multiple de 16 le plus proche en dessous), donc l'adresse réseau est 172.16.48.0/20.", "172.16.0.0/20 couvrirait seulement .0 à .15 du 3e octet, bien avant .50.", "172.16.16.0/20 couvrirait .16 à .31 du 3e octet, .50 n'y appartient pas non plus."]}];

const powershellQ = [{"q": "Comment sont structurées les commandes PowerShell (cmdlets) ?", "options": ["Verbe-Nom (ex: Get-Process)", "Nom-Verbe (ex: Process-Get)", "Uniquement un nom (ex: dir)", "Verbe seul (ex: Get)"], "answer": 0, "def": "Une cmdlet* PowerShell suit toujours la convention Verbe-Nom, ce qui rend son rôle immédiatement lisible.", "why": ["Correct : Get-Process, Set-Item, New-Object... le verbe (l'action) précède toujours le nom (la ressource ciblée).", "'Nom-Verbe' inverse l'ordre réel de la convention PowerShell, qui place toujours le verbe en premier.", "PowerShell garde presque toujours la structure Verbe-Nom même pour les alias (comme 'dir', qui est un alias de Get-ChildItem).", "Le verbe seul ne suffit pas à cibler une ressource précise ; une cmdlet a toujours les deux parties."]}, {"q": "Quel symbole précède le nom d'une variable en PowerShell ?", "options": ["#", "$", "@", "%"], "answer": 1, "def": "En PowerShell, une variable* se déclare et s'utilise avec le préfixe $, par exemple $nom = 'Alice'.", "why": ["'#' introduit un commentaire en PowerShell, pas une variable.", "Correct : '$' précède toujours le nom d'une variable, comme $x, $result, $monTableau.", "'@' est utilisé pour les tableaux/hashtables littéraux (@() ou @{}) et le splatting, pas pour désigner une variable simple.", "'%' est un alias du verbe ForEach-Object dans un pipeline, sans rapport avec la déclaration de variables."]}, {"q": "Que fait l'opérateur pipeline '|' en PowerShell ?", "options": ["Il commente la ligne de code", "Il transmet la sortie (les objets) d'une commande vers l'entrée de la suivante", "Il déclare une nouvelle variable", "Il compare deux valeurs"], "answer": 1, "def": "Le pipeline* est au cœur de PowerShell : contrairement à un shell classique qui transmet du texte, PowerShell transmet de vrais objets .NET* riches en propriétés.", "why": ["Le symbole de commentaire en PowerShell est '#', pas le pipe.", "Correct : 'Get-Process | Where-Object {$_.CPU -gt 100}' transmet chaque objet Process du pipeline vers la commande suivante.", "Déclarer une variable se fait avec '$nom = valeur', le pipe ne sert pas à cela.", "La comparaison entre deux valeurs utilise des opérateurs dédiés (-eq, -gt...), pas le symbole pipe."]}, {"q": "Quelle cmdlet permet de filtrer des objets dans un pipeline selon une condition ?", "options": ["Select-Object", "Where-Object", "Sort-Object", "Group-Object"], "answer": 1, "def": "Where-Object* (alias '?' ou 'where') ne garde dans le pipeline que les objets qui satisfont une condition donnée.", "why": ["Select-Object choisit certaines propriétés (colonnes) ou un nombre d'objets, mais ne filtre pas selon une condition logique.", "Correct : 'Get-Service | Where-Object {$_.Status -eq \"Running\"}' ne garde que les services en cours d'exécution.", "Sort-Object trie les objets selon une propriété, sans les filtrer.", "Group-Object regroupe les objets par valeur commune d'une propriété, sans effectuer de filtrage conditionnel."]}, {"q": "Quelle cmdlet affiche uniquement certaines propriétés (colonnes) des objets du pipeline ?", "options": ["Where-Object", "Format-Table", "Select-Object", "ForEach-Object"], "answer": 2, "def": "Select-Object* réduit un objet à un sous-ensemble de propriétés (ou en calcule de nouvelles), ce qui est différent d'un simple affichage.", "why": ["Where-Object filtre les LIGNES (objets) selon une condition, il ne choisit pas les propriétés (colonnes) à garder.", "Format-Table change uniquement l'AFFICHAGE final en tableau, sans modifier réellement les objets qui continuent dans le pipeline.", "Correct : 'Get-Process | Select-Object Name, CPU' ne conserve que ces deux propriétés sur chaque objet.", "ForEach-Object exécute une action sur chaque objet du pipeline, il ne sert pas spécifiquement à choisir des propriétés."]}, {"q": "Comment déclare-t-on un tableau (array) en PowerShell ?", "options": ["$tab = {1,2,3}", "$tab = (1,2,3) ou @(1,2,3)", "$tab = [1,2,3]", "$tab = <1,2,3>"], "answer": 1, "def": "Un tableau* en PowerShell peut se créer simplement en séparant des valeurs par des virgules, entourées de parenthèses ou de @().", "why": ["Les accolades {} servent à définir un bloc de script (scriptblock), pas un tableau.", "Correct : $tab = 1,2,3 (ou avec parenthèses/@() explicites) crée un tableau que l'on peut ensuite indexer avec $tab[0].", "Les crochets [] servent à indexer un tableau existant ($tab[0]) ou à typer une variable, pas à le déclarer littéralement de cette façon.", "Les chevrons <> n'ont pas de syntaxe particulière pour les tableaux en PowerShell."]}, {"q": "Comment déclare-t-on une table de hachage (hashtable, clé/valeur) en PowerShell ?", "options": ["$h = (cle1=val1, cle2=val2)", "$h = @{cle1='val1'; cle2='val2'}", "$h = [cle1:val1]", "$h = {cle1,val1}"], "answer": 1, "def": "La hashtable* @{} associe des clés à des valeurs, accessibles ensuite via $h['cle1'] ou $h.cle1.", "why": ["Les parenthèses simples avec '=' ne sont pas la syntaxe reconnue pour une hashtable en PowerShell.", "Correct : @{cle1='val1'; cle2='val2'} crée une hashtable, avec point-virgule entre chaque paire clé/valeur.", "Les crochets avec ':' ne correspondent à aucune syntaxe PowerShell de hashtable.", "Les accolades seules {} sans @ définissent un bloc de script (scriptblock), pas une hashtable."]}, {"q": "Quelle structure conditionnelle PowerShell teste plusieurs cas possibles d'une même variable, de façon plus lisible qu'une longue chaîne de if/elseif ?", "options": ["foreach", "switch", "while", "do-until"], "answer": 1, "def": "Le switch* compare une valeur à plusieurs motifs possibles (valeurs, expressions régulières, wildcards) de façon condensée.", "why": ["foreach parcourt une collection d'éléments, ce n'est pas une structure de choix multiple sur une valeur.", "Correct : 'switch ($valeur) { 1 {\"un\"} 2 {\"deux\"} default {\"autre\"} }' remplace élégamment une longue série de if/elseif.", "while répète un bloc tant qu'une condition est vraie, ce n'est pas un outil de choix multiple.", "do-until répète un bloc jusqu'à ce qu'une condition devienne vraie, également différent d'un choix multiple entre plusieurs cas."]}, {"q": "Quelle boucle PowerShell exécute un bloc de code AU MOINS une fois, même si la condition est fausse dès le départ ?", "options": ["for", "foreach", "while", "do-while / do-until"], "answer": 3, "def": "La boucle do-while/do-until* teste sa condition APRÈS avoir exécuté le bloc une première fois, contrairement à while qui teste AVANT.", "why": ["La boucle for teste sa condition avant chaque itération, y compris la première, elle peut donc ne jamais s'exécuter.", "foreach parcourt chaque élément d'une collection ; si la collection est vide, le bloc ne s'exécute jamais.", "while teste sa condition avant la première itération : si elle est fausse d'emblée, le bloc ne s'exécute pas du tout.", "Correct : do { ... } while (condition) exécute d'abord le bloc, puis vérifie la condition, garantissant au moins un passage."]}, {"q": "Comment déclare-t-on une fonction simple en PowerShell ?", "options": ["def MaFonction() { ... }", "function MaFonction { ... }", "sub MaFonction() { ... }", "func MaFonction() { ... }"], "answer": 1, "def": "Le mot-clé function* introduit un bloc de code réutilisable, qui peut accepter des paramètres via un bloc param() ou en ligne.", "why": ["'def' est la syntaxe de déclaration de fonction en Python, pas en PowerShell.", "Correct : 'function MaFonction { param($x) ... }' est la syntaxe standard PowerShell pour définir une fonction.", "'sub' est un mot-clé hérité de VBA/VBScript, absent de PowerShell.", "'func' est utilisé dans d'autres langages (Go, Swift...), pas en PowerShell."]}, {"q": "Quelle cmdlet permet d'exporter des objets PowerShell au format CSV ?", "options": ["Export-Csv", "ConvertTo-Csv (uniquement)", "Out-File -Csv", "Save-Csv"], "answer": 0, "def": "Export-Csv* convertit directement les objets du pipeline en lignes CSV et les écrit dans un fichier, en une seule étape.", "why": ["Correct : 'Get-Process | Export-Csv processus.csv -NoTypeInformation' écrit directement un fichier CSV exploitable.", "ConvertTo-Csv transforme les objets en texte CSV mais ne les écrit pas seul dans un fichier ; il faut ensuite les rediriger avec Out-File ou Set-Content.", "'Out-File -Csv' n'existe pas : Out-File écrit du texte brut, il n'a pas de paramètre CSV dédié.", "'Save-Csv' n'est pas une cmdlet PowerShell existante."]}, {"q": "Quelle cmdlet convertit un objet PowerShell en JSON ?", "options": ["Export-Json", "ConvertTo-Json", "Out-Json", "New-Json"], "answer": 1, "def": "ConvertTo-Json* sérialise un objet .NET en une chaîne JSON, très utile pour dialoguer avec des API REST.", "why": ["'Export-Json' n'existe pas nativement en PowerShell (contrairement à Export-Csv).", "Correct : 'Get-Process | Select -First 1 | ConvertTo-Json' transforme l'objet en une chaîne de texte au format JSON.", "'Out-Json' n'est pas une cmdlet standard de PowerShell.", "'New-Json' n'existe pas non plus ; ConvertTo-Json reste la cmdlet correcte."]}, {"q": "Quel opérateur PowerShell teste l'égalité entre deux valeurs ?", "options": ["==", "-eq", "=", "equals"], "answer": 1, "def": "PowerShell utilise des opérateurs de comparaison textuels* préfixés par un tiret, différents de la syntaxe C-like.", "why": ["'==' est la syntaxe de comparaison utilisée en C, Java, JavaScript... mais pas en PowerShell.", "Correct : '-eq' teste l'égalité, par exemple 'if ($x -eq 5) {...}'.", "'=' est réservé à l'AFFECTATION d'une valeur à une variable ($x = 5), pas à une comparaison.", "'equals' n'est pas un opérateur PowerShell natif (même si la méthode .Equals() existe sur les objets .NET, ce n'est pas la syntaxe attendue ici)."]}, {"q": "Quel opérateur PowerShell vérifie qu'une chaîne de caractères correspond à un motif avec caractères génériques (wildcard) ?", "options": ["-eq", "-match (regex)", "-like", "-contains"], "answer": 2, "def": "-like* utilise des jokers simples (* et ?) comme dans l'explorateur de fichiers, alors que -match* utilise de vraies expressions régulières.", "why": ["-eq teste une égalité stricte, sans aucune notion de motif ou de joker.", "-match utilise des expressions régulières (regex), plus puissantes mais différentes de la syntaxe wildcard simple demandée ici.", "Correct : '$nom -like \"*.txt\"' teste si la chaîne se termine par '.txt', en utilisant la syntaxe wildcard simple (*,?).", "-contains vérifie qu'une COLLECTION contient un élément précis, ce n'est pas un test de correspondance de motif sur une chaîne."]}, {"q": "Comment gère-t-on les erreurs de façon structurée en PowerShell (équivalent du try/catch d'autres langages) ?", "options": ["on error resume next", "try { } catch { } finally { }", "begin / end", "error { } handle { }"], "answer": 1, "def": "PowerShell reprend la syntaxe try/catch/finally* commune à de nombreux langages modernes pour intercepter les exceptions.", "why": ["'On Error Resume Next' est une syntaxe héritée de VBScript, absente de PowerShell.", "Correct : 'try { Get-Item fichier.txt } catch { Write-Host \"Erreur : $_\" } finally { ... }' intercepte proprement les erreurs.", "begin/process/end sont des blocs utilisés dans les fonctions avancées pour le traitement du pipeline, sans rapport avec la gestion d'erreurs.", "'error {} handle {}' n'est pas une syntaxe PowerShell reconnue."]}, {"q": "Quelle commande PowerShell permet d'exécuter une commande sur un ordinateur distant (remoting) ?", "options": ["Invoke-Command -ComputerName", "Send-Command -Remote", "Start-Remote", "Get-RemoteExec"], "answer": 0, "def": "Invoke-Command* s'appuie sur WinRM (WS-Management) pour exécuter du code PowerShell sur une ou plusieurs machines distantes.", "why": ["Correct : 'Invoke-Command -ComputerName Serveur1 -ScriptBlock { Get-Service }' exécute la commande à distance et renvoie le résultat.", "'Send-Command -Remote' n'est pas une cmdlet PowerShell existante.", "'Start-Remote' n'existe pas non plus dans PowerShell.", "'Get-RemoteExec' n'est pas une cmdlet reconnue."]}, {"q": "Quelle politique PowerShell contrôle si des scripts (.ps1) peuvent s'exécuter sur une machine ?", "options": ["Execution Policy", "Script Policy", "Run Policy", "PS Guard"], "answer": 0, "def": "L'Execution Policy* (Restricted, RemoteSigned, AllSigned, Unrestricted...) est une mesure de sécurité, pas un système de permission au sens NTFS.", "why": ["Correct : 'Get-ExecutionPolicy' affiche la politique actuelle, 'Set-ExecutionPolicy RemoteSigned' l'assouplit pour autoriser les scripts locaux.", "'Script Policy' n'est pas le nom officiel de ce mécanisme dans PowerShell.", "'Run Policy' n'existe pas non plus comme terme PowerShell officiel.", "'PS Guard' est un nom fictif, ne correspondant à aucune fonctionnalité réelle de PowerShell."]}, {"q": "Quelle cmdlet liste les modules PowerShell actuellement chargés en mémoire ?", "options": ["Get-Module", "Get-Command", "Get-Item", "Get-Process"], "answer": 0, "def": "Get-Module* affiche les modules chargés (ajouter -ListAvailable pour voir tous les modules installés, même non chargés).", "why": ["Correct : 'Get-Module' liste les modules importés dans la session ; 'Get-Module -ListAvailable' liste tous ceux installés sur le système.", "Get-Command liste les commandes disponibles (cmdlets, fonctions, alias), pas spécifiquement les modules.", "Get-Item récupère un élément du système de fichiers ou d'un autre lecteur (registre...), sans rapport avec les modules PowerShell.", "Get-Process liste les processus Windows en cours d'exécution, sans lien avec les modules PowerShell."]}, {"q": "Comment ajoute-t-on un commentaire sur une ligne en PowerShell ?", "options": ["// commentaire", "# commentaire", "-- commentaire", "' commentaire"], "answer": 1, "def": "Le dièse # introduit un commentaire de fin de ligne en PowerShell (comme en Python ou Bash).", "why": ["'//' est la syntaxe de commentaire de C, C++, JavaScript..., pas de PowerShell.", "Correct : tout ce qui suit un # sur la ligne est ignoré par l'interpréteur PowerShell.", "'--' est utilisé en SQL pour les commentaires, pas en PowerShell.", "L'apostrophe simple ' délimite une chaîne de caractères en PowerShell, ce n'est pas un marqueur de commentaire."]}, {"q": "Quelle cmdlet crée un nouvel objet, par exemple un objet personnalisé (PSCustomObject) ?", "options": ["Get-Object", "New-Object (ou [PSCustomObject]@{...})", "Set-Object", "Add-Object"], "answer": 1, "def": "New-Object* instancie un objet .NET classique ; la syntaxe moderne [PSCustomObject]@{...} crée rapidement un objet personnalisé à partir d'une hashtable.", "why": ["'Get-Object' n'est pas une cmdlet PowerShell existante (on utilise Get-Item, Get-Process... selon le contexte).", "Correct : 'New-Object PSObject -Property @{Nom=\"Alice\"; Age=30}' ou plus simplement '[PSCustomObject]@{Nom=\"Alice\"; Age=30}' créent un nouvel objet structuré.", "'Set-Object' n'existe pas comme cmdlet générique en PowerShell.", "'Add-Object' n'est pas non plus une cmdlet standard de PowerShell."]}, {"q": "À quoi sert la cmdlet Get-Help en PowerShell ?", "options": ["Elle exécute automatiquement un script d'aide", "Elle affiche la documentation d'une cmdlet (syntaxe, paramètres, exemples)", "Elle envoie une demande de support à Microsoft", "Elle liste les erreurs récentes du système"], "answer": 1, "def": "Get-Help* est la première commande à connaître : elle documente précisément l'usage, les paramètres et donne des exemples pour toute cmdlet.", "why": ["Get-Help ne lance aucun script, elle affiche uniquement de la documentation textuelle.", "Correct : 'Get-Help Get-Process -Examples' (ou -Full, -Detailed) affiche la documentation complète avec des exemples d'utilisation.", "Get-Help n'a aucune connexion à un service de support Microsoft, toute la documentation est locale ou mise à jour via Update-Help.", "Lister les erreurs système est le rôle de Get-EventLog ou Get-WinEvent, pas de Get-Help."]}];

const linuxPermsQ = [{"q": "Combien de catégories de permissions existe-t-il par défaut sous Linux pour un fichier ?", "options": ["2 (utilisateur, groupe)", "3 (propriétaire, groupe, autres)", "4 (root, propriétaire, groupe, autres)", "1 (globale)"], "answer": 1, "def": "Chaque fichier a un propriétaire (owner/user), un groupe propriétaire, et une catégorie 'autres' (others/world) pour tout le reste.", "why": ["Il manque la catégorie 'autres' qui s'applique à tous les utilisateurs non concernés par le propriétaire ou le groupe.", "Correct : propriétaire (u), groupe (g), autres (o) sont les 3 catégories classiques de permission sous Linux.", "Root n'est pas une catégorie de permission séparée : il est simplement soumis aux mêmes 3 catégories, mais les contourne souvent grâce à ses privilèges.", "Il existe bien 3 catégories distinctes, pas une seule permission globale identique pour tous."]}, {"q": "Que signifient les lettres r, w, x dans les permissions Linux ?", "options": ["Read, Write, eXecute", "Root, Write, eXtend", "Read, Wait, eXit", "Remove, Write, eXport"], "answer": 0, "def": "r (lecture), w (écriture), x (exécution)* sont les trois droits de base applicables à chaque catégorie (propriétaire/groupe/autres).", "why": ["Correct : r=lire le contenu, w=modifier/écrire, x=exécuter (ou traverser un répertoire).", "'Root' n'est ni une lettre ni un droit ; ce n'est pas une des permissions elles-mêmes.", "'Wait' et 'eXit' ne correspondent à aucune permission Linux standard.", "'Remove' et 'eXport' ne sont pas des permissions Linux ; supprimer un fichier dépend en réalité des droits du RÉPERTOIRE parent, pas d'un droit 'remove' sur le fichier lui-même."]}, {"q": "Que signifie chmod 644 sur un fichier ?", "options": ["rwxrwxrwx", "rw-r--r--", "rwxr-xr-x", "rw-rw-rw-"], "answer": 1, "def": "Chaque chiffre encode 3 bits (r=4, w=2, x=1) : 6=rw- (4+2), 4=r-- , 4=r--.", "why": ["777 donnerait rwxrwxrwx (tous les droits pour tout le monde), pas 644.", "Correct : 6(propriétaire: rw-=4+2) 4(groupe: r--=4) 4(autres: r--=4), soit rw-r--r--.", "755 donnerait rwxr-xr-x (exécution incluse), typique d'un script ou dossier, pas de 644.", "666 donnerait rw-rw-rw- (écriture pour tous), une permission différente de 644 qui restreint l'écriture au seul propriétaire."]}, {"q": "Que signifie chmod 755 sur un script shell ?", "options": ["rwxr-xr-x", "rw-rw-rw-", "rwxrwxrwx", "r--r--r--"], "answer": 0, "def": "755 : 7=rwx (propriétaire peut tout faire), 5=r-x (groupe et autres peuvent lire et exécuter, mais pas modifier).", "why": ["Correct : 7(rwx=4+2+1) 5(r-x=4+1) 5(r-x=4+1) — typique pour un script exécutable que tout le monde peut lancer mais que seul le propriétaire peut modifier.", "666 (rw-rw-rw-) ne donne aucun droit d'exécution, inutilisable pour lancer un script directement.", "777 (rwxrwxrwx) donnerait aussi le droit de MODIFICATION à tout le monde, une permission bien plus permissive et risquée que 755.", "444 (r--r--r--) ne permettrait même pas au propriétaire d'exécuter ou modifier le script."]}, {"q": "Quelle commande change le PROPRIÉTAIRE d'un fichier sous Linux ?", "options": ["chmod", "chown", "chgrp", "chattr"], "answer": 1, "def": "chown (CHange OWNer)* modifie le propriétaire (et optionnellement le groupe) d'un fichier : 'chown alice fichier.txt'.", "why": ["chmod modifie les PERMISSIONS (rwx), pas l'identité du propriétaire.", "Correct : chown alice:groupe fichier.txt change à la fois le propriétaire (alice) et le groupe.", "chgrp change uniquement le GROUPE propriétaire, pas l'utilisateur propriétaire.", "chattr modifie des attributs spéciaux du système de fichiers (immuable, append-only...), sans rapport avec la propriété classique."]}, {"q": "Quelle commande change uniquement le GROUPE propriétaire d'un fichier ?", "options": ["chown", "chgrp", "chmod", "umask"], "answer": 1, "def": "chgrp* est dédiée au changement de groupe, alors que chown peut aussi le faire mais avec une syntaxe différente (chown :groupe).", "why": ["chown change principalement le propriétaire (utilisateur), même s'il peut aussi changer le groupe avec la syntaxe 'user:group'.", "Correct : 'chgrp compta fichier.txt' change uniquement le groupe propriétaire du fichier, sans toucher à son propriétaire utilisateur.", "chmod modifie les permissions (rwx), pas l'identité du groupe propriétaire.", "umask définit les permissions PAR DÉFAUT des nouveaux fichiers créés, sans modifier un fichier existant."]}, {"q": "Qu'est-ce que l'umask sous Linux ?", "options": ["Le masque de sous-réseau du serveur Linux", "Un masque qui retire des droits par défaut aux nouveaux fichiers/dossiers créés", "Un outil de chiffrement de disque", "Le mot de passe root masqué"], "answer": 1, "def": "L'umask* (typiquement 022) est SOUSTRAIT des permissions maximales par défaut (666 pour les fichiers, 777 pour les dossiers) à la création.", "why": ["L'umask Linux ne concerne pas le réseau, il s'agit d'un concept totalement différent du masque de sous-réseau IP.", "Correct : avec un umask de 022, un nouveau fichier reçoit 666-022=644 et un nouveau dossier 777-022=755 par défaut.", "Ce n'est pas un outil de chiffrement, mais un paramètre de permissions par défaut à la création de fichiers.", "L'umask n'a aucun rapport avec un mot de passe ; c'est une valeur numérique de permissions par défaut."]}, {"q": "Quelle commande affiche les permissions détaillées d'un fichier (dont le propriétaire et le groupe) ?", "options": ["ls -l", "cat", "pwd", "find"], "answer": 0, "def": "ls -l* (format long) affiche : type, permissions, nombre de liens, propriétaire, groupe, taille, date, nom.", "why": ["Correct : 'ls -l fichier.txt' affiche par exemple '-rw-r--r-- 1 alice compta 1024 juil. 22 10:00 fichier.txt'.", "cat affiche le CONTENU d'un fichier texte, pas ses métadonnées de permissions.", "pwd affiche uniquement le répertoire de travail courant, sans information sur les permissions d'un fichier.", "find recherche des fichiers selon des critères (nom, taille, date...), il ne les affiche pas en détail par défaut comme ls -l."]}, {"q": "Que signifie le premier caractère '-' (ou 'd', 'l'...) dans la sortie de 'ls -l' ?", "options": ["Le niveau de sécurité du fichier", "Le type de fichier : '-' pour fichier normal, 'd' pour dossier, 'l' pour lien symbolique", "Le nombre de propriétaires", "La date de dernière modification"], "answer": 1, "def": "Ce premier caractère* précède toujours les 9 caractères de permissions (rwxrwxrwx) et indique la NATURE de l'élément.", "why": ["Il n'existe pas de 'niveau de sécurité' encodé ainsi ; ce caractère indique uniquement le TYPE d'élément.", "Correct : '-' = fichier régulier, 'd' = dossier (directory), 'l' = lien symbolique (il existe aussi 'b', 'c', 's', 'p' pour des types spéciaux).", "Le nombre de liens physiques (hardlinks) est un CHAMP séparé, affiché après les permissions, pas ce premier caractère.", "La date de modification est affichée bien plus loin dans la ligne, ce premier caractère ne concerne que le type de fichier."]}, {"q": "Qu'est-ce que le bit SUID (Set User ID) sur un exécutable ?", "options": ["Il chiffre automatiquement le fichier", "Il fait s'exécuter le programme avec les droits de son PROPRIÉTAIRE, quel que soit l'utilisateur qui le lance", "Il interdit toute exécution du fichier", "Il synchronise l'heure du système"], "answer": 1, "def": "Le SUID* est utilisé par des commandes comme 'passwd' : un utilisateur normal peut ainsi modifier /etc/shadow (réservé à root) le temps de l'exécution du programme.", "why": ["Le SUID n'a aucun effet de chiffrement, c'est un mécanisme de délégation temporaire de privilèges d'exécution.", "Correct : avec le SUID actif, le processus s'exécute avec l'identité (UID) du propriétaire du fichier, pas celle de l'utilisateur qui le lance — un mécanisme puissant mais sensible en sécurité s'il est mal utilisé.", "Le SUID ne bloque pas l'exécution ; au contraire, il l'autorise avec des privilèges élevés temporaires.", "La synchronisation de l'heure est le rôle de NTP, totalement sans rapport avec le bit SUID."]}, {"q": "Qu'est-ce que le bit SGID (Set Group ID) appliqué à un DOSSIER ?", "options": ["Il chiffre tous les fichiers du dossier", "Les nouveaux fichiers créés dans ce dossier héritent automatiquement de son groupe propriétaire", "Il supprime automatiquement les anciens fichiers", "Il rend le dossier invisible"], "answer": 1, "def": "Le SGID sur un dossier* est très utile pour le travail collaboratif : tous les fichiers créés dedans appartiennent au même groupe, facilitant le partage.", "why": ["Le SGID n'a aucun effet de chiffrement automatique sur les fichiers.", "Correct : sans SGID, un nouveau fichier hérite du groupe PRINCIPAL de son créateur ; avec SGID sur le dossier parent, il hérite du groupe DU DOSSIER, uniformisant les partages d'équipe.", "Le SGID ne supprime aucun fichier automatiquement, il concerne uniquement l'héritage du groupe propriétaire.", "Le SGID n'a aucun impact sur la visibilité du dossier, seulement sur l'héritage de groupe des nouveaux fichiers créés dedans."]}, {"q": "À quoi sert le sticky bit sur un dossier partagé comme /tmp ?", "options": ["Il empêche la lecture du dossier par les autres utilisateurs", "Il permet à chacun d'écrire dans le dossier, mais seul le propriétaire d'un fichier peut le supprimer/renommer", "Il chiffre le contenu du dossier", "Il augmente les performances d'écriture"], "answer": 1, "def": "Le sticky bit* (affiché par un 't' final dans les permissions, ex: drwxrwxrwt) protège les fichiers des AUTRES utilisateurs dans un dossier partagé en écriture par tous.", "why": ["Le sticky bit ne restreint pas la lecture, il concerne la suppression/renommage des fichiers dans un dossier partagé.", "Correct : dans /tmp (souvent en 1777), tout le monde peut créer des fichiers, mais seul le propriétaire (ou root) peut supprimer SON PROPRE fichier, empêchant les autres de supprimer les fichiers d'autrui.", "Le sticky bit n'a aucun rapport avec le chiffrement des données du dossier.", "Il n'a aucun effet sur la vitesse d'écriture, c'est une mesure de sécurité/permission, pas de performance."]}, {"q": "Comment ajoute-t-on le SUID en notation numérique chmod (en plus des permissions classiques) ?", "options": ["En ajoutant un 4e chiffre devant, par exemple chmod 4755", "En utilisant chmod +s uniquement", "En modifiant /etc/passwd", "Ce n'est pas possible en notation numérique"], "answer": 0, "def": "Un 4e chiffre optionnel (avant les 3 habituels) code les bits spéciaux : 4=SUID, 2=SGID, 1=sticky bit, cumulables.", "why": ["Correct : 'chmod 4755 script.sh' active le SUID (4) en plus des permissions rwxr-xr-x (755).", "'chmod +s' est la notation symbolique, une alternative valide, mais la question porte sur la notation NUMÉRIQUE, où l'on ajoute un chiffre devant (ex: 4755).", "/etc/passwd contient les comptes utilisateurs, pas les permissions d'un fichier précis.", "La notation numérique permet bien de définir les bits spéciaux via un chiffre supplémentaire devant les 3 habituels."]}, {"q": "Quelle commande affiche/gère les listes de contrôle d'accès étendues (ACL) sous Linux ?", "options": ["chmod/getfacl", "getfacl/setfacl", "chown/chgrp", "umask/lsattr"], "answer": 1, "def": "Les ACL POSIX* permettent d'aller au-delà des 3 catégories classiques (propriétaire/groupe/autres) en donnant des droits précis à des utilisateurs ou groupes supplémentaires.", "why": ["chmod ne gère que les permissions classiques rwx de base, il ne permet pas de créer une ACL étendue à plusieurs utilisateurs spécifiques.", "Correct : 'getfacl fichier' affiche les ACL, 'setfacl -m u:bob:rwx fichier' ajoute un droit spécifique pour l'utilisateur bob.", "chown/chgrp changent le propriétaire ou le groupe, mais ne gèrent pas les droits ACL étendus pour des utilisateurs supplémentaires.", "umask définit les permissions par défaut à la création, lsattr affiche des attributs spéciaux (immuable...), ni l'un ni l'autre ne gère les ACL."]}, {"q": "Quelle commande symbolique (non numérique) donne le droit d'exécution au propriétaire d'un fichier ?", "options": ["chmod u+x fichier", "chmod g+x fichier", "chmod o+x fichier", "chmod a-x fichier"], "answer": 0, "def": "La notation symbolique* utilise u (user/propriétaire), g (group), o (others), a (all), combinés avec + (ajouter), - (retirer), = (définir).", "why": ["Correct : 'chmod u+x fichier' ajoute le droit d'exécution (x) uniquement pour le propriétaire (u = user).", "'chmod g+x' ajoute le droit d'exécution au GROUPE, pas au propriétaire.", "'chmod o+x' ajoute le droit d'exécution aux AUTRES utilisateurs (others), pas au propriétaire.", "'chmod a-x' RETIRE (signe -) le droit d'exécution à TOUT LE MONDE (all), l'inverse de ce qui est demandé."]}, {"q": "Un fichier appartient à 'root' avec permissions 600. Un utilisateur normal peut-il le lire ?", "options": ["Oui, tout le monde peut toujours lire un fichier root", "Non : 600 = rw------- signifie que seul le propriétaire (root) a des droits", "Oui, mais seulement en lecture seule via sudo automatique", "Cela dépend uniquement du nom du fichier"], "answer": 1, "def": "600* décompose en 6=rw- pour le propriétaire, 0=--- pour le groupe, 0=--- pour les autres : aucun accès pour qui n'est pas root.", "why": ["C'est faux : les permissions à 0 pour groupe et autres bloquent explicitement tout accès, y compris la lecture, pour les non-propriétaires.", "Correct : rw------- signifie que seul root (le propriétaire) peut lire et écrire ; groupe et autres n'ont absolument aucun droit (souvent utilisé pour des fichiers sensibles comme certaines clés privées).", "sudo ne s'active pas automatiquement pour la simple lecture d'un fichier ; il faut l'invoquer explicitement, et cela reste soumis à la politique sudoers.", "Le nom du fichier n'a aucune incidence sur le contrôle d'accès Linux, qui repose uniquement sur les permissions (et éventuellement les ACL), pas sur une convention de nommage."]}, {"q": "Pourquoi le fichier /etc/shadow est-il en permission 640 ou 600 et appartient-il souvent au groupe 'shadow' plutôt qu'à tous ?", "options": ["Pour des raisons esthétiques uniquement", "Pour empêcher les utilisateurs non privilégiés de lire les hash des mots de passe", "Parce que Linux l'exige par défaut sans raison de sécurité", "Pour accélérer la connexion au système"], "answer": 1, "def": "/etc/shadow* contient les empreintes (hash) des mots de passe : si un utilisateur normal pouvait le lire, il pourrait tenter de casser les hash hors-ligne (attaque par dictionnaire).", "why": ["Il ne s'agit absolument pas d'une question d'esthétique, mais d'une mesure de sécurité fondamentale du système.", "Correct : restreindre la lecture de /etc/shadow (contrairement à /etc/passwd, lisible par tous) protège les hash des mots de passe contre une tentative de cassage hors-ligne par un utilisateur non privilégié.", "Cette restriction est un choix de sécurité délibéré des distributions Linux, pas un hasard sans justification.", "Cette permission n'a aucun impact sur la vitesse de connexion, elle protège uniquement la confidentialité des hash de mots de passe."]}, {"q": "Quelle commande affiche les attributs étendus spéciaux d'un fichier (comme l'attribut immuable) sous Linux ?", "options": ["lsattr", "ls -la", "chmod -l", "stat --attr"], "answer": 0, "def": "lsattr* révèle des attributs indépendants des permissions classiques rwx, comme l'attribut immuable (i) qui empêche toute modification même par root.", "why": ["Correct : 'lsattr fichier' affiche des attributs comme 'i' (immuable) ou 'a' (append-only), invisibles avec un simple 'ls -l'.", "'ls -la' affiche les fichiers cachés et les permissions classiques (rwx), mais pas les attributs étendus spéciaux du système de fichiers.", "'chmod -l' n'est pas une syntaxe reconnue de chmod.", "'stat --attr' n'est pas une option standard de la commande stat pour ce besoin ; c'est bien lsattr qui est l'outil dédié."]}, {"q": "Un dossier a les permissions 'drwxr-x---'. Un utilisateur du groupe propriétaire peut-il exécuter 'cd' dans ce dossier ?", "options": ["Non, car il n'a pas la permission d'écriture", "Oui, car le bit x (exécution) est présent pour le groupe, qui permet de traverser/entrer dans le dossier", "Non, seul le propriétaire peut y accéder", "Cela dépend uniquement du umask actuel"], "answer": 1, "def": "Sur un DOSSIER, le bit x* ne signifie pas 'exécuter un programme' mais 'avoir le droit d'y entrer/traverser' (nécessaire pour cd, ou pour accéder aux fichiers qu'il contient).", "why": ["L'écriture (w) donnerait le droit de créer/supprimer des fichiers DANS le dossier, mais ce n'est pas ce qui permet d'y entrer avec cd (c'est le rôle du bit x).", "Correct : 'r-x' pour le groupe inclut le bit x, qui autorise justement à traverser (cd) le dossier et à accéder aux fichiers qu'il contient (si on connaît leur nom).", "Le groupe propriétaire A des droits ici (r-x), ce n'est pas réservé au seul propriétaire du dossier.", "L'umask ne s'applique qu'à la CRÉATION de nouveaux fichiers/dossiers, il n'a aucun effet sur les permissions déjà existantes de ce dossier."]}];const courseTexts = {"subnetting": "\n<h3>🧮 Comprendre le Subnetting (pas à pas)</h3>\n<p>Le <strong>subnetting</strong> (découpage en sous-réseaux) consiste à diviser un grand réseau IP en petits morceaux plus faciles à gérer et à sécuriser. C'est l'une des compétences les plus attendues en certification AIS : on la reprend ici depuis zéro.</p>\n\n<h3>1. Rappel : une adresse IPv4</h3>\n<p>Une adresse IPv4 comme <code>192.168.1.10</code> est composée de 4 nombres (octets) de 8 bits chacun, soit 32 bits au total. Chaque octet va de 0 à 255.</p>\n<p>Un masque de sous-réseau (ex : <code>255.255.255.0</code>) indique quelle partie de l'adresse désigne le <strong>réseau</strong> et quelle partie désigne <strong>l'hôte</strong> (la machine). On l'écrit aussi en notation CIDR : <code>/24</code> signifie que les 24 premiers bits (sur 32) sont réservés au réseau.</p>\n\n<h3>2. La méthode en 4 étapes (à refaire à chaque exercice)</h3>\n<p><strong>Étape 1 — Trouver le masque en binaire.</strong> Pour un /26, on pose 26 bits à 1 puis on complète avec des 0 jusqu'à 32 : <code>11111111.11111111.11111111.11000000</code>. En reconvertissant en décimal, cela donne <code>255.255.255.192</code>.</p>\n<p><strong>Étape 2 — Compter les machines utilisables.</strong> S'il reste \"h\" bits à 0 (bits hôtes), le nombre d'adresses total est 2^h, et le nombre de machines réellement utilisables est <code>2^h - 2</code> (on retire toujours l'adresse réseau et l'adresse de broadcast).</p>\n<p><strong>Étape 3 — Trouver l'adresse réseau.</strong> C'est la plus petite adresse du bloc : on met tous les bits hôtes à 0. Astuce rapide : les sous-réseaux se répètent par \"sauts\" de taille 256-valeur_du_masque (pour /26, le masque vaut 192 sur le dernier octet, donc les blocs font 256-192=64 de large : 0, 64, 128, 192...).</p>\n<p><strong>Étape 4 — Trouver le broadcast.</strong> C'est la plus grande adresse du bloc : on met tous les bits hôtes à 1. C'est simplement l'adresse juste avant le début du bloc suivant.</p>\n\n<h3>3. Exemple complet : 82.82.59.132/26</h3>\n<table>\n<tr><th>Étape</th><th>Résultat</th></tr>\n<tr><td>Masque</td><td>255.255.255.192</td></tr>\n<tr><td>Bits hôtes restants</td><td>6 bits (32-26)</td></tr>\n<tr><td>Machines utilisables</td><td>2^6 - 2 = 62</td></tr>\n<tr><td>Taille des blocs</td><td>256-192 = 64 (blocs : 0,64,128,192)</td></tr>\n<tr><td>Adresse réseau</td><td>82.82.59.128 (132 est dans le bloc 128-191)</td></tr>\n<tr><td>Broadcast</td><td>82.82.59.191 (dernière adresse du bloc)</td></tr>\n</table>\n\n<h3>4. Table de référence à connaître par cœur</h3>\n<table>\n<tr><th>CIDR</th><th>Masque</th><th>Bits hôtes</th><th>Machines utilisables</th><th>Taille du bloc</th></tr>\n<tr><td>/24</td><td>255.255.255.0</td><td>8</td><td>254</td><td>256</td></tr>\n<tr><td>/25</td><td>255.255.255.128</td><td>7</td><td>126</td><td>128</td></tr>\n<tr><td>/26</td><td>255.255.255.192</td><td>6</td><td>62</td><td>64</td></tr>\n<tr><td>/27</td><td>255.255.255.224</td><td>5</td><td>30</td><td>32</td></tr>\n<tr><td>/28</td><td>255.255.255.240</td><td>4</td><td>14</td><td>16</td></tr>\n<tr><td>/29</td><td>255.255.255.248</td><td>3</td><td>6</td><td>8</td></tr>\n<tr><td>/30</td><td>255.255.255.252</td><td>2</td><td>2</td><td>4</td></tr>\n</table>\n\n<h3>5. Le VLSM (masques de taille variable)</h3>\n<p>En pratique, on n'utilise pas le même masque partout : un lien entre deux routeurs n'a besoin que de 2 adresses (un <code>/30</code> suffit), alors qu'un LAN de 100 postes a besoin d'un <code>/25</code>. Le <strong>VLSM</strong> (Variable Length Subnet Mask) consiste à adapter la taille de chaque sous-réseau à son besoin réel, pour ne pas gaspiller d'adresses.</p>\n\n<h3>6. Le masque wildcard (pour les ACL Cisco)</h3>\n<p>Le masque wildcard est l'<strong>inverse binaire</strong> du masque de sous-réseau : là où le masque a un 1, le wildcard a un 0, et inversement. Astuce rapide : <code>255 - valeur_du_masque = valeur_du_wildcard</code> sur chaque octet. Exemple : masque 255.255.255.192 → wildcard 0.0.0.63.</p>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Entraîne-toi maintenant avec le quiz ci-dessous : il reprend exactement cette méthode sur des cas variés (calcul de masque, de machines, d'adresse réseau, de broadcast, VLSM, wildcard...).</p>\n", "powershell": "\n<h3>💻 Scripting PowerShell pour les débutants</h3>\n<p>PowerShell est le langage de script et d'administration de Windows (multiplateforme depuis PowerShell 7). Contrairement à un shell classique (Bash, CMD) qui ne manipule que du texte, PowerShell manipule de <strong>vrais objets</strong> avec des propriétés et des méthodes : c'est ce qui le rend particulièrement puissant pour l'administration système.</p>\n\n<h3>1. Les cmdlets : la brique de base</h3>\n<p>Une commande PowerShell s'appelle une <strong>cmdlet</strong> et suit toujours la structure <code>Verbe-Nom</code> : le verbe décrit l'action (Get, Set, New, Remove, Start, Stop...), le nom décrit la ressource ciblée (Process, Service, Item, ADUser...).</p>\n<table>\n<tr><th>Verbe</th><th>Signification</th><th>Exemple</th></tr>\n<tr><td>Get</td><td>Récupérer / afficher</td><td>Get-Process</td></tr>\n<tr><td>Set</td><td>Modifier une propriété existante</td><td>Set-ItemProperty</td></tr>\n<tr><td>New</td><td>Créer un nouvel élément</td><td>New-Item</td></tr>\n<tr><td>Remove</td><td>Supprimer</td><td>Remove-Item</td></tr>\n<tr><td>Start / Stop</td><td>Démarrer / arrêter</td><td>Start-Service</td></tr>\n<tr><td>Invoke</td><td>Exécuter une action / un script</td><td>Invoke-Command</td></tr>\n</table>\n\n<h3>2. Les variables</h3>\n<p>Une variable se déclare avec le signe <code>$</code> : <code>$nom = \"Alice\"</code>. PowerShell est typé dynamiquement : la même variable peut contenir un texte, un nombre, un tableau, ou même un objet complexe.</p>\n\n<h3>3. Le pipeline : l'ADN de PowerShell</h3>\n<p>Le symbole <code>|</code> transmet le résultat (les objets) d'une commande à la commande suivante. Exemple : <code>Get-Process | Where-Object {$_.CPU -gt 50} | Sort-Object CPU -Descending</code> filtre les processus gourmands en CPU puis les trie. La variable <code>$_</code> représente \"l'objet courant\" dans le pipeline.</p>\n<table>\n<tr><th>Cmdlet</th><th>Rôle</th></tr>\n<tr><td>Where-Object</td><td>Filtrer selon une condition (les LIGNES)</td></tr>\n<tr><td>Select-Object</td><td>Choisir des propriétés (les COLONNES) ou un nombre d'objets</td></tr>\n<tr><td>Sort-Object</td><td>Trier</td></tr>\n<tr><td>Group-Object</td><td>Regrouper par valeur commune</td></tr>\n<tr><td>ForEach-Object</td><td>Exécuter une action sur chaque objet</td></tr>\n<tr><td>Format-Table / Format-List</td><td>Changer uniquement l'AFFICHAGE final</td></tr>\n</table>\n\n<h3>4. Tableaux et hashtables</h3>\n<p>Un <strong>tableau</strong> (array) contient une liste ordonnée de valeurs : <code>$tab = 1,2,3</code>, accessible par index <code>$tab[0]</code>.</p>\n<p>Une <strong>hashtable</strong> associe des clés à des valeurs : <code>$h = @{nom='Alice'; age=30}</code>, accessible via <code>$h.nom</code> ou <code>$h['nom']</code>.</p>\n\n<h3>5. Conditions et boucles</h3>\n<table>\n<tr><th>Structure</th><th>Usage</th></tr>\n<tr><td>if / elseif / else</td><td>Tester une ou plusieurs conditions</td></tr>\n<tr><td>switch</td><td>Tester plusieurs valeurs possibles d'une même variable</td></tr>\n<tr><td>for</td><td>Boucle avec compteur classique</td></tr>\n<tr><td>foreach</td><td>Parcourir chaque élément d'une collection</td></tr>\n<tr><td>while</td><td>Répéter tant qu'une condition est vraie (testée AVANT)</td></tr>\n<tr><td>do-while / do-until</td><td>Répéter au moins une fois (condition testée APRÈS)</td></tr>\n</table>\n\n<h3>6. Les opérateurs de comparaison</h3>\n<p>PowerShell n'utilise pas <code>==</code> comme d'autres langages, mais des opérateurs textuels préfixés par un tiret :</p>\n<table>\n<tr><th>Opérateur</th><th>Signification</th></tr>\n<tr><td>-eq / -ne</td><td>Égal / différent</td></tr>\n<tr><td>-gt / -lt</td><td>Supérieur / inférieur à</td></tr>\n<tr><td>-ge / -le</td><td>Supérieur ou égal / inférieur ou égal</td></tr>\n<tr><td>-like</td><td>Correspond à un motif avec jokers simples (*, ?)</td></tr>\n<tr><td>-match</td><td>Correspond à une expression régulière (regex)</td></tr>\n<tr><td>-contains</td><td>Une collection contient une valeur précise</td></tr>\n</table>\n\n<h3>7. Fonctions et modules</h3>\n<p>On définit une fonction avec <code>function MaFonction { param($x) ... }</code>. Un <strong>module</strong> regroupe plusieurs fonctions/cmdlets réutilisables ; <code>Get-Module -ListAvailable</code> liste tous les modules installés, <code>Import-Module</code> en charge un en mémoire.</p>\n\n<h3>8. Gestion des erreurs</h3>\n<p>PowerShell utilise <code>try { ... } catch { ... } finally { ... }</code>, comme de nombreux langages modernes, pour intercepter proprement les exceptions plutôt que de laisser le script planter.</p>\n\n<h3>9. Export de données et remoting</h3>\n<p><code>Export-Csv</code> et <code>ConvertTo-Json</code> permettent d'exporter des objets vers des formats exploitables ailleurs (Excel, une API...). <code>Invoke-Command -ComputerName Serveur1 -ScriptBlock {...}</code> exécute du code sur une machine distante via WinRM (remoting).</p>\n\n<h3>10. Sécurité : l'Execution Policy</h3>\n<p>Par défaut, Windows empêche l'exécution de scripts .ps1 pour limiter les risques. La politique d'exécution (<code>Get-ExecutionPolicy</code> / <code>Set-ExecutionPolicy</code>) contrôle ce comportement, sans remplacer les permissions NTFS classiques.</p>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Le quiz ci-dessous couvre tous ces concepts avec des cas pratiques : cmdlets, variables, pipeline, tableaux/hashtables, boucles, opérateurs, fonctions, gestion d'erreurs, remoting et sécurité.</p>\n", "linux": "\n<h3>🔐 Les permissions Linux, expliquées simplement</h3>\n<p>Sous Linux, chaque fichier et chaque dossier appartient à un <strong>propriétaire</strong> (un utilisateur) et à un <strong>groupe</strong>, et possède des permissions définies pour 3 catégories bien distinctes.</p>\n\n<h3>1. Les 3 catégories et les 3 droits</h3>\n<table>\n<tr><th>Catégorie</th><th>Symbole</th><th>Concerne</th></tr>\n<tr><td>Propriétaire (user)</td><td>u</td><td>La personne qui possède le fichier</td></tr>\n<tr><td>Groupe (group)</td><td>g</td><td>Les membres du groupe propriétaire</td></tr>\n<tr><td>Autres (others)</td><td>o</td><td>Tout le monde d'autre sur la machine</td></tr>\n</table>\n<table>\n<tr><th>Droit</th><th>Lettre</th><th>Sur un fichier</th><th>Sur un dossier</th></tr>\n<tr><td>Lecture</td><td>r (4)</td><td>Lire le contenu</td><td>Lister le contenu (ls)</td></tr>\n<tr><td>Écriture</td><td>w (2)</td><td>Modifier le contenu</td><td>Créer/supprimer des fichiers dedans</td></tr>\n<tr><td>Exécution</td><td>x (1)</td><td>Exécuter comme un programme</td><td>\"Traverser\" le dossier (cd, accès aux fichiers)</td></tr>\n</table>\n\n<h3>2. Lire une ligne \"ls -l\"</h3>\n<p>Exemple : <code>-rwxr-xr-- 1 alice compta 1024 juil. 22 10:00 script.sh</code></p>\n<ul>\n<li><code>-</code> : type de fichier (- = fichier normal, d = dossier, l = lien symbolique)</li>\n<li><code>rwx</code> : droits du propriétaire (alice) : tout faire</li>\n<li><code>r-x</code> : droits du groupe (compta) : lire et exécuter, pas modifier</li>\n<li><code>r--</code> : droits des autres : lecture seule</li>\n</ul>\n\n<h3>3. La notation numérique (chmod)</h3>\n<p>Chaque droit vaut un chiffre : r=4, w=2, x=1. On additionne les droits voulus pour chaque catégorie, ce qui donne un chiffre de 0 à 7.</p>\n<table>\n<tr><th>Chiffre</th><th>Droits</th><th>Signification</th></tr>\n<tr><td>7</td><td>rwx</td><td>4+2+1 : tout faire</td></tr>\n<tr><td>6</td><td>rw-</td><td>4+2 : lire et écrire</td></tr>\n<tr><td>5</td><td>r-x</td><td>4+1 : lire et exécuter</td></tr>\n<tr><td>4</td><td>r--</td><td>4 : lecture seule</td></tr>\n<tr><td>0</td><td>---</td><td>Aucun droit</td></tr>\n</table>\n<p>Exemple : <code>chmod 755 script.sh</code> = propriétaire rwx (7), groupe r-x (5), autres r-x (5) — typique d'un script exécutable partagé. <code>chmod 644 fichier.txt</code> = propriétaire rw- (6), groupe r-- (4), autres r-- (4) — typique d'un document classique.</p>\n\n<h3>4. La notation symbolique (chmod)</h3>\n<p>On peut aussi modifier un droit précis sans tout recalculer : <code>chmod u+x fichier</code> (ajoute l'exécution au propriétaire), <code>chmod g-w fichier</code> (retire l'écriture au groupe), <code>chmod o=r fichier</code> (fixe exactement le droit des autres à lecture seule), <code>chmod a+r fichier</code> (ajoute la lecture à tout le monde : a = all).</p>\n\n<h3>5. Changer propriétaire et groupe</h3>\n<p><code>chown alice fichier</code> change le propriétaire. <code>chown alice:compta fichier</code> change propriétaire ET groupe en une seule commande. <code>chgrp compta fichier</code> change uniquement le groupe.</p>\n\n<h3>6. L'umask : les permissions par défaut</h3>\n<p>Quand un fichier est créé, Linux part d'un maximum théorique (666 pour un fichier, 777 pour un dossier) et lui <strong>soustrait</strong> l'umask. Avec un umask de 022 (valeur très courante), un nouveau fichier reçoit 666-022=644, et un nouveau dossier 777-022=755.</p>\n\n<h3>7. Les permissions spéciales (bits avancés)</h3>\n<table>\n<tr><th>Bit</th><th>Effet</th><th>Exemple d'usage</th></tr>\n<tr><td>SUID (chmod 4xxx)</td><td>Le programme s'exécute avec les droits de son PROPRIÉTAIRE</td><td>La commande passwd (modifie /etc/shadow, réservé root)</td></tr>\n<tr><td>SGID (chmod 2xxx)</td><td>Sur un dossier : les nouveaux fichiers héritent du GROUPE du dossier</td><td>Dossiers de travail collaboratif en équipe</td></tr>\n<tr><td>Sticky bit (chmod 1xxx)</td><td>Dans un dossier partagé en écriture, seul le propriétaire d'un fichier peut le supprimer</td><td>/tmp (souvent en permission 1777)</td></tr>\n</table>\n\n<h3>8. Les ACL (listes de contrôle d'accès étendues)</h3>\n<p>Les 3 catégories classiques (u/g/o) ne suffisent pas toujours. Les <strong>ACL POSIX</strong> permettent de donner un droit précis à un utilisateur ou groupe supplémentaire : <code>setfacl -m u:bob:rwx fichier</code> ajoute des droits rwx spécifiquement pour bob, sans toucher au propriétaire ni au groupe classique. <code>getfacl fichier</code> affiche les ACL en place.</p>\n\n<h3>9. /etc/passwd vs /etc/shadow</h3>\n<p><code>/etc/passwd</code> liste les comptes utilisateurs (lisible par tous). <code>/etc/shadow</code> contient les mots de passe hashés et n'est lisible que par root, précisément pour empêcher un utilisateur normal de tenter de casser les hash hors-ligne.</p>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Le quiz ci-dessous te fait pratiquer chmod numérique et symbolique, chown/chgrp, umask, SUID/SGID/sticky bit, ACL, et la lecture d'un \"ls -l\" complet.</p>\n"};
