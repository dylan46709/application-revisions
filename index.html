const memoireHtml = "\n<h3>📄 Fiche de révision — Mémoire HA « Kali-Brazza »</h3>\n<p>Cette section rassemble, pour réviser ta soutenance, le <strong>glossaire complet</strong> de ton mémoire ainsi que <strong>tous les concepts et protocoles</strong> que tu as mobilisés tout au long du projet — classés par grand thème, dans l'ordre où ils apparaissent dans ton document.</p>\n\n<h3>1. Glossaire complet (section 11 du mémoire)</h3>\n<p><strong>Active Directory (AD)</strong> : Service d'annuaire développé par Microsoft. Il permet de centraliser la gestion des identités, des droits d'accès et des politiques de sécurité pour l'ensemble des utilisateurs et ordinateurs du réseau.</p>\n<p><strong>AES-256 (Advanced Encryption Standard)</strong> : Algorithme de chiffrement symétrique utilisant une clé de 256 bits. Il est reconnu comme l'un des standards de cryptographie les plus robustes pour sécuriser la confidentialité des données.</p>\n<p><strong>ANSSI</strong> : Agence Nationale de la Sécurité des Systèmes d'Information. Autorité française chargée d'accompagner et de sécuriser le développement du numérique, notamment en éditant des référentiels et des guides de bonnes pratiques.</p>\n<p><strong>RGPD (Règlement Général sur la Protection des Données)</strong> : règlement européen de 2018 imposant aux organisations des mesures techniques et organisationnelles pour protéger les données personnelles qu'elles traitent.</p>\n<p><strong>ISO 27001</strong> : norme internationale de référence en matière de management de la sécurité de l'information (SMSI), définissant un ensemble de mesures de sécurité organisées en annexes.</p>\n<p><strong>Apache Guacamole (ou Bastion)</strong> : Passerelle d'accès à distance (bastion) permettant de se connecter de manière sécurisée et tracée aux serveurs internes (via les protocoles RDP ou SSH) directement depuis un navigateur web, sans exposer directement les ports du réseau interne.</p>\n<p><strong>Backblaze / S3</strong> : Service de stockage cloud de type objet (compatible avec le standard S3). Utilisé dans ce projet pour l'externalisation des sauvegardes afin de garantir la disponibilité des données hors site.</p>\n<p><strong>CARP (Common Address Redundancy Protocol)</strong> : Protocole réseau de redondance permettant à plusieurs routeurs ou pare-feux (ici, pfSense) de partager une même adresse IP virtuelle. Il assure la haute disponibilité en basculant automatiquement le trafic vers un équipement de secours en cas de panne du maître (failover).</p>\n<p><strong>Chiffrement</strong> : Procédé de cryptographie consistant à transformer une donnée lisible en un format inintelligible, nécessitant une clé spécifique pour être déchiffrée et exploitée.</p>\n<p><strong>Cluster</strong> : Grappe de serveurs ou d'équipements réseau configurés pour fonctionner de concert, augmentant ainsi la tolérance aux pannes et la disponibilité globale des services.</p>\n<p><strong>DMZ (Zone Démilitarisée)</strong> : Sous-réseau informatique isolé de part et d'autre par des pare-feux, servant de zone tampon entre le réseau interne de l'entreprise (LAN) et Internet. Elle héberge les services devant être accessibles depuis l'extérieur.</p>\n<p><strong>Duplicati</strong> : Logiciel de sauvegarde open source permettant de chiffrer les données à la source avant de les transférer de manière automatisée vers un espace de stockage distant.</p>\n<p><strong>Failover (Bascule)</strong> : Processus automatisé par lequel un équipement ou un système de secours prend le relais d'un composant principal défaillant, garantissant la continuité de service.</p>\n<p><strong>GPO (Group Policy Object)</strong> : Stratégie de groupe Microsoft permettant d'appliquer, de distribuer et de forcer de manière centralisée des configurations de sécurité et des restrictions (ex : verrouillage des sessions, blocage des ports USB) sur les postes membres du domaine.</p>\n<p><strong>LDAP (Lightweight Directory Access Protocol)</strong> : Protocole réseau standard permettant d'interroger et de modifier un annuaire centralisé pour l'authentification et l'autorisation des utilisateurs.</p>\n<p><strong>Nessus</strong> : Outil professionnel d'évaluation des vulnérabilités. Il analyse les systèmes et le réseau pour identifier les failles de sécurité, les erreurs de configuration et les correctifs logiciels manquants.</p>\n<p><strong>pfSense</strong> : Solution de pare-feu et de routage open source basée sur le système d'exploitation FreeBSD. Elle assure la protection du périmètre réseau, le filtrage des flux et la gestion des VPN.</p>\n<p><strong>PRA (Plan de Reprise d'Activité)</strong> : Ensemble de procédures techniques et organisationnelles documentées, conçues pour restaurer rapidement le système d'information de l'entreprise après un sinistre majeur (cyberattaque, incendie).</p>\n<p><strong>Ransomware (Rançongiciel)</strong> : Logiciel malveillant qui bloque l'accès aux données d'une organisation (généralement par un chiffrement fort) et exige le paiement d'une rançon pour en restituer l'accès.</p>\n<p><strong>Remédiation</strong> : Ensemble des actions correctives appliquées sur un système d'information (application de patchs, reconfiguration) suite à la découverte d'une vulnérabilité.</p>\n<p><strong>SIEM (Security Information and Event Management)</strong> : Solution de sécurité (comme Wazuh) permettant de collecter, corréler et analyser en temps réel les journaux d'événements (logs) pour détecter et alerter sur les incidents de sécurité.</p>\n<p><strong>SNMP (Simple Network Management Protocol)</strong> : Protocole de communication permettant à un serveur de supervision de collecter des métriques d'état et de performance (CPU, statut des interfaces) sur des équipements réseau distants.</p>\n<p><strong>TrueNAS / ZFS</strong> : TrueNAS est un système d'exploitation orienté stockage réseau (NAS). ZFS est le système de fichiers sous-jacent, reconnu pour sa robustesse, sa détection automatique de la corruption des données et sa gestion optimisée des snapshots.</p>\n<p><strong>VLAN (Virtual Local Area Network)</strong> : Réseau local virtuel permettant de segmenter logiquement une infrastructure réseau physique en plusieurs domaines de diffusion isolés, limitant ainsi la surface d'attaque et améliorant les performances.</p>\n<p><strong>VPN (Virtual Private Network)</strong> : Technologie établissant un tunnel chiffré et authentifié sur un réseau public (Internet), permettant d'interconnecter des sites distants ou de sécuriser les accès nomades.</p>\n<p><strong>Zabbix</strong> : Plateforme logicielle open source de supervision réseau et applicative. Elle permet de surveiller la disponibilité, la capacité et la santé des équipements en temps réel via le déploiement de sondes ou d'agents.</p>\n<p><strong>Zero Trust</strong> : Modèle d'architecture de sécurité fondé sur le principe du \"ne jamais faire confiance, toujours vérifier\". Toute tentative d'accès au réseau ou aux ressources nécessite une authentification et une autorisation strictes et continues, quelle que soit la provenance de la connexion (interne ou externe).</p>\n\n<h3>2. Réseau & Haute Disponibilité</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>pfSense</td><td>Pare-feu/routeur open source (FreeBSD) : filtrage, NAT, VPN. Deux nœuds Master/Backup dans ton projet.</td></tr>\n<tr><td>CARP + pfSync</td><td>CARP gère les IP virtuelles (VIP) partagées entre les 2 nœuds ; pfSync synchronise en temps réel la table d'états entre eux via le VLAN 99 dédié. Sans pfSync, la bascule couperait les connexions en cours.</td></tr>\n<tr><td>VLAN 802.1Q (trunk)</td><td>Tes VLAN (10 Admin, 20 Serveurs, 30 Utilisateurs, 40 DMZ, 50 Supervision, 60 Sauvegardes, 99 Sync, 100/110 site de secours) sont tous tagués sur une interface unique (LAN_TRUNK) grâce au 802.1Q, contrainte imposée par le lab (une seule carte physique disponible).</td></tr>\n<tr><td>DHCP + réservation MAC</td><td>Réservation d'adresse IP par adresse MAC pour que Guacamole pointe toujours vers le bon poste malgré l'attribution dynamique.</td></tr>\n<tr><td>VPN nomade (OpenVPN Road Warrior)</td><td>Tunnel chiffré pour les utilisateurs distants, authentifié via LDAP/AD, sans accès direct au LAN une fois connecté (double sécurité avec Guacamole).</td></tr>\n<tr><td>VPN Site-à-Site</td><td>Tunnel OpenVPN permanent entre le site principal (Paris) et le site de secours (Aubervilliers), utilisé pour la réplication ZFS et Veeam.</td></tr>\n<tr><td>Dual WAN</td><td>Deux box (Orange + Free) rattachées aux deux pare-feux du cluster pour la redondance de la sortie Internet.</td></tr>\n<tr><td>Failover</td><td>Bascule automatique et transparente : si pf1 (Master) tombe, pf2 (Backup) prend le rôle Master en quelques secondes (heartbeats CARP perdus).</td></tr>\n</table>\n\n<h3>3. Identités & Zero Trust</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Active Directory (AD DS)</td><td>Annuaire central déployé sur le VLAN 20, unique source de vérité pour l'authentification (postes, VPN, Guacamole). Un compte désactivé perd tous ses accès en une seule manipulation.</td></tr>\n<tr><td>LDAP (Bind DN, OU, samAccountName)</td><td>Le Bind DN (ex: CN=LDAP,OU=Services,OU=Kali-Brazza,DC=dracine,DC=local) est le compte de service utilisé par pfSense/Guacamole pour interroger l'annuaire. samAccountName est l'attribut de connexion utilisateur, memberOf sert à lire l'appartenance aux groupes.</td></tr>\n<tr><td>GPO (stratégies de groupe)</td><td>3 axes de durcissement appliqués sur le VLAN 30 : mot de passe renforcé (12 caractères), restriction du stockage amovible (clés USB), verrouillage automatique de l'écran de veille.</td></tr>\n<tr><td>Apache Guacamole (bastion)</td><td>Portail web dans la DMZ (VLAN 40), authentifié en LDAP (extension guacamole-auth-ldap), qui relaie des sessions RDP/SSH sans jamais exposer directement les serveurs internes.</td></tr>\n<tr><td>Zero Trust</td><td>Stratégie « double sécurité » : VPN authentifié PUIS ré-authentification sur Guacamole, aucun accès direct au réseau de production même une fois le VPN monté.</td></tr>\n</table>\n\n<h3>4. Sécurité, Supervision & Conformité</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Nessus (scan authentifié)</td><td>Basic Network Scan avec Credentials Windows injectés, pour auditer aussi les vulnérabilités internes (pas seulement celles visibles de l'extérieur). Exemple trouvé : Visual Studio Code obsolète sur le contrôleur de domaine.</td></tr>\n<tr><td>Zabbix (supervision)</td><td>Ciblée sur les points critiques : statut CARP du cluster, trafic WAN, disponibilité DNS, service LDAP/AD DS (threads actifs, sessions, recherches/écritures par seconde).</td></tr>\n<tr><td>SNMP</td><td>Protocole utilisé par Zabbix pour interroger l'état des équipements réseau (pfSense) à distance.</td></tr>\n<tr><td>Wazuh (SIEM)</td><td>Centralise les logs de sécurité des agents Windows/Linux, détecte les comportements suspects (échecs d'authentification LDAP observés concrètement pendant le projet) et génère des alertes en temps réel.</td></tr>\n<tr><td>RGPD / ISO 27001 / ANSSI</td><td>Cadre réglementaire et normatif justifiant le durcissement (GPO), le chiffrement (AES-256) et la traçabilité (SIEM) mis en place.</td></tr>\n<tr><td>AMDEC (méthode de gestion des risques)</td><td>Cotation Fréquence x Gravité = Criticité pour prioriser les risques internes, externes et climatiques (ex : Cyberattaque cotée 8, la plus critique du tableau).</td></tr>\n<tr><td>Ransomware</td><td>Menace principale justifiant les snapshots immuables en lecture seule sur le TrueNAS de secours (protection même si le site principal est chiffré par une attaque).</td></tr>\n</table>\n\n<h3>5. Sauvegarde & Plan de Reprise d'Activité (PRA)</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Règle 3-2-1</td><td>3 copies des données, sur 2 supports différents, dont 1 hors site : ici TrueNAS local + Backblaze B2 (cloud) + TrueNAS du site de secours.</td></tr>\n<tr><td>Duplicati (AES-256, chiffrement à la source)</td><td>2 jobs : « Local » (Zabbix, Wazuh, Nessus vers TrueNAS) et « Cloud » (System State AD + Zabbix vers Backblaze B2), chiffrés avant tout transfert.</td></tr>\n<tr><td>SHA-256 (vérification d'intégrité)</td><td>Empreinte utilisée pour prouver, après restauration, que le fichier restauré est bit-à-bit identique à l'original (aucune perte/corruption).</td></tr>\n<tr><td>wbadmin / System State</td><td>Commande PowerShell native Windows sauvegardant l'annuaire Active Directory directement sur un partage SMB TrueNAS.</td></tr>\n<tr><td>TrueNAS / ZFS (pool, dataset, snapshot, replication)</td><td>Pool de stockage (backup-pool), dataset dédié (duplicati), snapshots périodiques planifiés, et réplication native ZFS (zfs send/receive via SSH) vers le site de secours chaque nuit à 5h00, rétention 15 jours.</td></tr>\n<tr><td>Backblaze B2 (S3)</td><td>Stockage objet cloud compatible S3, utilisé comme copie externalisée hors site à faible coût (~132 €/an pour 2 To).</td></tr>\n<tr><td>Veeam Backup & Replication</td><td>Réplication de VM critiques (pfSense x2, AD, serveur applicatif) vers l'hôte ESXi de secours, en mode standalone (sans vCenter).</td></tr>\n<tr><td>CBT (Changed Block Tracking)</td><td>Mécanisme Veeam qui n'identifie que les blocs disque modifiés depuis la dernière sauvegarde, expliquant le gain de temps entre la sauvegarde complète (48 min) et l'incrémentielle (6 min 52s).</td></tr>\n<tr><td>Guest Processing</td><td>Fonctionnalité Veeam nécessitant un agent Windows (VSS) ; échoue normalement sur les VM non-Windows (pfSense, Debian).</td></tr>\n<tr><td>Failover / Failback (Veeam)</td><td>Failover = démarrage des VM répliquées sur le site de secours en cas de sinistre. Failback = resynchronisation des réplicas vers le site de production une fois celui-ci rétabli.</td></tr>\n<tr><td>PRA (Plan de Reprise d'Activité)</td><td>Ensemble cohérent : tunnel VPN S2S + réplication ZFS + réplication Veeam, formalisé et testé (recette) avant la mise en production.</td></tr>\n</table>\n\n<h3>6. Méthodologie & Gestion de Projet</h3>\n<table>\n<tr><th>Concept</th><th>À savoir pour la soutenance</th></tr>\n<tr><td>Bête à cornes</td><td>Diagramme d'analyse fonctionnelle du besoin : à qui rend-il service (staff, invités), sur quoi agit-il (politique de sécurité du SI), dans quel but (améliorer sécurité et disponibilité).</td></tr>\n<tr><td>Cahier des charges (CDCF / CDCT)</td><td>CDCF = besoins fonctionnels et périmètre (ce que le projet couvre / ne couvre pas). CDCT = exigences et contraintes techniques (matériel existant, interface réseau unique, absence de vCenter...).</td></tr>\n<tr><td>Méthode Scrumban (Agile)</td><td>6 sprints d'une semaine, chacun avec réunion de planification + revue de validation ; hybride entre Scrum (sprints) et Kanban (flux continu de tâches).</td></tr>\n<tr><td>Matrice RACI</td><td>Réalisateur / Approbateur / Consulté / Informé — clarifie qui fait quoi sur chaque lot du projet (toi en R, le tuteur en A).</td></tr>\n<tr><td>Diagramme de Gantt</td><td>Visualisation des 6 sprints, jalons (losanges) et liaisons fin-début, avec la pause de congés intégrée sans décaler la deadline finale.</td></tr>\n</table>\n\n<p style=\"margin-top:20px;font-style:italic;color:var(--text-light)\">Relis cette fiche juste avant ta soutenance : sois capable d'expliquer, pour chaque ligne, le POURQUOI (le besoin auquel ça répond) et pas seulement le COMMENT (la manipulation technique) — c'est souvent ce que recherchent les jurys AIS.</p>\n";

// ─── STATE ────────────────────────────────────────────────────────────────────
const STORAGE_KEY = "ais_progress_v4";
let progress = {};
let currentScreen = "home";
let quizData = null;
let quizResults = [];
let quizIdx = 0;
let quizAnswered = false;
let quizSelected = null;
let currentCourseId = null;

// ─── OFFLINE/SYNC ─────────────────────────────────────────────────────────────
function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch {}
}
function updateProgress(chId, origIdx, correct) {
  if (!progress[chId]) progress[chId] = {};
  progress[chId][origIdx] = correct;
  saveProgress();
}

// ─── OFFLINE DETECTION ────────────────────────────────────────────────────────
window.addEventListener('online', () => { document.getElementById('offlineBadge').classList.remove('show'); });
window.addEventListener('offline', () => { document.getElementById('offlineBadge').classList.add('show'); });
if (!navigator.onLine) document.getElementById('offlineBadge').classList.add('show');

// ─── UTILS ────────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
// Parses [[key]] or [[key:Display Label]] markup into clickable glossary terms.
function linkTerms(html) {
  if (!html) return '';
  return html.replace(/\[\[([a-zA-Z0-9_\-]+)(?::([^\]]+))?\]\]/g, (m, key, disp) => {
    const label = disp || key;
    if (!glossary[key]) return label;
    return `<span class="term" onclick="showTerm('${key}')">${label}*</span>`;
  });
}
function showTerm(key) {
  const def = glossary[key];
  if (!def) return;
  const title = def.split(/[:：]/)[0].trim();
  document.getElementById('termTitle').textContent = title;
  document.getElementById('termDef').textContent = def;
  document.getElementById('termModal').classList.add('open');
}
function closeTermModal() {
  document.getElementById('termModal').classList.remove('open');
}

function findModule(chId) {
  return chapters.find(c => c.id === chId) || extraModules.find(m => m.id === chId);
}
function getChapterPct(chId) {
  const ch = findModule(chId);
  if (!ch || !progress[chId]) return 0;
  return Math.round(Object.keys(progress[chId]).length / ch.questions.length * 100);
}
function getChapterCorrectPct(chId) {
  const ch = findModule(chId);
  if (!ch || !progress[chId]) return 0;
  return Math.round(Object.values(progress[chId]).filter(Boolean).length / ch.questions.length * 100);
}
function getGlobalStats() {
  const totalQ = chapters.reduce((s,c) => s+c.questions.length, 0);
  const totalA = chapters.reduce((s,c) => s+(progress[c.id]?Object.keys(progress[c.id]).length:0), 0);
  const totalC = chapters.reduce((s,c) => s+(progress[c.id]?Object.values(progress[c.id]).filter(Boolean).length:0), 0);
  return { totalQ, totalA, totalC, pct: Math.round(totalA/totalQ*100), correctPct: Math.round(totalC/totalQ*100) };
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function navigate(to, data) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  currentScreen = to;
  if (data) quizData = data;
  renderScreen(to);
  const el = document.getElementById('screen-'+to);
  el.classList.add('active');
  el.scrollTop = 0;
  window.scrollTo(0,0);
}

// ─── DOWNLOAD ─────────────────────────────────────────────────────────────────
function downloadApp() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'revisions-ais.html';
  a.click();
}

// ─── QUIT MODAL ───────────────────────────────────────────────────────────────
function openQuitModal() {
  const correct = quizResults.filter(r=>r.correct).length;
  document.getElementById('quitScore').textContent = `${correct}/${quizResults.length} réponses correctes jusqu'ici (${quizResults.length > 0 ? Math.round(correct/quizResults.length*100) : 0}%)`;
  document.getElementById('quitModal').classList.add('open');
}
function closeQuitModal() {
  document.getElementById('quitModal').classList.remove('open');
}
function confirmQuit() {
  document.getElementById('quitModal').classList.remove('open');
  if (quizResults.length > 0) {
    navigate('results', { ...quizData, results: quizResults, questions: quizData.questions.slice(0, quizResults.length) });
  } else {
    navigate('home');
  }
}

// ─── SVG RING ─────────────────────────────────────────────────────────────────
function progressRing(pct, size=54, stroke=5, color='var(--accent)') {
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c-(pct/100)*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-card-alt)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset 0.6s ease"/>
  </svg>`;
}
function progressBar(pct, h=8, color='') {
  const col = color || 'var(--accent)';
  return `<div class="progress-bar" style="height:${h}px"><div class="progress-bar-inner" style="width:${pct}%;background:${col}"></div></div>`;
}
function barColor(cpct) {
  return cpct >= 80 ? 'var(--success)' : cpct >= 50 ? 'var(--warning)' : 'var(--accent)';
}

// ─── SCREENS ──────────────────────────────────────────────────────────────────
function renderScreen(screen) {
  const el = document.getElementById('screen-'+screen);
  if (screen==='home') el.innerHTML = renderHome();
  else if (screen==='chapters') el.innerHTML = renderChapters();
  else if (screen==='groups') el.innerHTML = renderGroups();
  else if (screen==='coursehub') el.innerHTML = renderCourseHub();
  else if (screen==='course') el.innerHTML = renderCourse();
  else if (screen==='memoire') el.innerHTML = renderMemoire();
  else if (screen==='quiz') { quizIdx=0; quizResults=[]; quizAnswered=false; quizSelected=null; el.innerHTML = renderQuiz(); }
  else if (screen==='results') el.innerHTML = renderResults();
}

function renderHome() {
  const {totalQ,totalA,totalC,pct,correctPct} = getGlobalStats();
  const chRows = chapters.map((ch,i) => {
    const p = getChapterPct(ch.id);
    const cp = getChapterCorrectPct(ch.id);
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);animation:slideUp ${0.3+i*0.05}s ease">
      <span style="font-size:18px;width:28px;text-align:center">${ch.icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ch.title}</div>
        <div style="margin-top:6px">${progressBar(p,5,barColor(cp))}</div>
      </div>
      <span style="font-size:13px;font-weight:600;color:${p===100?'var(--success)':'var(--text-light)'};min-width:36px;text-align:right">${p}%</span>
    </div>`;
  }).join('');

  const extraRows = extraModules.map((m,i) => {
    const p = getChapterPct(m.id);
    const cp = getChapterCorrectPct(m.id);
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);animation:slideUp ${0.3+i*0.05}s ease">
      <span style="font-size:18px;width:28px;text-align:center">${m.icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.title}</div>
        <div style="margin-top:6px">${progressBar(p,5,barColor(cp))}</div>
      </div>
      <span style="font-size:13px;font-weight:600;color:${p===100?'var(--success)':'var(--text-light)'};min-width:36px;text-align:right">${p}%</span>
    </div>`;

// Builds the "always shown" explanation panel: works for BOTH the new rich
// format ({def, why[]}) used by all newly-added content, and the legacy
// single-string format ({explain}) used by the original 9 chapters.
function renderExplanationBox(q, isCorrect) {
  const boxClass = isCorrect ? 'correct-explain' : 'wrong-explain';
  const header = isCorrect
    ? `<div style="font-weight:700;color:var(--success);margin-bottom:8px;font-size:13.5px">✅ Bonne réponse — voici pourquoi, en détail</div>`
    : `<div style="font-weight:700;color:var(--error);margin-bottom:8px;font-size:13.5px">❌ Pas tout à fait — comprenons pourquoi</div>`;

  if (q.why && Array.isArray(q.why)) {
    const defHtml = q.def ? `<div class="def-box">📖 ${linkTerms(q.def)}</div>` : '';
    const rows = q.options.map((opt, i) => {
      const isAns = i === q.answer;
      const icon = isAns ? '✅' : '❌';
      const color = isAns ? 'var(--success)' : 'var(--error)';
      const label = String.fromCharCode(65+i);
      return `<div class="why-row">
        <span style="flex-shrink:0;font-weight:700;color:${color}">${icon} ${label}.</span>
        <span>${linkTerms(q.why[i] || '')}</span>
      </div>`;
    }).join('');
    return `<div class="explanation-box ${boxClass}">${header}${defHtml}${rows}</div>`;
  }
  // Legacy format (original 9 chapters): single explain string, shown always now.
  const legacyText = q.explain ? linkTerms(q.explain) : '';
  return `<div class="explanation-box ${boxClass}">${header}<div style="font-size:13.5px;color:var(--text);line-height:1.6">${legacyText}</div>
    ${!isCorrect ? `<div style="margin-top:10px;font-size:13px;color:var(--success);font-weight:600">✅ Bonne réponse : ${q.options[q.answer]}</div>` : ''}
  </div>`;
}

function renderQuizQuestion() {
  const el = document.getElementById('quiz-inner');
  if (!el) return;
  const { title, questions } = quizData;
  const q = questions[quizIdx];
  const pct = Math.round(quizIdx / questions.length * 100);

  const optButtons = q.options.map((opt, oi) => {
    let extra = '';
    if (quizAnswered) {
      if (oi === q.answer) extra = 'correct';
      else if (oi === quizSelected && oi !== q.answer) extra = 'wrong';
    }
    const labelBg = quizAnswered && oi===q.answer ? 'var(--success)' : quizAnswered && oi===quizSelected ? 'var(--error)' : 'var(--bg-card-alt)';
    const labelColor = quizAnswered && (oi===q.answer||oi===quizSelected) ? '#fff' : 'var(--text-light)';
    return `<button class="option-btn ${extra}" ${quizAnswered?'disabled':''} onclick="selectAnswer(${oi})" style="animation:slideUp ${0.2+oi*0.06}s ease">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;margin-right:12px;font-size:13px;font-weight:600;background:${labelBg};color:${labelColor};transition:all 0.25s ease;flex-shrink:0">${String.fromCharCode(65+oi)}</span>${opt}
    </button>`;
  }).join('');

  let explainBox = '';
  if (quizAnswered) explainBox = renderExplanationBox(q, quizSelected===q.answer);

  const nextBtn = quizAnswered ? `<button class="btn" onclick="nextQuestion()" style="width:100%;padding:16px;border-radius:14px;margin-top:20px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#FDF6F0;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(93,74,49,0.2);animation:pop 0.3s ease">
    ${quizIdx+1 >= questions.length ? 'Voir les résultats 🎯' : 'Question suivante →'}
  </button>` : '';

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding-top:20px;padding-bottom:16px">
      <button class="btn" onclick="openQuitModal()" style="background:none;color:var(--accent);font-size:22px;padding:4px 8px;line-height:1;border-radius:8px;border:1.5px solid var(--bg-card-alt)">✕</button>
      <div style="flex:1">${progressBar(pct,8)}</div>
      <span style="font-size:14px;font-weight:600;color:var(--accent);min-width:50px;text-align:right">${quizIdx+1}/${questions.length}</span>
    </div>
    <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">${title}</div>
    <div key="${quizIdx}" style="background:var(--bg-card);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow);animation:pop 0.35s ease">
      <div style="font-size:17px;font-weight:600;line-height:1.5;color:var(--text)">${q.q}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${optButtons}
    </div>
    ${explainBox}
    ${nextBtn}`;
}

function selectAnswer(oi) {
  if (quizAnswered) return;
  quizSelected = oi;
  quizAnswered = true;
  const q = quizData.questions[quizIdx];
  const correct = oi === q.answer;
  quizResults.push({ correct });
  if (q.chId !== undefined) {
    updateProgress(q.chId, q.origIdx, correct);
  }
  renderQuizQuestion();
}

function nextQuestion() {
  if (quizIdx+1 >= quizData.questions.length) {
    navigate('results', { ...quizData, results: quizResults });
    return;
  }
  quizIdx++;
  quizAnswered = false;
  quizSelected = null;
  renderQuizQuestion();
}

function renderResults() {
  const { title, results, questions } = quizData;
  const correct = results.filter(r=>r.correct).length;
  const total = results.length;
  const pct = Math.round((correct/total)*100);
  const grade = pct>=80?'Excellent !':pct>=60?'Bien !':pct>=40?'À revoir':'À travailler';
  const gradeColor = pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--error)';
  const gradeEmoji = pct>=80?'🏆':pct>=60?'👍':pct>=40?'📖':'💪';

  const reviewItems = results.map((r,i) => {
    const q = questions[i];
    const short = q?.explain ? q.explain.substring(0,120) : (q?.def ? q.def.replace(/\[\[([a-zA-Z0-9_\-]+)(?::([^\]]+))?\]\]/g,(m,k,d)=>d||k).substring(0,120) : '');
    return `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--bg-card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);border-left:3px solid ${r.correct?'var(--success)':'var(--error)'};animation:slideUp ${0.2+i*0.03}s ease">
      <span style="font-size:16px;flex-shrink:0;margin-top:1px">${r.correct?'✅':'❌'}</span>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--text);line-height:1.4">${q?.q?.substring(0,80)}${q?.q?.length>80?'...':''}</div>
        ${!r.correct && short ? `<div style="font-size:12px;color:var(--text-light);margin-top:4px;line-height:1.4">💡 ${short}${short.length>=120?'...':''}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div style="text-align:center;padding-top:48px;padding-bottom:20px;animation:pop 0.5s ease">
      <div style="font-size:60px;margin-bottom:8px">${gradeEmoji}</div>
      <h2 style="font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--accent-dark);margin-bottom:6px">${grade}</h2>
      <p style="color:var(--text-light);font-size:14px">${title}</p>
    </div>
    <div style="background:var(--bg-card);border-radius:20px;padding:28px;text-align:center;box-shadow:var(--shadow-lg);margin-bottom:24px;animation:slideUp 0.4s ease">
      <div style="position:relative;display:inline-block;margin-bottom:16px">
        ${progressRing(pct,120,10,gradeColor)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span style="font-size:32px;font-weight:700;color:${gradeColor}">${pct}%</span>
        </div>
      </div>
      <div style="display:flex;justify-content:center;gap:32px">
        <div><div style="font-size:24px;font-weight:700;color:var(--success)">${correct}</div><div style="font-size:12px;color:var(--text-light)">Correctes</div></div>
        <div style="width:1px;background:var(--bg-card-alt)"></div>
        <div><div style="font-size:24px;font-weight:700;color:var(--error)">${total-correct}</div><div style="font-size:12px;color:var(--text-light)">Incorrectes</div></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px">Résumé des réponses</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">${reviewItems}</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" onclick="navigate('home')" style="width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);color:#FDF6F0;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(93,74,49,0.2)">Retour à l'accueil</button>
      <button class="btn" onclick="restartQuiz()" style="width:100%;padding:14px;border-radius:14px;background:transparent;border:2px solid var(--accent-light);color:var(--accent);font-size:15px;font-weight:600">Recommencer 🔄</button>
    </div>`;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function startChapter(chId) {
  const ch = findModule(chId);
  const qs = shuffle(ch.questions.map((q,idx) => ({...q, chId:ch.id, origIdx:idx})));
  navigate('quiz', { title:ch.title, questions:qs, mode:'chapter', chapterId:ch.id });
}
function startGroup(gId) {
  const g = chapterGroups.find(g => g.id===gId);
  const gChs = chapters.filter(c => g.chapterIds.includes(c.id));
  const qs = [];
  gChs.forEach(ch => ch.questions.forEach((q,idx) => qs.push({...q, chId:ch.id, origIdx:idx})));
  navigate('quiz', { title:`Examen : ${g.title}`, questions:shuffle(qs).slice(0,20), mode:'group-exam' });
}
function startGlobalExam() {
  const allQ = [];
  chapters.forEach(ch => ch.questions.forEach((q,i) => allQ.push({...q, chId:ch.id, origIdx:i})));
  navigate('quiz', { title:'Examen Blanc Global', questions:shuffle(allQ).slice(0,40), mode:'exam' });
}
function restartQuiz() {
  const qs = shuffle(quizData.questions);
  navigate('quiz', { ...quizData, questions:qs });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadProgress();
renderScreen('home');
document.getElementById('screen-home').classList.add('active');

// Render first quiz question after navigating to the quiz screen.
const _origNavigate = navigate;
window.navigate = function(to, data) {
  _origNavigate(to, data);
  if (to === 'quiz') {
    setTimeout(() => renderQuizQuestion(), 0);
  }
};
navigate('home');
</script>
</body>
</html>
