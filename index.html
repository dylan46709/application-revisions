le est l'adresse réseau ?", "options": ["82.82.59.0/26", "82.82.59.64/26", "82.82.59.128/26", "82.82.59.192/26"], "answer": 2, "def": "L'adresse réseau est le premier bloc qui contient l'hôte, arrondi au multiple du bloc de 64 (256/4 sous-réseaux de /26).", "why": ["82.82.59.0/26 couvre .0-.63, l'adresse .132 n'y appartient pas.", "82.82.59.64/26 couvre .64-.127, toujours pas .132.", "Correct : 82.82.59.128/26 couvre .128-.191, qui contient bien .132.", "82.82.59.192/26 couvre .192-.255, un bloc situé après celui de .132."]}, {"q": "Quelles sont les 4 étapes du dialogue DHCP (DORA) ?", "options": ["Discover, Offer, Request, Acknowledge", "Detect, Open, Register, Accept", "Discover, Ok, Renew, Ack", "Demand, Offer, Reply, Ack"], "answer": 0, "def": "[[dhcp:DHCP]] attribue une IP en 4 échanges appelés DORA, tous en broadcast/UDP au départ car le client n'a pas encore d'adresse IP.", "why": ["Correct : DHCPDISCOVER (le client cherche un serveur), DHCPOFFER (le serveur propose une IP), DHCPREQUEST (le client la demande officiellement), DHCPACK (le serveur confirme).", "'Detect/Open/Register/Accept' n'existe pas dans la RFC du DHCP, c'est un intrus qui ressemble à tort à DORA.", "'Ok' et 'Renew' ne sont pas les termes officiels des étapes 2 et 3 du DORA.", "'Demand' et 'Reply' ne correspondent pas à la terminologie DHCP standard (Discover/Offer/Request/Ack)."]}, {"q": "Sur quels ports UDP fonctionne le protocole DHCP ?", "options": ["Ports 53 et 54", "Ports 67 et 68", "Ports 80 et 443", "Ports 546 et 547"], "answer": 1, "def": "DHCP utilise deux ports UDP fixes : un pour le serveur, un pour le client.", "why": ["53 et 54 seraient proches du port DNS (53) mais ne sont pas les ports DHCP.", "Correct : le serveur DHCP écoute sur le port 67, le client répond sur le port 68.", "80 et 443 sont les ports HTTP/HTTPS, sans rapport avec DHCP.", "546 et 547 sont les ports de DHCPv6 (IPv6), pas ceux du DHCP IPv4 classique."]}, {"q": "Que signifie 'Next Hop' dans une table de routage ?", "options": ["L'adresse IP de destination finale", "Le prochain routeur/réseau sur le chemin vers la destination", "Le nombre de sauts restants avant expiration du TTL", "L'interface de sortie physique du switch"], "answer": 1, "def": "Le routage se fait saut par saut* : chaque routeur ne connaît pas tout le chemin, juste où envoyer le paquet ensuite.", "why": ["Le Next Hop n'est pas la destination finale mais une étape intermédiaire vers celle-ci.", "Correct : c'est l'adresse du prochain routeur (ou réseau directement connecté) auquel transmettre le paquet pour se rapprocher de la destination.", "Le nombre de sauts restants est lié au TTL, un champ distinct du Next Hop dans la table de routage.", "L'interface de sortie est une information associée à la route, mais 'Next Hop' désigne spécifiquement l'adresse du routeur suivant."]}, {"q": "Citez un protocole de redondance de passerelle de niveau 3.", "options": ["STP (Spanning Tree Protocol)", "HSRP ou VRRP", "802.1Q", "LACP"], "answer": 1, "def": "Ces protocoles permettent à deux routeurs/pare-feux de partager une IP virtuelle* pour assurer la continuité si l'un tombe en panne.", "why": ["STP est un protocole anti-boucle de niveau 2, pas un protocole de redondance de passerelle niveau 3.", "Correct : HSRP (Cisco) et VRRP (standard) créent une passerelle virtuelle redondante entre plusieurs routeurs.", "802.1Q est le protocole de tagging VLAN, sans lien avec la redondance de passerelle.", "LACP agrège des liens physiques en un lien logique, ce n'est pas un protocole de redondance de couche 3."]}, {"q": "Quels sont les 3 premiers mots-clés de la commande NAT sur un routeur Cisco ?", "options": ["ip route static", "ip nat inside/outside", "access-list permit any", "interface vlan"], "answer": 1, "def": "La configuration NAT* sur Cisco distingue toujours le côté interne (inside) du côté externe (outside).", "why": ["'ip route static' sert à créer une route statique, pas à activer le NAT.", "Correct : on configure 'ip nat inside' sur l'interface LAN et 'ip nat outside' sur l'interface WAN.", "'access-list permit any' définit une ACL, utilisée en complément du NAT mais n'est pas la commande NAT elle-même.", "'interface vlan' sert à créer une interface virtuelle de VLAN, sans rapport direct avec l'activation du NAT."]}, {"q": "Quelle est la taille de l'en-tête Ethernet, en octets ?", "options": ["8 octets", "12 octets", "14 octets", "20 octets"], "answer": 2, "def": "L'en-tête Ethernet* contient : adresse MAC destination (6) + adresse MAC source (6) + type/longueur (2).", "why": ["8 octets correspondrait au préambule + delimiter, pas à l'en-tête Ethernet lui-même.", "12 octets ne compterait que les deux adresses MAC, en oubliant le champ EtherType.", "Correct : 6+6+2 = 14 octets exactement pour l'en-tête Ethernet classique.", "20 octets est la taille de l'en-tête IP (couche 3), pas celle de l'en-tête Ethernet (couche 2)."]}, {"q": "Quelle est la taille de l'en-tête IP, en octets ?", "options": ["14 octets", "20 octets", "24 octets", "32 octets"], "answer": 1, "def": "L'en-tête IPv4* de base (sans options) fait 20 octets : version, longueur, TTL, protocole, adresses source/destination, etc.", "why": ["14 octets est la taille de l'en-tête Ethernet (couche 2), pas celle de l'en-tête IP.", "Correct : l'en-tête IPv4 standard sans options fait 20 octets.", "24 octets pourrait correspondre à un en-tête IP avec quelques options ajoutées, mais pas la taille de base.", "32 octets serait un en-tête IP avec le maximum d'options, largement au-dessus de la taille standard de 20 octets."]}, {"q": "Comment fonctionne le NAT (Network Address Translation) ?", "options": ["Il chiffre les paquets IP avant de les envoyer sur Internet", "Il traduit les adresses IP privées en une ou plusieurs adresses IP publiques", "Il attribue dynamiquement des adresses IP aux hôtes du LAN", "Il bloque les paquets non sollicités venant d'Internet"], "answer": 1, "def": "Le NAT fait correspondre les adresses privées* internes à une adresse publique routable pour accéder à Internet.", "why": ["Le NAT ne chiffre rien : il modifie uniquement les en-têtes IP (et ports), sans notion de chiffrement.", "Correct : le routeur NAT remplace l'IP privée source par son IP publique (et inversement pour les réponses), permettant à plusieurs hôtes de partager une IP publique.", "L'attribution dynamique d'IP aux hôtes du LAN, c'est le rôle du DHCP, pas du NAT.", "Bloquer les paquets non sollicités est une fonction de pare-feu (stateful firewall), un effet de bord du NAT mais pas sa fonction première."]}, {"q": "Quelle commande permet de tester la connectivité vers une machine distante ?", "options": ["tracert", "ping", "netstat", "nslookup"], "answer": 1, "def": "Le ping* envoie des paquets ICMP Echo Request et mesure le temps de réponse (round-trip time).", "why": ["tracert affiche le chemin emprunté (les routeurs traversés), pas seulement l'accessibilité.", "Correct : ping est l'outil de base pour vérifier qu'une machine répond sur le réseau.", "netstat affiche les connexions et ports en cours, pas un test de connectivité vers une machine.", "nslookup interroge le DNS pour obtenir une IP à partir d'un nom, il ne teste pas la connectivité réseau."]}, {"q": "Quelle commande permet d'obtenir des informations sur la résolution DNS ?", "options": ["ipconfig", "netstat", "nslookup", "arp -a"], "answer": 2, "def": "nslookup* interroge directement un serveur DNS pour connaître la correspondance nom ↔ IP.", "why": ["ipconfig affiche la configuration IP locale, il n'interroge pas activement un serveur DNS.", "netstat liste les connexions réseau actives, sans lien avec la résolution de noms.", "Correct : nslookup envoie une requête DNS et affiche la réponse du serveur interrogé.", "arp -a affiche la table de correspondance IP/MAC locale, pas les résolutions DNS."]}, {"q": "Quelle commande liste les ports ouverts / connexions réseau sur un PC ?", "options": ["netstat", "tracert", "ping", "ipconfig"], "answer": 0, "def": "netstat* (NETwork STATistics) affiche les connexions actives, les ports en écoute et les tables de routage.", "why": ["Correct : netstat -a (ou -ano sous Windows) montre les ports ouverts et les connexions en cours.", "tracert détermine le chemin réseau vers une destination, il ne liste pas les ports locaux.", "ping teste juste la joignabilité d'une machine, sans information sur les ports.", "ipconfig affiche la configuration IP de la machine, pas ses connexions réseau actives."]}, {"q": "Quelle commande détermine le chemin (les routeurs) emprunté pour joindre un serveur distant ?", "options": ["ping -t", "tracert / traceroute", "netstat -r", "nslookup -type=ns"], "answer": 1, "def": "tracert (Windows) / traceroute (Linux)* envoie des paquets à TTL croissant pour révéler chaque routeur traversé.", "why": ["ping -t répète le ping en continu, mais ne révèle pas les routeurs intermédiaires.", "Correct : tracert/traceroute affiche chaque saut (routeur) entre la source et la destination.", "netstat -r affiche la table de routage locale, pas le chemin réel emprunté par les paquets.", "nslookup -type=ns interroge les serveurs de noms (NS) d'un domaine, sans rapport avec le chemin réseau."]}, {"q": "Comment connaît-on facilement son adresse IP publique (WAN) ?", "options": ["Avec la commande ipconfig", "En consultant un site web dédié (type 'quel est mon IP')", "Avec la commande arp -a", "En regardant l'étiquette de la box"], "answer": 1, "def": "L'IP publique* est vue depuis Internet ; un site externe est le moyen le plus simple de la connaître car il voit l'IP telle qu'elle sort du NAT.", "why": ["ipconfig n'affiche que l'IP privée locale (LAN), pas l'IP publique attribuée par le FAI.", "Correct : un site web externe reçoit directement la requête avec l'IP publique visible depuis Internet, et l'affiche.", "arp -a montre la table ARP locale du LAN, aucune information sur l'IP publique.", "L'étiquette de la box indique généralement des identifiants matériels, pas l'IP publique dynamique du FAI."]}, {"q": "Quelle est la commande la plus simple pour vérifier la configuration de la pile TCP/IP locale ?", "options": ["ipconfig / ifconfig", "netstat", "tracert", "nslookup"], "answer": 0, "def": "ipconfig (Windows) / ifconfig ou ip a (Linux)* affiche IP, masque, passerelle, DNS et adresse MAC de chaque interface.", "why": ["Correct : ipconfig (ou ifconfig/ip a sous Linux) montre toute la configuration réseau locale en une commande.", "netstat montre les connexions actives, pas la configuration des interfaces elles-mêmes.", "tracert sert à tracer un chemin réseau vers une machine distante, pas à afficher la configuration locale.", "nslookup interroge le DNS, il ne renseigne pas sur la configuration IP de la machine locale."]}, {"q": "Comment vérifier rapidement que sa propre carte réseau fonctionne ?", "options": ["ping 255.255.255.255", "ping 127.0.0.1 (loopback)", "tracert 8.8.8.8", "nslookup localhost"], "answer": 1, "def": "127.0.0.1 est l'adresse de bouclage* (loopback) : un ping réussi prouve que la pile réseau locale fonctionne, indépendamment du câble ou du switch.", "why": ["255.255.255.255 est une adresse de broadcast limité, pas un test de la carte réseau locale.", "Correct : pinger 127.0.0.1 teste la pile TCP/IP de la machine elle-même, sans dépendre du câble ni du réseau externe.", "tracert 8.8.8.8 teste la connectivité Internet complète, un échec ne dit pas si le problème vient de la carte réseau.", "nslookup localhost interroge une résolution DNS, ce n'est pas un test direct de la carte réseau."]}, {"q": "Quelle commande simple vérifie la connectivité au sein du réseau local (LAN) ?", "options": ["ping (vers une IP du LAN)", "tracert (vers l'extérieur)", "nslookup (vers un domaine externe)", "ipconfig /flushdns"], "answer": 0, "def": "Un ping vers une autre machine du LAN* confirme que la communication de couche 2/3 fonctionne localement.", "why": ["Correct : un ping réussi vers une IP du même sous-réseau confirme la connectivité LAN.", "tracert vers l'extérieur teste le chemin vers Internet, pas spécifiquement le LAN local.", "nslookup vers un domaine externe teste la résolution DNS, pas la connectivité LAN.", "ipconfig /flushdns vide le cache DNS local, une commande de maintenance sans rapport avec un test de connectivité."]}, {"q": "Quelle commande vérifie la connectivité vers l'extérieur (WAN), par exemple vers Internet ?", "options": ["ping 8.8.8.8", "ping 127.0.0.1", "arp -a", "ipconfig /all"], "answer": 0, "def": "8.8.8.8* est une IP publique fiable (DNS Google) souvent utilisée pour tester l'accès Internet indépendamment du DNS.", "why": ["Correct : pinger une IP publique connue (8.8.8.8) confirme que la sortie Internet (WAN) fonctionne.", "127.0.0.1 est le loopback local, il ne teste que la machine elle-même, pas la connectivité WAN.", "arp -a affiche uniquement la table de correspondance IP/MAC du LAN local.", "ipconfig /all affiche la configuration réseau, sans effectuer de test de connectivité réel."]}, {"q": "Quelle est la fonction du protocole ARP ?", "options": ["Traduire un nom de domaine en adresse IP", "Résoudre une adresse IP en adresse MAC", "Attribuer dynamiquement une IP à un hôte", "Router les paquets entre deux réseaux distants"], "answer": 1, "def": "ARP (Address Resolution Protocol)* fait le pont entre la couche 3 (IP) et la couche 2 (MAC) sur un même LAN.", "why": ["Traduire un nom en IP, c'est le rôle du DNS, pas d'ARP.", "Correct : ARP envoie une requête broadcast 'qui a cette IP ?' et reçoit la réponse contenant l'adresse MAC correspondante.", "Attribuer une IP dynamiquement est la fonction du DHCP, pas d'ARP.", "Router les paquets entre réseaux distants est une fonction de couche 3 assurée par les routeurs/protocoles de routage, pas par ARP qui reste local au LAN."]}, {"q": "À quoi servent principalement les VLANs ?", "options": ["À augmenter la vitesse du câble réseau", "À segmenter logiquement le réseau pour la sécurité et l'organisation", "À remplacer le protocole IP", "À chiffrer le trafic entre deux switches"], "answer": 1, "def": "Un VLAN (Virtual LAN)* crée des domaines de diffusion séparés sur un même switch physique, indépendamment du câblage.", "why": ["Le VLAN ne change rien à la vitesse physique du câble (débit du lien), c'est une segmentation logique.", "Correct : les VLANs isolent des groupes de machines entre eux (sécurité, organisation) sans changer le câblage physique.", "IP reste le protocole de couche 3 utilisé ; le VLAN opère en couche 2 et ne le remplace pas.", "Le VLAN ne chiffre pas le trafic ; le tagging 802.1Q ajoute juste un identifiant de VLAN, pas de chiffrement."]}, {"q": "Quel protocole standard permet de faire des liens trunk transportant plusieurs VLANs ?", "options": ["ISL (propriétaire Cisco, obsolète)", "802.1Q (dot1q)", "STP", "ARP"], "answer": 1, "def": "802.1Q* est la norme IEEE de tagging VLAN sur les liens trunk, elle a remplacé l'ancien ISL propriétaire.", "why": ["ISL a existé mais est propriétaire Cisco et largement abandonné au profit du standard ouvert.", "Correct : 802.1Q insère un tag de VLAN dans la trame Ethernet, permettant à un trunk de transporter plusieurs VLANs.", "STP empêche les boucles réseau, il ne gère pas le tagging des VLANs sur les trunks.", "ARP résout des adresses IP en adresses MAC, sans rapport avec le trunking VLAN."]}, {"q": "Combien de VLANs maximum peut-on théoriquement créer avec 802.1Q ?", "options": ["1024", "2048", "4096", "8192"], "answer": 2, "def": "Le champ VLAN ID de l'en-tête 802.1Q est codé sur 12 bits.", "why": ["1024 correspondrait à 10 bits (2^10), un octet de moins que la réalité.", "2048 correspondrait à 11 bits (2^11), toujours insuffisant par rapport aux 12 bits réels.", "Correct : 12 bits donnent 2^12 = 4096 VLAN IDs possibles (0 à 4095, avec quelques valeurs réservées).", "8192 correspondrait à 13 bits (2^13), plus que ce que permet le format 802.1Q."]}, {"q": "Quel est le protocole anti-bouclage de couche 2 sur les switches ?", "options": ["OSPF", "Spanning Tree Protocol (STP)", "BGP", "HSRP"], "answer": 1, "def": "STP (802.1D)* bloque dynamiquement certains liens redondants pour empêcher les boucles Ethernet infinies (tempête de broadcast).", "why": ["OSPF est un protocole de routage de couche 3 à état de lien, sans rapport avec les boucles de commutation.", "Correct : STP détecte la topologie et bloque les liens redondants pour éviter les boucles, tout en gardant une voie de secours.", "BGP est le protocole de routage inter-AS d'Internet, pas un protocole anti-boucle de couche 2.", "HSRP gère la redondance de passerelle de couche 3, ce n'est pas un protocole anti-boucle Ethernet."]}, {"q": "Quelle est l'adresse de broadcast de couche 2 (Ethernet) ?", "options": ["00:00:00:00:00:00", "255.255.255.255", "FF:FF:FF:FF:FF:FF", "ANY:ANY:ANY:ANY:ANY:ANY"], "answer": 2, "def": "L'adresse MAC de broadcast* est composée uniquement de bits à 1, ce qui la distingue des adresses unicast.", "why": ["00:00:00:00:00:00 est parfois une adresse nulle/invalide, pas l'adresse de broadcast.", "255.255.255.255 est le broadcast de couche 3 (IP), pas l'adresse MAC de couche 2.", "Correct : FF:FF:FF:FF:FF:FF (tous les bits à 1) est l'adresse MAC de diffusion générale reçue par toutes les cartes du segment.", "'ANY:ANY...' n'est pas un format d'adresse MAC valide, c'est un intrus fictif."]}, {"q": "Quel protocole de couche 2 est utilisé dans (quasiment) tous les réseaux locaux filaires ?", "options": ["Token Ring", "Ethernet", "FDDI", "ATM"], "answer": 1, "def": "Ethernet* a supplanté toutes les autres technologies de LAN filaire grâce à sa simplicité et son faible coût.", "why": ["Token Ring est une ancienne technologie IBM de LAN en anneau, quasiment abandonnée aujourd'hui.", "Correct : Ethernet (norme IEEE 802.3) est de très loin la technologie de couche 2 dominante dans les LAN modernes.", "FDDI utilisait la fibre optique en anneau, une technologie historique peu répandue désormais.", "ATM était surtout utilisé dans les réseaux opérateurs/WAN, pas comme standard des LAN d'entreprise."]}, {"q": "Qu'est-ce que le CSMA/CD ?", "options": ["Un protocole de chiffrement Ethernet", "Une méthode d'accès qui détecte les collisions sur le support partagé", "Un protocole de routage dynamique", "Un algorithme de compression de trames"], "answer": 1, "def": "CSMA/CD (Carrier Sense Multiple Access / Collision Detection)* : chaque carte écoute le support avant d'émettre, et détecte si une collision survient.", "why": ["CSMA/CD ne chiffre rien, c'est une méthode d'accès au média partagé, pas un mécanisme de sécurité.", "Correct : c'était la méthode historique de gestion de l'accès au câble Ethernet partagé (hubs), aujourd'hui obsolète avec le full-duplex sur switch.", "CSMA/CD n'est pas un protocole de routage, il concerne la couche 2 (accès au média), pas le choix du chemin réseau.", "Ce n'est pas non plus un algorithme de compression, mais une règle d'écoute avant émission et de détection de collision."]}, {"q": "Quel type d'adresse trouve-t-on à la couche 2 du modèle OSI ?", "options": ["Adresse IP", "Adresse MAC", "Adresse de port TCP", "FQDN"], "answer": 1, "def": "La couche 2 (liaison de données) encapsule les trames avec des adresses MAC* source et destination.", "why": ["L'adresse IP est une adresse de couche 3 (réseau), pas de couche 2.", "Correct : les trames de couche 2 utilisent les adresses MAC (physiques) pour identifier émetteur et destinataire sur le même segment.", "Les ports TCP/UDP sont des identifiants de couche 4 (transport), pas de couche 2.", "Le FQDN est un nom de domaine complet, résolu en IP par DNS ; il n'existe pas au niveau de la couche 2."]}, {"q": "Quelle commande Cisco configure un port de switch en mode trunk ou en mode access ?", "options": ["switchport mode trunk / switchport mode access", "interface vlan trunk", "ip nat inside/outside", "spanning-tree mode"], "answer": 0, "def": "La commande switchport mode* définit si un port transporte un seul VLAN (access) ou plusieurs (trunk).", "why": ["Correct : 'switchport mode trunk' active le mode trunk, 'switchport mode access' le mode access sur un port de switch Cisco.", "'interface vlan trunk' n'est pas une syntaxe Cisco valide pour ce réglage.", "'ip nat inside/outside' configure le NAT sur un routeur, sans rapport avec le mode d'un port switch.", "'spanning-tree mode' change l'algorithme STP utilisé (PVST, RSTP...), pas le mode access/trunk du port."]}, {"q": "Qu'est-ce que le Full-Duplex ?", "options": ["Un mode où l'on ne peut qu'émettre, jamais recevoir", "Un mode où l'émission et la réception sont simultanées, sans collision possible", "Un doublement de la vitesse du processeur", "Un type de câble blindé"], "answer": 1, "def": "En full-duplex*, chaque sens de communication a son propre canal, éliminant le besoin de CSMA/CD.", "why": ["Le Full-Duplex permet justement d'émettre ET de recevoir, ce n'est pas un mode à sens unique (ce serait plutôt du simplex).", "Correct : les liens Ethernet modernes sur switch fonctionnent en full-duplex, chaque sens ayant sa propre paire de fils, sans collision possible.", "Le Full-Duplex concerne la communication réseau, pas la fréquence ou la puissance du processeur.", "Ce n'est pas un type de câble mais un mode de fonctionnement de la liaison, qui peut s'appliquer sur cuivre comme sur fibre."]}, {"q": "Citez un protocole de routage.", "options": ["ARP", "RIP, OSPF, EIGRP ou BGP", "STP", "DHCP"], "answer": 1, "def": "Les protocoles de routage* calculent et échangent les meilleures routes entre réseaux (contrairement à une route statique fixe).", "why": ["ARP résout IP en MAC, ce n'est pas un protocole de routage mais de résolution d'adresse.", "Correct : RIP, OSPF, EIGRP (IGP internes) et BGP (EGP entre AS) sont des protocoles de routage dynamique reconnus.", "STP est un protocole anti-boucle de couche 2, sans lien avec le choix des routes IP.", "DHCP attribue des adresses IP aux hôtes, il ne calcule aucune route."]}, {"q": "Citez un protocole de routage à état de lien (link-state).", "options": ["RIP", "OSPF ou IS-IS", "BGP", "EIGRP (distance-vector avancé)"], "answer": 1, "def": "Un protocole link-state* fait connaître à chaque routeur la topologie complète du réseau, puis calcule le meilleur chemin (algorithme de Dijkstra).", "why": ["RIP est un protocole distance-vector simple (basé sur le nombre de sauts), pas un protocole à état de lien.", "Correct : OSPF (et IS-IS) construisent une carte complète de la topologie réseau avant de calculer les routes.", "BGP est un protocole de type path-vector utilisé entre systèmes autonomes, pas un protocole link-state interne.", "EIGRP est un protocole hybride/distance-vector avancé (Cisco), pas un protocole link-state à proprement parler."]}, {"q": "Quel protocole de routage est utilisé pour permettre le fonctionnement d'Internet entre opérateurs ?", "options": ["OSPF", "RIP", "BGP", "EIGRP"], "answer": 2, "def": "BGP (Border Gateway Protocol)* est le seul protocole EGP utilisé pour router entre les systèmes autonomes (AS) qui composent Internet.", "why": ["OSPF est un protocole interne (IGP) utilisé au sein d'un même réseau/AS, pas entre opérateurs différents.", "RIP est un vieux protocole IGP limité (15 sauts max), inutilisable à l'échelle d'Internet.", "Correct : BGP échange les routes entre des milliers d'AS et constitue le ciment routier d'Internet.", "EIGRP est un protocole propriétaire Cisco utilisé en interne, pas un protocole d'interconnexion entre opérateurs."]}, {"q": "On a accès à Internet mais le ping vers un serveur ne passe pas : quelle explication est la plus probable ?", "options": ["Le câble réseau est mal branché", "Un pare-feu bloque le protocole ICMP", "L'adresse MAC de la machine a changé", "Le disque dur du PC est plein"], "answer": 1, "def": "Beaucoup de pare-feux (et serveurs) bloquent volontairement l'ICMP* (utilisé par ping) par prudence, sans bloquer le reste du trafic (HTTP, DNS...).", "why": ["Si le câble était mal branché, on n'aurait aucun accès réseau du tout, pas seulement un ping qui échoue.", "Correct : de nombreux pare-feux filtrent l'ICMP par défaut alors que le trafic applicatif (HTTP/HTTPS) passe normalement, expliquant 'internet marche mais pas le ping'.", "Un changement d'adresse MAC locale n'empêcherait pas un ping isolé tout en laissant fonctionner le reste d'Internet.", "Un disque plein peut ralentir un PC mais n'a aucun rapport avec le blocage réseau du protocole ICMP."]}, {"q": "Quel champ de l'en-tête IP provoque l'auto-destruction (l'élimination) d'un paquet en boucle infinie ?", "options": ["Checksum", "TTL (Time To Live)", "Flags", "Protocol"], "answer": 1, "def": "Le TTL* est décrémenté à chaque routeur traversé ; il atteint 0 et le paquet est détruit s'il boucle indéfiniment (protection contre les boucles de routage).", "why": ["Le Checksum vérifie l'intégrité de l'en-tête, il ne limite pas la durée de vie du paquet.", "Correct : chaque routeur décrémente le TTL de 1 ; à 0, le paquet est jeté et un message ICMP 'Time Exceeded' peut être renvoyé (c'est le principe utilisé par traceroute).", "Les Flags gèrent la fragmentation IP, sans rapport avec la durée de vie du paquet.", "Le champ Protocol indique le protocole encapsulé (TCP=6, UDP=17...), pas une limite de durée de vie."]}, {"q": "Quel est le protocole le plus important de la couche réseau (couche 3) ?", "options": ["Ethernet", "IP", "TCP", "HTTP"], "answer": 1, "def": "IP (Internet Protocol)* adresse et achemine les paquets de bout en bout, c'est le socle de toute communication réseau moderne.", "why": ["Ethernet est un protocole de couche 2 (liaison), pas de couche 3.", "Correct : IP est LE protocole fondamental de la couche 3, permettant l'adressage et le routage de tous les paquets.", "TCP est un protocole de couche 4 (transport) qui s'appuie sur IP, il n'est pas lui-même un protocole de couche réseau.", "HTTP est un protocole applicatif de couche 7, bien au-dessus de la couche réseau."]}, {"q": "Combien de numéros de port existe-t-il en TCP (et UDP) ?", "options": ["1024", "32768", "65536", "1000000"], "answer": 2, "def": "Le champ port TCP/UDP est codé sur 16 bits.", "why": ["1024 correspondrait à 10 bits, une valeur bien inférieure aux 16 bits réels du champ port.", "32768 correspondrait à 15 bits (2^15), toujours un bit de moins que la réalité.", "Correct : 16 bits donnent 2^16 = 65536 ports possibles, numérotés de 0 à 65535.", "1 000 000 est une valeur arbitraire bien trop grande, aucun format binaire réseau ne correspond à ce nombre."]}, {"q": "Quelle est la taille d'une adresse IPv4, en octets ?", "options": ["2 octets", "4 octets", "6 octets", "16 octets"], "answer": 1, "def": "Une adresse IPv4* est composée de 4 nombres (octets) séparés par des points, ex: 192.168.1.1.", "why": ["2 octets ne suffiraient que pour 65536 adresses, bien trop peu pour IPv4.", "Correct : IPv4 utilise 32 bits = 4 octets (4 x 8 bits), d'où les 4 nombres décimaux séparés par des points.", "6 octets correspond à la taille d'une adresse MAC, pas d'une adresse IPv4.", "16 octets correspond à la taille d'une adresse IPv6, bien plus grande qu'IPv4."]}, {"q": "Quelle est la taille d'une adresse IPv6, en octets ?", "options": ["4 octets", "8 octets", "16 octets", "32 octets"], "answer": 2, "def": "IPv6* utilise 128 bits = 16 octets, écrits sous forme de 8 groupes hexadécimaux séparés par ':'.", "why": ["4 octets (32 bits) est la taille d'une adresse IPv4, pas IPv6.", "8 octets (64 bits) ne correspond qu'à la moitié d'une adresse IPv6 complète.", "Correct : 128 bits = 16 octets, offrant un espace d'adressage gigantesque comparé à IPv4.", "32 octets (256 bits) serait le double de la taille réelle d'une adresse IPv6."]}, {"q": "Quelle est la taille d'une adresse MAC, en octets ?", "options": ["4 octets", "6 octets", "8 octets", "12 octets"], "answer": 1, "def": "Une adresse MAC* fait 48 bits = 6 octets, généralement affichés en hexadécimal séparés par ':' ou '-'.", "why": ["4 octets (32 bits) correspond à la taille d'une adresse IPv4, pas d'une adresse MAC.", "Correct : 48 bits = 6 octets, dont les 3 premiers identifient le fabricant (OUI) et les 3 derniers l'interface.", "8 octets (64 bits) est supérieur à la taille réelle d'une adresse MAC.", "12 octets correspondrait à 96 bits, le double de la taille réelle d'une adresse MAC."]}, {"q": "Dans quelle unité s'exprime le débit du bus PCI Express ?", "options": ["En hertz (Hz)", "En gigabit par seconde (Gbit/s) par voie (lane)", "En volts (V)", "En octets par tour de disque"], "answer": 1, "def": "Le PCIe* fonctionne par voies (lanes) sérielles, chacune ayant un débit exprimé en Gbit/s (qui augmente à chaque génération : 1.0, 2.0, 3.0...).", "why": ["Le hertz mesure une fréquence, pas directement un débit de données transmises.", "Correct : chaque génération PCIe double environ le débit par lane, exprimé en Gbit/s (ex: PCIe 3.0 ≈ 8 Gbit/s par lane).", "Le volt est une unité électrique de tension, sans lien avec la mesure d'un débit de bus.", "Un disque SSD n'a pas de 'tour' (pas de plateau mécanique), cette unité ne s'applique pas non plus au PCIe."]}, {"q": "Combien de plateaux mécaniques contient un disque SSD ?", "options": ["1", "2", "4", "0 (aucun, ce sont des puces mémoire)"], "answer": 3, "def": "Un SSD* (Solid State Drive) stocke les données dans des puces mémoire flash, sans aucune pièce mécanique mobile.", "why": ["1 plateau serait la configuration minimale d'un disque dur mécanique (HDD), pas d'un SSD.", "2 plateaux existent sur certains HDD haute capacité, mais un SSD n'en a aucun.", "4 plateaux se trouvent sur des HDD très haute capacité, encore une fois sans rapport avec la technologie SSD.", "Correct : contrairement au disque dur mécanique (HDD), le SSD n'a ni plateau ni tête de lecture, uniquement des puces mémoire NAND."]}, {"q": "Quel niveau de RAID n'apporte AUCUNE sécurité (pas de redondance) ?", "options": ["RAID 0", "RAID 1", "RAID 5", "RAID 10"], "answer": 0, "def": "Le RAID 0* répartit les données sur plusieurs disques pour la performance (striping), sans aucune copie de sécurité : la perte d'un disque perd tout.", "why": ["Correct : RAID 0 fait uniquement du striping (répartition), sans parité ni miroir : c'est le RAID le plus rapide mais le moins sûr.", "RAID 1 duplique les données sur deux disques (miroir), offrant une vraie tolérance de panne.", "RAID 5 utilise une parité répartie qui permet de reconstruire les données en cas de panne d'un disque.", "RAID 10 combine miroir et striping, offrant à la fois performance et redondance."]}, {"q": "Quel niveau de RAID fonctionne en miroir (mirroring) ?", "options": ["RAID 0", "RAID 1", "RAID 5", "RAID 6"], "answer": 1, "def": "Le RAID 1* duplique intégralement les données sur deux disques : si l'un tombe en panne, l'autre contient une copie identique.", "why": ["RAID 0 fait du striping sans copie, l'inverse du principe de miroir.", "Correct : RAID 1 = mirroring, chaque disque est une copie exacte de l'autre.", "RAID 5 utilise la parité distribuée, pas une copie miroir intégrale.", "RAID 6 est une évolution du RAID 5 avec double parité, toujours pas un mécanisme de miroir."]}, {"q": "Comment s'appelle l'étape d'auto-diagnostic matériel au démarrage d'un PC ?", "options": ["Le BIOS", "Le POST (Power-On Self-Test)", "Le boot loader", "Le MBR"], "answer": 1, "def": "Le POST* vérifie que les composants essentiels (RAM, CPU, carte graphique...) fonctionnent avant de lancer le chargement de l'OS.", "why": ["Le BIOS/UEFI est le firmware qui exécute le POST, mais le nom de l'étape de diagnostic elle-même est le POST.", "Correct : POST = Power-On Self-Test, la phase de vérification matérielle initiée par le firmware au démarrage.", "Le boot loader (GRUB, bootmgr...) charge ensuite le système d'exploitation, après le POST.", "Le MBR contient la table de partitions et le code de démarrage, mais ce n'est pas l'étape de diagnostic elle-même."]}, {"q": "Qu'est-ce que le MBR (Master Boot Record) ?", "options": ["Le premier secteur du disque contenant la table de partitions et le code d'amorçage", "Le firmware qui remplace le BIOS", "Un protocole de démarrage réseau (PXE)", "La zone de swap de Linux"], "answer": 0, "def": "Le MBR* est situé sur le tout premier secteur (512 octets) du disque de démarrage.", "why": ["Correct : le MBR contient la table des partitions primaires et un petit programme d'amorçage qui lance le système.", "Le firmware qui remplace le BIOS est l'UEFI, une technologie distincte du MBR (qui a d'ailleurs son équivalent moderne : GPT).", "PXE est un protocole de démarrage réseau, sans rapport avec la structure du disque local.", "La swap est une zone de mémoire virtuelle sur disque sous Linux, complètement différente du MBR."]}, {"q": "Quel système de fichiers Windows n'intègre PAS de gestion des droits/permissions ?", "options": ["NTFS", "FAT32", "ReFS", "exFAT (partiellement)"], "answer": 1, "def": "FAT32* est un système de fichiers ancien, simple, sans ACL ni permissions NTFS.", "why": ["NTFS gère au contraire finement les permissions (ACL) sur fichiers et dossiers.", "Correct : FAT32 ne stocke aucune information de permission ou de propriétaire, contrairement à NTFS.", "ReFS (Resilient File System) est un système récent de Microsoft qui gère aussi les ACL, comme NTFS.", "exFAT est une évolution de FAT pensée pour les supports amovibles, avec un support des droits très limité mais ce n'est pas la réponse historiquement attendue ici (FAT32 est la référence classique sans droits)."]}, {"q": "Quelle technologie a remplacé l'IDE (PATA) pour les disques durs ?", "options": ["SCSI", "SATA", "USB", "Thunderbolt"], "answer": 1, "def": "SATA (Serial ATA)* a remplacé le bus parallèle IDE grâce à un câblage plus fin et des débits supérieurs.", "why": ["SCSI était une technologie surtout utilisée en environnement serveur/professionnel, pas le remplaçant grand public de l'IDE.", "Correct : SATA a progressivement remplacé l'IDE/PATA dans les PC à partir des années 2000, avec des câbles plus fins et de meilleures performances.", "USB sert à connecter des périphériques externes variés, ce n'est pas un bus de stockage interne remplaçant l'IDE.", "Thunderbolt est une interface externe haut débit récente, sans rapport avec le remplacement de l'IDE interne."]}, {"q": "Quel élément matériel gère traditionnellement la fréquence d'horloge et l'ordonnancement des échanges rapides (CPU, RAM, GPU) ?", "options": ["Le chipset Nord (Northbridge)", "Le chipset Sud (Southbridge)", "Le BIOS", "Le contrôleur USB"], "answer": 0, "def": "Le chipset Nord* (aujourd'hui souvent intégré au CPU) gère les composants rapides : CPU, RAM, bus graphique.", "why": ["Correct : historiquement, le chipset Nord gère les échanges à haute fréquence entre CPU, mémoire vive et carte graphique.", "Le chipset Sud gère les périphériques plus lents (USB, SATA, réseau...), pas la fréquence d'horloge des composants rapides.", "Le BIOS/UEFI est un firmware de démarrage, pas un composant gérant l'horloge des échanges internes.", "Le contrôleur USB gère uniquement les ports USB, une petite partie du rôle du chipset Sud."]}, {"q": "Quelle méthode de prise en main à distance est native à toutes les versions de Windows ?", "options": ["TeamViewer", "AnyDesk", "Bureau à distance (RDP)", "VNC"], "answer": 2, "def": "Le Bureau à distance* (RDP, port 3389) est intégré nativement à Windows depuis longtemps, sans installation tierce.", "why": ["TeamViewer est un logiciel tiers à installer, pas une fonctionnalité native de Windows.", "AnyDesk est également un outil tiers, non intégré au système d'exploitation.", "Correct : RDP (Remote Desktop Protocol) est natif à Windows et permet une prise en main graphique à distance sans rien installer de plus.", "VNC est un protocole tiers multiplateforme, qui nécessite l'installation d'un serveur/client, contrairement à RDP."]}, {"q": "Quelle commande Windows permet de modifier la base de registre (ajouter une valeur, une clé) ?", "options": ["msconfig", "regedit", "gpedit.msc", "services.msc"], "answer": 1, "def": "regedit* ouvre l'éditeur de base de registre, où sont stockés les paramètres système sous forme de clés/valeurs.", "why": ["msconfig configure le démarrage du système (services, boot), il ne modifie pas directement le registre.", "Correct : regedit permet de naviguer et modifier directement les clés et valeurs de la base de registre Windows.", "gpedit.msc gère les stratégies de groupe locales, qui peuvent influencer le registre indirectement mais ce n'est pas l'éditeur de registre lui-même.", "services.msc gère le démarrage/arrêt des services Windows, sans lien avec l'édition du registre."]}, {"q": "Citez une méthode (parmi d'autres) de prise en main à distance sur Windows.", "options": ["ipconfig", "VNC (ou TeamViewer, AnyDesk...)", "netstat", "chkdsk"], "answer": 1, "def": "Il existe plusieurs solutions de contrôle à distance* : natives (RDP) ou tierces (VNC, TeamViewer, AnyDesk...).", "why": ["ipconfig affiche la configuration réseau locale, ce n'est pas un outil de prise en main à distance.", "Correct : VNC (ou des solutions comme TeamViewer/AnyDesk) permettent de contrôler graphiquement un poste à distance.", "netstat liste les connexions réseau, il ne permet pas de prendre le contrôle d'un poste.", "chkdsk est un outil de vérification/réparation du disque, sans rapport avec l'accès distant."]}, {"q": "Qu'apporte NTFS par rapport à FAT32 ?", "options": ["Une taille de fichier limitée à 4 Go", "La gestion des permissions/ACL et une meilleure fiabilité", "Un formatage plus rapide", "La compatibilité universelle avec tous les OS"], "answer": 1, "def": "NTFS* introduit les listes de contrôle d'accès (ACL), la journalisation (fiabilité) et lève la limite de taille de fichier de FAT32.", "why": ["C'est justement FAT32 qui limite chaque fichier à 4 Go ; NTFS lève cette limitation.", "Correct : NTFS ajoute la gestion fine des droits (ACL), le chiffrement (EFS), la compression et un système de journalisation qui améliore la fiabilité.", "Le formatage n'est pas plus rapide sous NTFS ; sa richesse fonctionnelle est plutôt un peu plus lourde que FAT32.", "NTFS est au contraire moins universellement lisible que FAT32 sur certains systèmes/appareils tiers (consoles, certains OS)."]}, {"q": "Qu'est-ce que le protocole NTP ?", "options": ["Network Transfer Protocol, pour le transfert de fichiers", "Network Time Protocol, pour synchroniser l'heure entre machines", "New Technology Protocol, l'ancien nom de NTFS", "Network Topology Protocol, pour cartographier le réseau"], "answer": 1, "def": "NTP* synchronise l'horloge de tous les postes/serveurs sur une source de temps fiable, ce qui est crucial pour Kerberos (authentification AD).", "why": ["Le transfert de fichiers est assuré par FTP/SFTP, pas par NTP.", "Correct : NTP (Network Time Protocol) garde l'heure synchronisée entre les machines d'un domaine, à quelques millisecondes près.", "NTFS est un système de fichiers ; NTP n'a aucun lien historique avec ce nom, c'est une confusion à éviter.", "Aucun protocole standard ne s'appelle 'Network Topology Protocol' ; NTP concerne uniquement le temps."]}, {"q": "Quel type de support/licence faut-il pour qu'un poste soit client d'un domaine Active Directory ?", "options": ["N'importe quelle édition Windows, y compris Famille", "Une édition professionnelle (Pro, Entreprise...)", "Uniquement Windows Server", "Un abonnement Microsoft 365 obligatoire"], "answer": 1, "def": "Rejoindre un domaine AD* nécessite une édition Windows Pro/Entreprise/Education ; l'édition Famille (Home) ne le permet pas.", "why": ["Windows Famille (Home) ne propose justement pas l'option pour rejoindre un domaine, contrairement aux autres éditions.", "Correct : il faut une édition professionnelle du client (Pro, Entreprise, Education) pour pouvoir joindre un domaine Active Directory.", "Windows Server est le système du contrôleur de domaine lui-même, pas une exigence pour les postes clients.", "Un abonnement Microsoft 365 concerne les services cloud (Exchange Online, Teams...), il n'est pas requis pour joindre un AD on-premise."]}, {"q": "Quelle commande Windows permet de modifier le comportement de démarrage (boot) sous Windows 7 ?", "options": ["regedit", "msconfig", "gpedit.msc", "diskpart"], "answer": 1, "def": "msconfig* (Configuration système) permet notamment de choisir l'OS de démarrage, le mode sans échec, et les services au démarrage.", "why": ["regedit modifie directement le registre, un outil plus bas niveau et plus risqué que msconfig pour ce besoin.", "Correct : msconfig propose un onglet 'Démarrer' pour choisir les options de boot (mode sans échec, timeout, etc.).", "gpedit.msc gère les stratégies de groupe locales, un périmètre différent du comportement de démarrage matériel/logiciel bas niveau.", "diskpart gère les partitions de disque en ligne de commande, sans interface pour le comportement de démarrage du système."]}, {"q": "Quelle touche fallait-il presser au démarrage de Windows (avant Windows 8) pour accéder aux options de démarrage avancées ?", "options": ["F1", "F5", "F8", "Suppr"], "answer": 2, "def": "La touche F8* ouvrait le menu 'Options de démarrage avancées' (mode sans échec, etc.) sur les anciennes versions de Windows.", "why": ["F1 ouvre généralement l'aide d'une application, pas le menu de démarrage.", "F5 sert souvent à actualiser une page ou un dossier, sans lien avec le démarrage système.", "Correct : F8 martelée au démarrage donnait accès au mode sans échec et aux options avancées avant Windows 8/10 (remplacé depuis par le menu de récupération).", "Suppr (Delete) est généralement la touche d'accès au BIOS/UEFI, pas au menu de démarrage avancé de Windows."]}, {"q": "Où active-t-on la restauration système sous Windows ?", "options": ["Panneau de configuration > Programmes", "Propriétés du système > Protection du système", "Gestionnaire des tâches > Démarrage", "Panneau de configuration > Son"], "answer": 1, "def": "La Protection du système* gère la création des points de restauration qui permettent de revenir à un état antérieur du système.", "why": ["Programmes et fonctionnalités sert à désinstaller des logiciels, pas à gérer la restauration système.", "Correct : c'est dans Propriétés du système, onglet 'Protection du système', que l'on active/configure la restauration système.", "Le Gestionnaire des tâches gère les processus et programmes au démarrage, pas les points de restauration.", "Le panneau Son gère les périphériques audio, totalement hors sujet ici."]}, {"q": "Citez le nom d'une des ruches (hives) de la base de registre Windows.", "options": ["HKEY_CURRENT_USER", "HKEY_NETWORK", "HKEY_INTERNET", "HKEY_DRIVERS"], "answer": 0, "def": "Les ruches* sont les grandes branches racines du registre (HKLM, HKCU, HKCR, HKU, HKCC).", "why": ["Correct : HKEY_CURRENT_USER (HKCU) contient les paramètres propres à l'utilisateur actuellement connecté.", "'HKEY_NETWORK' n'est pas une ruche standard du registre Windows.", "'HKEY_INTERNET' n'existe pas non plus parmi les ruches officielles.", "'HKEY_DRIVERS' n'est pas un nom de ruche reconnu ; les pilotes sont référencés ailleurs, notamment sous HKLM\\SYSTEM."]}, {"q": "Sur quelle structure logique repose l'organisation d'un domaine Active Directory ?", "options": ["Le système de fichiers NTFS seul", "Une structure hiérarchique de type DNS/annuaire", "Une base de registre partagée", "Un simple fichier plat de comptes"], "answer": 1, "def": "AD* organise les objets (utilisateurs, ordinateurs, groupes) dans un annuaire hiérarchique, en s'appuyant fortement sur le DNS pour la localisation des services.", "why": ["NTFS gère les permissions sur fichiers, ce n'est pas la structure organisationnelle de l'annuaire AD lui-même.", "Correct : Active Directory est un annuaire hiérarchique (domaines, arbres, forêts, OU) qui dépend étroitement du DNS pour se repérer.", "La base de registre est locale à chaque machine, elle ne sert pas de structure centrale à l'annuaire AD.", "AD n'est pas un simple fichier plat : c'est une base de données répliquée et structurée hiérarchiquement."]}, {"q": "Quel est le numéro de port du protocole DNS ?", "options": ["21", "25", "53", "80"], "answer": 2, "def": "Le port 53* (TCP et UDP) est réservé au service DNS.", "why": ["Le port 21 est celui de FTP (contrôle), sans rapport avec le DNS.", "Le port 25 est celui de SMTP (envoi de mail), pas du DNS.", "Correct : DNS utilise le port 53, en UDP pour les requêtes courtes et en TCP pour les plus volumineuses ou les transferts de zone.", "Le port 80 est celui de HTTP, un protocole web sans lien direct avec la résolution de noms."]}, {"q": "Pourquoi le DNS peut-il fonctionner à la fois en UDP et en TCP (couche 4) ?", "options": ["Par erreur historique, cela n'a pas de justification technique", "UDP pour les requêtes classiques (<512 octets), TCP au-delà (transferts de zone, grosses réponses)", "TCP uniquement pour les résolutions IPv6", "UDP est utilisé uniquement pour les attaques DDoS"], "answer": 1, "def": "Le compromis vitesse/fiabilité* explique ce choix : UDP est rapide pour les petites requêtes, TCP prend le relais quand la réponse dépasse la limite historique de 512 octets.", "why": ["Il y a bien une justification technique précise, ce n'est pas un accident historique sans raison.", "Correct : la majorité des requêtes DNS tiennent en UDP (rapide, léger), mais les réponses volumineuses ou les transferts de zone (AXFR) basculent en TCP pour garantir la fiabilité.", "Le choix TCP/UDP ne dépend pas de la version d'IP interrogée (IPv4 ou IPv6), mais de la taille/fiabilité requise.", "UDP est le protocole légitime pour l'immense majorité des requêtes DNS normales, pas un vecteur d'attaque en soi (même si son détournement existe, ce n'est pas sa raison d'être)."]}, {"q": "Une fois le service DHCP configuré sur Windows Server, quelle action reste à faire pour qu'il distribue des IP ?", "options": ["Rien, il démarre automatiquement", "Autoriser (activer) le serveur DHCP dans la console de gestion", "Redémarrer tout le domaine", "Créer une nouvelle forêt AD"], "answer": 1, "def": "Sous Windows Server, un serveur DHCP doit être explicitement autorisé* (authorized) dans Active Directory avant de répondre aux requêtes des clients.", "why": ["Sans autorisation explicite dans AD, le service DHCP reste inactif malgré sa configuration, ce n'est donc pas automatique.", "Correct : il faut 'autoriser' le serveur DHCP via la console DHCP (clic droit > Autoriser) pour qu'il commence à distribuer des baux.", "Redémarrer tout le domaine est disproportionné et inutile pour ce simple réglage.", "Créer une nouvelle forêt AD n'a aucun rapport avec l'activation d'un service DHCP existant."]}, {"q": "Dans quel type de conteneur/outil met-on un composant logiciel enfichable (snap-in) sous Windows Server ?", "options": ["Une GPO", "Une MMC (Microsoft Management Console)", "Un service Windows", "Une unité d'organisation (OU)"], "answer": 1, "def": "Une MMC* est une console vide dans laquelle on ajoute des composants enfichables (snap-ins) comme 'Utilisateurs et ordinateurs Active Directory'.", "why": ["Une GPO (Group Policy Object) est un objet de stratégie de groupe, pas un conteneur de snap-ins.", "Correct : la MMC (mmc.exe) est le cadre générique dans lequel on ajoute des composants logiciels enfichables pour administrer différents services.", "Un service Windows est un processus en arrière-plan, sans lien avec la notion de snap-in.", "Une unité d'organisation (OU) est un conteneur d'objets AD (utilisateurs, groupes...), pas un outil d'administration en soi."]}, {"q": "Dans quel menu Windows Server trouve-t-on les MMC de gestion d'Active Directory ?", "options": ["Panneau de configuration", "Outils d'administration (Administrative Tools)", "Options d'ergonomie", "Windows Update"], "answer": 1, "def": "Les Outils d'administration* regroupent toutes les consoles de gestion des rôles serveur installés (AD, DNS, DHCP...).", "why": ["Le Panneau de configuration gère les paramètres généraux du système, pas spécifiquement les rôles serveur.", "Correct : le menu Outils d'administration centralise les consoles comme 'Utilisateurs et ordinateurs AD', 'DNS', 'DHCP'.", "'Options d'ergonomie' concerne l'accessibilité (contraste, loupe...), sans rapport avec l'administration AD.", "Windows Update gère les mises à jour du système, pas les outils de gestion d'Active Directory."]}, {"q": "Quelle est la différence entre une zone DNS secondaire et une zone stub ?", "options": ["Aucune différence, ce sont des synonymes", "La secondaire copie TOUTE la zone, la stub ne copie que les enregistrements NS essentiels", "La stub est plus complète que la secondaire", "La secondaire ne fonctionne qu'en IPv6"], "answer": 1, "def": "Ces deux types de zones sont en lecture seule et se synchronisent depuis une zone primaire, mais avec un niveau de détail différent.", "why": ["Elles diffèrent bien : la secondaire est une copie complète, la stub une copie minimale (juste les serveurs de noms).", "Correct : une zone secondaire réplique intégralement tous les enregistrements de la zone primaire, alors qu'une zone stub ne conserve que les enregistrements NS (et quelques A associés) pour rediriger les requêtes.", "C'est l'inverse : la zone secondaire est plus complète et plus lourde que la zone stub, qui est volontairement minimaliste.", "Ces deux types de zones fonctionnent indépendamment de la version d'IP utilisée, la distinction n'a rien à voir avec IPv4/IPv6."]}, {"q": "À quoi sert un enregistrement DNS de type AAAA ?", "options": ["Associer un nom à une adresse IPv4", "Associer un nom à une adresse IPv6", "Rediriger vers un alias", "Indiquer le serveur de messagerie"], "answer": 1, "def": "Le suffixe AAAA (quatre A) symbolise une adresse quatre fois plus longue* que l'enregistrement A classique (32 bits IPv4 → 128 bits IPv6).", "why": ["Associer un nom à une IPv4 correspond à l'enregistrement de type A, pas AAAA.", "Correct : AAAA (aussi appelé 'quad-A') associe un nom de domaine à une adresse IPv6.", "Rediriger vers un alias est le rôle de l'enregistrement CNAME, pas AAAA.", "Indiquer le serveur de messagerie est le rôle de l'enregistrement MX, sans rapport avec AAAA."]}, {"q": "Quel enregistrement DNS permet de créer un alias (un autre nom pointant vers un nom existant) ?", "options": ["A", "MX", "CNAME", "PTR"], "answer": 2, "def": "CNAME (Canonical Name)* fait pointer un nom vers un autre nom de domaine, plutôt que directement vers une IP.", "why": ["L'enregistrement A associe directement un nom à une adresse IPv4, sans notion d'alias vers un autre nom.", "MX indique le serveur de messagerie responsable d'un domaine, sans rapport avec la notion d'alias.", "Correct : CNAME crée un alias, par exemple 'www.site.com' pointant vers 'site.com'.", "PTR fait l'inverse d'un enregistrement A : il associe une IP à un nom (résolution inverse), pas un alias entre deux noms."]}, {"q": "Quel protocole applicatif est acheminé grâce aux enregistrements DNS de type MX ?", "options": ["HTTP", "FTP", "SMTP", "SSH"], "answer": 2, "def": "Les enregistrements MX (Mail eXchanger)* indiquent quel serveur de messagerie accepte le courrier pour un domaine donné, utilisé par le protocole SMTP.", "why": ["HTTP (le web) ne dépend pas des enregistrements MX, mais des enregistrements A/AAAA/CNAME classiques.", "FTP transfère des fichiers, sans lien avec le routage des emails géré par MX.", "Correct : les enregistrements MX orientent le trafic SMTP (envoi/réception d'emails) vers le bon serveur de messagerie.", "SSH sert à l'administration distante sécurisée, aucun rapport avec les enregistrements MX."]}, {"q": "Qu'est-ce qu'un GUID dans Active Directory ?", "options": ["Un mot de passe chiffré", "Un identifiant global unique attribué à chaque objet", "Le nom du groupe administrateur", "Un type de GPO"], "answer": 1, "def": "Le GUID (Globally Unique Identifier)* est attribué à la création d'un objet et ne change jamais, même si l'objet est renommé ou déplacé.", "why": ["Un GUID n'est pas un mot de passe, mais un simple identifiant technique, sans notion de secret.", "Correct : chaque objet AD (utilisateur, groupe, ordinateur...) reçoit un GUID unique au niveau mondial dès sa création.", "Le groupe administrateur s'appelle 'Admins du domaine' ou similaire, ce n'est pas ce que désigne un GUID.", "Une GPO est un objet de stratégie de groupe, une notion différente d'un identifiant d'objet."]}, {"q": "Quel est le nom de la MMC permettant de gérer les GPO (stratégies de groupe) ?", "options": ["Utilisateurs et ordinateurs Active Directory", "Gestion des stratégies de groupe (GPMC)", "DNS Manager", "Gestionnaire de serveur"], "answer": 1, "def": "La GPMC (Group Policy Management Console)* centralise la création, modification et liaison des GPO aux OU, domaines ou sites.", "why": ["Cette console gère les comptes utilisateurs/ordinateurs/groupes, pas directement les GPO.", "Correct : la GPMC est l'outil dédié à la gestion des stratégies de groupe dans un environnement Active Directory.", "DNS Manager administre les zones et enregistrements DNS, sans lien avec les GPO.", "Le Gestionnaire de serveur permet d'ajouter des rôles/fonctionnalités, mais n'est pas l'outil spécifique de gestion des GPO."]}, {"q": "Depuis quelle version de Windows Server, Active Directory est-il intégré ?", "options": ["Windows NT 4.0", "Windows Server 2000", "Windows Server 2003", "Windows Server 2008"], "answer": 1, "def": "Active Directory* a été introduit par Microsoft avec Windows 2000 Server, remplaçant le modèle de domaines NT4.", "why": ["Windows NT 4.0 utilisait un modèle de domaine antérieur (SAM), sans Active Directory.", "Correct : Active Directory fait officiellement son apparition avec Windows Server 2000.", "Windows Server 2003 a amélioré AD (réplication, forêts...), mais ce n'est pas sa version d'introduction.", "Windows Server 2008 a introduit RODC et d'autres nouveautés, bien après l'apparition initiale d'AD."]}, {"q": "Quelle commande permet d'installer/promouvoir un serveur en contrôleur de domaine sous Windows Server 2008 ?", "options": ["dcpromo", "netdom", "adprep", "ntdsutil"], "answer": 0, "def": "dcpromo* (Domain Controller Promotion) lance l'assistant de promotion en contrôleur de domaine sur les anciennes versions de Windows Server.", "why": ["Correct : dcpromo était la commande historique (jusqu'à Windows Server 2008 R2) pour promouvoir un serveur en DC.", "netdom sert à joindre un ordinateur à un domaine ou gérer des relations d'approbation, pas à promouvoir un DC.", "adprep prépare le schéma et le domaine avant une mise à niveau majeure d'AD, ce n'est pas l'outil de promotion lui-même.", "ntdsutil est un outil de maintenance avancée de la base AD (nettoyage de métadonnées...), pas l'outil de promotion initiale."]}, {"q": "Quel est le nom du service Active Directory sous Windows Server ?", "options": ["ADFS", "AD DS (Active Directory Domain Services)", "AD CS", "AD LDS"], "answer": 1, "def": "AD DS* est le rôle serveur qui fournit l'annuaire central des utilisateurs, ordinateurs et groupes du domaine.", "why": ["ADFS (Federation Services) gère l'authentification fédérée entre organisations/SSO, un rôle complémentaire mais différent.", "Correct : AD DS (Domain Services) est le cœur d'Active Directory, le rôle qui fournit l'annuaire et l'authentification du domaine.", "AD CS (Certificate Services) gère une infrastructure à clés publiques (PKI), un rôle distinct d'AD DS.", "AD LDS (Lightweight Directory Services) est un annuaire autonome allégé, sans notion de domaine complet."]}, {"q": "Quel est le nom du service de déploiement d'images système sous Windows Server ?", "options": ["WSUS", "WDS (Windows Deployment Services)", "IIS", "DFS"], "answer": 1, "def": "WDS* permet de déployer des images Windows via le réseau (PXE boot), utile pour installer de nombreux postes rapidement.", "why": ["WSUS gère la distribution centralisée des mises à jour Windows, pas le déploiement d'images système.", "Correct : WDS (Windows Deployment Services) diffuse des images d'installation par le réseau grâce au PXE.", "IIS (Internet Information Services) est le serveur web de Microsoft, sans rapport avec le déploiement d'OS.", "DFS (Distributed File System) gère des partages de fichiers répliqués/distribués, pas le déploiement d'images système."]}, {"q": "Quel est le nom du service web sous Windows Server ?", "options": ["Apache", "IIS (Internet Information Services)", "Nginx", "Tomcat"], "answer": 1, "def": "IIS* est le serveur web natif de Microsoft, intégré comme rôle de Windows Server.", "why": ["Apache est un serveur web open source multiplateforme, pas le service natif de Windows Server.", "Correct : IIS est LE service web fourni nativement par Microsoft sur Windows Server.", "Nginx est également un serveur web tiers open source, non natif à Windows Server.", "Tomcat est un conteneur d'applications Java (Servlet/JSP), pas le serveur web natif de Windows."]}, {"q": "Quel est le nom du service de virtualisation d'hôtes (hyperviseur) natif sous Windows Server ?", "options": ["VMware ESXi", "Hyper-V", "VirtualBox", "Docker"], "answer": 1, "def": "Hyper-V* est l'hyperviseur de type 1 (bare-metal) intégré nativement à Windows Server.", "why": ["VMware ESXi est un hyperviseur concurrent, développé par VMware et non par Microsoft.", "Correct : Hyper-V est le rôle d'hyperviseur natif de Windows Server, permettant de créer et gérer des machines virtuelles.", "VirtualBox est un hyperviseur de type 2 (hosted) d'Oracle, à installer séparément, pas natif à Windows Server.", "Docker est un moteur de conteneurisation, une technologie différente de la virtualisation matérielle complète d'Hyper-V."]}, {"q": "Dans quel onglet des propriétés d'un fichier/dossier gère-t-on les droits NTFS ?", "options": ["Onglet Général", "Onglet Sécurité", "Onglet Partage", "Onglet Personnalisation"], "answer": 1, "def": "L'onglet Sécurité* affiche la liste de contrôle d'accès (ACL) NTFS : quels utilisateurs/groupes ont quels droits.", "why": ["L'onglet Général affiche des informations basiques (taille, date, attributs), pas les permissions.", "Correct : c'est dans l'onglet Sécurité que l'on ajoute/modifie les permissions NTFS pour les utilisateurs et groupes.", "L'onglet Partage gère les droits d'accès réseau (partage SMB), un niveau de permission distinct et complémentaire des droits NTFS.", "L'onglet Personnalisation concerne l'apparence du dossier (icône, couleur), sans rapport avec la sécurité."]}, {"q": "Entre une GPO liée au domaine et une GPO liée à une Unité d'Organisation (OU), laquelle est prioritaire pour un objet placé dans l'OU ?", "options": ["Toujours celle du domaine", "Toujours celle du site", "Celle de l'OU (la plus proche de l'objet dans la hiérarchie)", "Elles s'appliquent à parts égales, aucune priorité"], "answer": 2, "def": "L'ordre d'application des GPO est LSDOU (Local, Site, Domaine, OU) : la dernière appliquée, celle de l'OU, l'emporte en cas de conflit.", "why": ["La GPO du domaine s'applique avant celle de l'OU, elle n'est donc pas la plus prioritaire en cas de conflit.", "La GPO de site est appliquée encore plus tôt que celle du domaine, donc encore moins prioritaire que celle de l'OU.", "Correct : selon l'ordre LSDOU, la GPO liée à l'OU la plus proche de l'objet est appliquée en dernier et l'emporte en cas de paramètre contradictoire.", "Il existe bien une hiérarchie de priorité définie (LSDOU), les GPO ne s'appliquent pas de façon strictement égalitaire."]}, {"q": "Quels sont les trois rôles principaux d'un serveur Exchange (versions classiques) ?", "options": ["Web, Base de données, Impression", "CAS (Client Access), Transport Hub, Mailbox", "DNS, DHCP, WINS", "Firewall, Proxy, VPN"], "answer": 1, "def": "Exchange sépare historiquement les fonctions client (CAS), acheminement du courrier (Hub Transport) et stockage des boîtes (Mailbox).", "why": ["Ces rôles ne correspondent à aucune fonction Exchange standard.", "Correct : CAS gère les connexions client (OWA, Outlook), Transport Hub route les messages, et Mailbox héberge les boîtes aux lettres.", "DNS/DHCP/WINS sont des services d'infrastructure réseau générale, pas des rôles Exchange.", "Firewall/Proxy/VPN sont des fonctions de sécurité réseau, sans rapport avec l'architecture de rôles Exchange."]}, {"q": "Qu'est-ce que l'OWA sous Exchange ?", "options": ["Un protocole de chiffrement", "Outlook Web App, l'accès à la messagerie via navigateur", "Un composant Active Directory", "Un outil de sauvegarde"], "answer": 1, "def": "OWA* permet de consulter ses emails depuis n'importe quel navigateur, sans installer Outlook.", "why": ["OWA n'est pas un protocole de chiffrement, c'est une interface web d'accès au courrier.", "Correct : OWA (Outlook Web App) donne accès à la messagerie Exchange directement depuis un navigateur web.", "OWA est un service Exchange, il ne fait pas partie des composants d'Active Directory.", "OWA sert à consulter le courrier, ce n'est pas un outil de sauvegarde de données."]}, {"q": "À quoi sert le service Autodiscover sous Exchange ?", "options": ["Découvrir automatiquement les imprimantes réseau", "Configurer automatiquement le client Outlook (serveur, paramètres) via HTTPS", "Détecter les intrusions réseau", "Scanner les vulnérabilités du serveur mail"], "answer": 1, "def": "Autodiscover* permet à Outlook de se configurer tout seul (juste avec l'adresse email et le mot de passe), en récupérant les bons paramètres serveur automatiquement.", "why": ["Autodiscover concerne la configuration de la messagerie, pas la détection d'imprimantes réseau.", "Correct : à partir de l'adresse email, Autodiscover interroge un enregistrement DNS/HTTPS spécifique pour renvoyer à Outlook toute sa configuration serveur.", "Ce n'est pas un outil de détection d'intrusion (IDS), mais un service de configuration automatique du client mail.", "Autodiscover ne scanne pas de vulnérabilités, il ne fait qu'automatiser la configuration client."]}, {"q": "Qu'est-ce qu'Outlook Anywhere et comment fonctionne-t-il ?", "options": ["Un accès à la boîte mail via un navigateur, sur le port 443", "Un accès à la boîte mail avec le client Outlook, en encapsulant MAPI dans HTTPS (port 443)", "Une messagerie sans authentification", "Un protocole de chiffrement de disque"], "answer": 1, "def": "Outlook Anywhere (RPC over HTTP/HTTPS)* permet au client Outlook lourd de se connecter au serveur Exchange même à travers un pare-feu restrictif, en habillant le trafic MAPI en HTTPS.", "why": ["L'accès via navigateur correspond plutôt à OWA, pas à Outlook Anywhere qui utilise le client Outlook lui-même.", "Correct : Outlook Anywhere encapsule le trafic MAPI (protocole natif d'Outlook) dans des requêtes HTTPS classiques sur le port 443, facilitant le passage à travers les pare-feux.", "L'authentification reste bien nécessaire ; ce n'est pas un accès anonyme à la messagerie.", "Ce n'est pas un mécanisme de chiffrement de disque, mais un mode de connexion réseau du client de messagerie."]}, {"q": "Quel protocole est utilisé pour l'ENVOI de messagerie électronique ?", "options": ["POP3", "IMAP", "SMTP", "LDAP"], "answer": 2, "def": "SMTP (Simple Mail Transfer Protocol)* est le protocole standard pour envoyer/acheminer les emails entre serveurs.", "why": ["POP3 sert à RÉCUPÉRER le courrier (en le téléchargeant), pas à l'envoyer.", "IMAP sert aussi à consulter/synchroniser le courrier sur le serveur, pas à l'envoyer.", "Correct : SMTP est utilisé aussi bien par le client pour envoyer un email que par les serveurs pour se le transmettre entre eux.", "LDAP est un protocole d'annuaire (utilisé notamment par Active Directory), sans rapport avec l'envoi de courrier."]}, {"q": "Quelle est la différence entre POP3 et IMAP ?", "options": ["Aucune, ce sont des synonymes", "POP3 télécharge et retire souvent les messages du serveur, IMAP les synchronise en conservant l'organisation côté serveur", "IMAP est plus ancien que POP3", "POP3 fonctionne uniquement en HTTPS"], "answer": 1, "def": "POP3* rapatrie les messages localement (souvent en les supprimant du serveur), tandis qu'IMAP* garde tout synchronisé sur le serveur (utile sur plusieurs appareils).", "why": ["Ces deux protocoles sont bien différents dans leur fonctionnement et leurs usages, ce ne sont pas des synonymes.", "Correct : POP3 est adapté à un seul appareil qui rapatrie son courrier, IMAP est adapté à plusieurs appareils qui doivent voir le même état de la boîte mail.", "C'est l'inverse : POP3 (1984) est plus ancien qu'IMAP (1986), même si les deux protocoles ont beaucoup évolué depuis.", "POP3 fonctionne nativement sur son propre port (110, ou 995 en SSL/TLS), pas nécessairement en HTTPS."]}, {"q": "Quel est le numéro de port du protocole SMTP ?", "options": ["21", "23", "25", "110"], "answer": 2, "def": "Le port 25* est le port historique de SMTP, utilisé pour la transmission de courrier entre serveurs.", "why": ["Le port 21 est celui de FTP, sans rapport avec SMTP.", "Le port 23 est celui de Telnet, un protocole d'administration à distance non sécurisé.", "Correct : SMTP utilise le port 25 (souvent complété par le 587 pour la soumission authentifiée côté client).", "Le port 110 est celui de POP3, un protocole de réception et non d'envoi de courrier."]}, {"q": "Quel est le nom d'un serveur de messagerie concurrent d'Exchange, historiquement développé par Lotus/IBM ?", "options": ["Zimbra", "Domino (Lotus Notes)", "Postfix", "Sendmail"], "answer": 1, "def": "Lotus Domino* (aujourd'hui HCL Domino) est une plateforme collaborative et de messagerie historique, concurrente d'Exchange en entreprise.", "why": ["Zimbra est une suite collaborative open source, mais pas celle historiquement développée par Lotus/IBM.", "Correct : Domino (Lotus Notes) est le serveur de messagerie/collaboration historiquement associé à IBM/Lotus.", "Postfix est un agent de transfert de courrier (MTA) open source sous Linux, sans rapport avec Lotus.", "Sendmail est un autre MTA historique sous Unix, également sans lien avec Lotus/IBM."]}, {"q": "Quel est le protocole de messagerie propriétaire utilisé par le client Outlook avec Exchange ?", "options": ["IMAP", "POP3", "MAPI", "SIP"], "answer": 2, "def": "MAPI (Messaging API)* est le protocole propriétaire Microsoft utilisé en profondeur par Outlook pour dialoguer avec Exchange (calendrier, contacts, mails...).", "why": ["IMAP est un protocole ouvert et standard, utilisable par de nombreux clients différents, pas propriétaire à Microsoft.", "POP3 est également un protocole standard ouvert, sans lien avec l'écosystème propriétaire Outlook/Exchange.", "Correct : MAPI est le protocole natif et propriétaire qu'Outlook utilise pour exploiter toutes les fonctionnalités riches d'Exchange (pas seulement le mail, mais aussi calendrier et contacts).", "SIP est un protocole de signalisation VoIP, totalement hors du contexte de la messagerie Exchange/Outlook."]}, {"q": "Quel est le nom du client/service de messagerie de Microsoft utilisé pour lire ses emails ?", "options": ["Thunderbird", "Outlook", "Evolution", "Apple Mail"], "answer": 1, "def": "Outlook* est le client de messagerie phare de Microsoft, étroitement intégré à Exchange (via MAPI) et Microsoft 365.", "why": ["Thunderbird est un client de messagerie open source de Mozilla, pas un produit Microsoft.", "Correct : Outlook est LE client de messagerie développé par Microsoft, disponible en version bureau et web (OWA).", "Evolution est le client de messagerie historique de l'environnement GNOME sous Linux, pas un produit Microsoft.", "Apple Mail est le client de messagerie natif de macOS/iOS, développé par Apple et non par Microsoft."]}, {"q": "Qu'est-ce que le Load Balancing ?", "options": ["Le chiffrement des sauvegardes", "La répartition de charge entre plusieurs serveurs", "La détection d'intrusion", "Le blocage des ports inutiles"], "answer": 1, "def": "Le Load Balancing* distribue les requêtes entrantes sur plusieurs serveurs pour améliorer performance et disponibilité.", "why": ["Le chiffrement des sauvegardes concerne la protection des données stockées, sans rapport avec la répartition de charge.", "Correct : un répartiteur de charge (load balancer) distribue le trafic entre plusieurs serveurs backend équivalents.", "La détection d'intrusion est le rôle d'un IDS, une fonction de sécurité différente du load balancing.", "Le blocage de ports est une fonction de pare-feu (filtrage), pas de répartition de charge."]}, {"q": "Qu'est-ce qu'un IDS ?", "options": ["Un système de détection d'intrusion", "Un répartiteur de charge", "Un serveur DNS interne", "Un protocole de chiffrement"], "answer": 0, "def": "Un IDS (Intrusion Detection System)* surveille le trafic ou les journaux pour repérer des comportements suspects, sans forcément bloquer (contrairement à un IPS).", "why": ["Correct : l'IDS analyse en continu le trafic/les logs pour détecter des signatures ou comportements d'attaque, et alerter l'administrateur.", "Un répartiteur de charge distribue le trafic entre serveurs, une fonction de performance et non de sécurité.", "Un serveur DNS interne résout des noms en IP, sans lien avec la détection d'intrusion.", "Un protocole de chiffrement protège la confidentialité des données, ce n'est pas un outil de détection d'attaque."]}, {"q": "Qu'est-ce qu'un proxy transparent ?", "options": ["Un proxy configuré manuellement par chaque utilisateur", "Un proxy imposé par le réseau/FAI sans configuration côté client", "Un proxy qui chiffre systématiquement le trafic", "Un proxy réservé aux connexions VPN"], "answer": 1, "def": "Un proxy transparent* intercepte le trafic au niveau du réseau (routeur/pare-feu) sans que l'utilisateur n'ait rien à configurer sur son poste.", "why": ["C'est l'inverse d'un proxy transparent : celui-ci ne nécessite aucune configuration manuelle côté client.", "Correct : le proxy transparent redirige automatiquement le trafic (souvent HTTP) sans configuration explicite sur le poste utilisateur, l'utilisateur ignore parfois même qu'il passe par un proxy.", "Le proxy transparent n'ajoute pas nécessairement de chiffrement, sa particularité est d'être invisible pour l'utilisateur, pas de sécuriser le trafic.", "Il n'est pas réservé aux connexions VPN ; il s'agit d'une technique d'interception de trafic générale, indépendante du VPN."]}, {"q": "Qu'est-ce que l'ingénierie sociale (Social Engineering) ?", "options": ["Une technique de chiffrement avancée", "L'exploitation de failles humaines (manipulation) pour obtenir des informations ou un accès", "Un protocole de routage social", "Une méthode de sauvegarde collaborative"], "answer": 1, "def": "L'ingénierie sociale* manipule la psychologie humaine (confiance, urgence, autorité) plutôt que d'exploiter une faille technique.", "why": ["L'ingénierie sociale ne relève pas de la cryptographie, mais de la manipulation psychologique.", "Correct : elle consiste à tromper une personne (phishing, prétexting, appel téléphonique frauduleux...) pour obtenir un accès ou une information sensible.", "Il n'existe pas de 'protocole de routage social', cette réponse est fictive et sans rapport avec le sujet.", "Il ne s'agit pas d'une méthode de sauvegarde de données, mais d'une technique d'attaque ciblant l'humain."]}, {"q": "Qu'est-ce qu'une attaque SYN Flood ?", "options": ["Une attaque qui inonde une victime de mails", "Une attaque par déni de service exploitant l'établissement de connexion TCP (SYN, SYN-ACK, ACK)", "Une attaque de force brute sur un mot de passe", "Une attaque qui modifie les tables de routage"], "answer": 1, "def": "Le SYN Flood* envoie une multitude de paquets SYN* sans jamais terminer la poignée de main TCP (three-way handshake* : SYN → SYN-ACK → ACK), saturant les ressources du serveur qui attend chaque ACK final.", "why": ["Le bombardement de mails est plutôt du spam ou du mail-bombing, pas un SYN Flood qui cible la couche transport TCP.", "Correct : l'attaquant envoie de nombreux paquets SYN (demande de connexion) sans jamais répondre au SYN-ACK du serveur avec l'ACK final, laissant des connexions à moitié ouvertes qui épuisent les ressources serveur : c'est un déni de service (DoS).", "La force brute teste des mots de passe successifs, un principe différent d'une saturation de connexions réseau.", "Modifier des tables de routage relèverait plutôt d'une attaque de type usurpation de routage (BGP hijacking), pas d'un SYN Flood."]}, {"q": "Citez un protocole de couche 2 utilisable pour un VPN.", "options": ["IPSec (couche 3)", "L2TP ou PPTP", "BGP", "OSPF"], "answer": 1, "def": "Les VPN de couche 2* transportent des trames entières (et non juste des paquets IP), contrairement à IPSec qui opère en couche 3.", "why": ["IPSec fonctionne en couche 3 (il chiffre/encapsule les paquets IP), ce n'est donc pas un protocole de couche 2.", "Correct : L2TP (Layer 2 Tunneling Protocol) et PPTP créent des tunnels qui encapsulent des trames de couche 2.", "BGP est un protocole de routage entre systèmes autonomes, sans rapport avec les tunnels VPN de couche 2.", "OSPF est un protocole de routage interne à état de lien, également sans lien avec les VPN de couche 2."]}, {"q": "À quoi sert une DMZ (zone démilitarisée) ?", "options": ["À accélérer le trafic Internet", "À isoler des serveurs exposés du reste du réseau interne, pour limiter les dégâts en cas de compromission", "À chiffrer systématiquement les communications", "À remplacer le pare-feu"], "answer": 1, "def": "La DMZ* est une zone tampon entre Internet et le LAN, où l'on place les services exposés (web, mail) pour ne pas exposer directement le réseau interne.", "why": ["La DMZ n'a aucun effet sur la vitesse du trafic Internet, son rôle est purement sécuritaire.", "Correct : en isolant les serveurs exposés dans une zone séparée (comme un VLAN dédié), un serveur DMZ compromis ne peut pas directement atteindre le réseau interne sensible.", "La DMZ elle-même ne chiffre rien, elle segmente le réseau ; le chiffrement est une fonction séparée (TLS, IPSec...).", "La DMZ complète le pare-feu (qui la délimite et filtre les flux vers/depuis elle), elle ne le remplace pas."]}, {"q": "Citez un exemple de pare-feu (firewall).", "options": ["Wireshark", "pfSense (ou le pare-feu Windows)", "Nslookup", "Netstat"], "answer": 1, "def": "Un pare-feu* filtre le trafic réseau entrant/sortant selon des règles, contrairement à un simple outil d'analyse.", "why": ["Wireshark est un analyseur de paquets (sniffer), un outil de diagnostic, pas un pare-feu.", "Correct : pfSense (distribution dédiée) ou le pare-feu intégré à Windows sont des exemples concrets de pare-feux filtrant le trafic.", "Nslookup interroge le DNS, ce n'est pas un outil de filtrage réseau.", "Netstat liste les connexions actives d'une machine, il n'a pas de fonction de filtrage/blocage."]}, {"q": "Citez une méthode de filtrage réseau (pare-feu) sous Linux.", "options": ["Regedit", "iptables (ou nftables)", "MMC", "GPO"], "answer": 1, "def": "iptables* (et son successeur nftables) est l'outil natif de filtrage de paquets du noyau Linux (Netfilter).", "why": ["Regedit édite le registre Windows, un outil totalement propre à Windows, sans équivalent en filtrage Linux.", "Correct : iptables (ou nftables aujourd'hui) permet de définir des règles de filtrage/NAT au niveau du noyau Linux.", "MMC est une console d'administration Windows, sans équivalent direct comme outil de filtrage sous Linux.", "Les GPO sont des stratégies de groupe Windows/Active Directory, sans rapport avec le filtrage réseau Linux."]}, {"q": "Citez une méthode de filtrage sous un équipement Cisco.", "options": ["iptables", "Les ACL (Access Control Lists)", "GPO", "Regedit"], "answer": 1, "def": "Les ACL Cisco* filtrent le trafic selon des critères (IP source/destination, port...) appliqués sur une interface.", "why": ["iptables est l'équivalent Linux, pas la solution native de filtrage sur un équipement Cisco.", "Correct : les listes de contrôle d'accès (ACL) standard ou étendues permettent de filtrer le trafic sur les routeurs/switches Cisco.", "Les GPO sont propres à l'environnement Windows/Active Directory, sans équivalent direct sur Cisco.", "Regedit est un outil Windows de modification du registre, sans rapport avec le filtrage réseau Cisco."]}, {"q": "Quel est le successeur du chargeur de démarrage LILO sous Linux ?", "options": ["SYSV", "GRUB", "systemd", "Cron"], "answer": 1, "def": "GRUB (GRand Unified Bootloader)* a remplacé LILO en offrant plus de flexibilité (menu interactif, support de multiples OS/noyaux).", "why": ["SYSV désigne un système d'initialisation historique (SysV init), pas un chargeur de démarrage (bootloader).", "Correct : GRUB a progressivement remplacé LILO comme bootloader standard sur la plupart des distributions Linux.", "systemd est le système d'initialisation moderne des services, un rôle différent d'un chargeur de démarrage bas niveau.", "Cron est le planificateur de tâches périodiques sous Linux, sans rapport avec le démarrage du système."]}, {"q": "Quel symbole de redirection Linux permet d'AJOUTER du contenu à un fichier sans l'écraser ?", "options": [">", "<", ">>", "|"], "answer": 2, "def": "L'opérateur >>* ajoute (append) le résultat à la fin du fichier, contrairement à > qui écrase tout le contenu existant.", "why": ["Le simple '>' écrase entièrement le fichier de destination avant d'y écrire, l'inverse du besoin exprimé.", "'<' redirige une entrée depuis un fichier vers une commande, ce n'est pas une redirection de sortie.", "Correct : '>>' ajoute la sortie à la fin du fichier existant, en conservant son contenu précédent.", "Le pipe '|' envoie la sortie d'une commande vers l'entrée d'une autre commande, ce n'est pas une redirection vers un fichier."]}, {"q": "Quel est le runlevel typique d'un Ubuntu Server au démarrage (multi-utilisateur, réseau, sans interface graphique) ?", "options": ["Niveau 1", "Niveau 3", "Niveau 5", "Niveau 6"], "answer": 1, "def": "Le runlevel 3* correspond au mode multi-utilisateur avec réseau, mais sans interface graphique, typique d'un serveur.", "why": ["Le niveau 1 est le mode mono-utilisateur (maintenance), pas le mode normal de démarrage d'un serveur.", "Correct : le niveau 3 démarre le réseau et les services en mode texte, sans lancer d'environnement graphique — l'idéal pour un serveur.", "Le niveau 5 correspond au mode multi-utilisateur AVEC interface graphique, typique d'un poste de bureau, pas d'un serveur.", "Le niveau 6 correspond au redémarrage (reboot) du système, ce n'est pas un état de fonctionnement normal."]}, {"q": "Quelle commande Linux affiche le nombre d'octets, de mots et de lignes d'un fichier ?", "options": ["find", "pwd", "wc", "bind"], "answer": 2, "def": "wc (word count)* donne par défaut trois chiffres : lignes, mots, octets d'un fichier.", "why": ["find recherche des fichiers selon des critères, il ne compte pas les octets/mots/lignes d'un fichier.", "pwd affiche le répertoire de travail courant, sans lien avec le comptage de contenu.", "Correct : 'wc fichier.txt' affiche lignes, mots et octets, dans cet ordre par défaut.", "bind est une commande liée à la gestion du shell (raccourcis clavier), sans rapport avec le comptage d'un fichier."]}, {"q": "Quelle commande Linux affiche le chemin du répertoire courant (où l'on se situe dans l'arborescence) ?", "options": ["cd", "ls", "pwd", "cat"], "answer": 2, "def": "pwd (Print Working Directory)* renvoie le chemin absolu du dossier dans lequel on se trouve actuellement.", "why": ["cd sert à SE DÉPLACER dans l'arborescence, pas à afficher où l'on se trouve.", "ls liste le contenu du répertoire courant, sans afficher son chemin complet.", "Correct : pwd affiche précisément le chemin absolu du répertoire de travail actuel.", "cat affiche le contenu d'un fichier, sans rapport avec la localisation dans l'arborescence."]}, {"q": "Quel est le chemin d'accès typique au dossier perso
