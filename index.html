<style>
  :root {
    --bg: #FDF6F0; --bg-card: #FFFFFF; --bg-card-alt: #F0E6DA;
    --accent: #8B6F47; --accent-light: #C4A882; --accent-dark: #5C4A31;
    --text: #3D2E1F; --text-light: #8B7B6B; --text-lighter: #B5A898;
    --success: #6B8E5A; --error: #C4534A; --warning: #D4A03C;
    --shadow: 0 2px 16px rgba(93,74,49,0.08); --shadow-lg: 0 8px 32px rgba(93,74,49,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; }
  .screen { display: none; padding: 0 20px 60px; }
  .screen.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0;} 50%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
  @keyframes shakeX { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @keyframes slideDown { from{transform:translateY(-20px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .btn { border: none; cursor: pointer; font-family: inherit; transition: all 0.2s ease; }
  .btn:active { transform: scale(0.96); }
  .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .option-btn {
    width: 100%; text-align: left; padding: 16px 20px; border-radius: 14px;
    background: var(--bg-card); border: 2px solid var(--bg-card-alt);
    font-size: 15px; color: var(--text); font-family: inherit;
    cursor: pointer; transition: all 0.25s ease; line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent-light); background: #FAF4ED; }
  .option-btn.correct { border-color: var(--success); background: #EFF5EC; color: var(--success); }
  .option-btn.wrong { border-color: var(--error); background: #FAEFEE; color: var(--error); animation: shakeX 0.4s ease; }
  .option-btn:disabled { cursor: default; }
  .progress-bar { width:100%; height:8px; border-radius:8px; background:var(--bg-card-alt); overflow:hidden; }
  .progress-bar-inner { height:100%; border-radius:8px; background:var(--accent); transition:width 0.6s cubic-bezier(.4,0,.2,1); }
  ::-webkit-scrollbar { display: none; }
  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(61,46,31,0.5); z-index:100; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--bg-card); border-radius:24px; padding:28px; max-width:340px; width:90%; animation:pop 0.3s ease; box-shadow:var(--shadow-lg); max-height:80vh; overflow-y:auto; }
  /* Explanation box */
  .explanation-box { border-radius:14px; padding:16px 18px; margin-top:14px; animation:slideDown 0.3s ease; }
  .explanation-box.wrong-explain { background:#FFF4F4; border:1.5px solid var(--error); }
  .explanation-box.correct-explain { background:#F2F7F0; border:1.5px solid var(--success); }
  .def-box { font-size:13.5px; line-height:1.6; color:var(--text); margin-bottom:10px; padding-bottom:10px; border-bottom:1.5px dashed var(--bg-card-alt); }
  .why-row { display:flex; gap:8px; align-items:flex-start; padding:7px 0; font-size:12.5px; line-height:1.55; }
  .term { border-bottom:1.5px dotted var(--accent); color:var(--accent-dark); cursor:pointer; font-weight:600; white-space:nowrap; }
  /* Download button */
  .dl-btn { position:fixed; bottom:20px; right:20px; z-index:50; width:44px; height:44px; border-radius:50%; background:var(--accent-dark); color:#FDF6F0; font-size:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.2); cursor:pointer; border:none; transition:all 0.2s; }
  .dl-btn:hover { transform:scale(1.1); }
  /* Offline badge */
  .offline-badge { position:fixed; top:0; left:50%; transform:translateX(-50%); background:var(--warning); color:#fff; font-size:12px; padding:4px 14px; border-radius:0 0 10px 10px; font-weight:600; z-index:200; display:none; }
  .offline-badge.show { display:block; }
  /* Course content */
  .course-content h3 { font-family:'Playfair Display',serif; color:var(--accent-dark); font-size:18px; margin:20px 0 8px; }
  .course-content h3:first-child { margin-top:0; }
  .course-content p, .course-content li { font-size:14px; line-height:1.65; color:var(--text); margin-bottom:8px; }
  .course-content code { background:var(--bg-card-alt); padding:2px 6px; border-radius:6px; font-size:13px; }
  .course-content table { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
  .course-content th, .course-content td { border:1px solid var(--bg-card-alt); padding:6px 8px; text-align:left; }
  .course-content th { background:var(--bg-card-alt); }
  .course-content ul { padding-left:20px; margin-bottom:10px; }
</style>
</head>
<body>

<!-- Offline badge -->
<div class="offline-badge" id="offlineBadge">📴 Hors-ligne – progression sauvegardée</div>

<!-- Download button -->
<button class="dl-btn" onclick="downloadApp()" title="Télécharger l'app">⬇</button>

<!-- Quit modal -->
<div class="modal-overlay" id="quitModal">
  <div class="modal-box">
    <div style="font-size:36px;text-align:center;margin-bottom:12px">⏸</div>
    <h3 style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--accent-dark);text-align:center;margin-bottom:8px">Quitter l'examen ?</h3>
    <p style="color:var(--text-light);font-size:14px;text-align:center;line-height:1.5;margin-bottom:20px">
      Ta progression partielle sera sauvegardée. Tu pourras reprendre plus tard.
    </p>
    <div id="quitScore" style="background:var(--bg-card-alt);border-radius:12px;padding:12px 16px;text-align:center;margin-bottom:16px;font-size:14px;color:var(--text)"></div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="closeQuitModal()" style="flex:1;padding:14px;border-radius:12px;background:var(--bg-card-alt);color:var(--text);font-size:14px;font-weight:600">Continuer</button>
      <button class="btn" onclick="confirmQuit()" style="flex:1;padding:14px;border-radius:12px;background:var(--error);color:#fff;font-size:14px;font-weight:600">Quitter</button>

  </div>
</div>

<!-- Term / Glossary modal -->
<div class="modal-overlay" id="termModal" onclick="if(event.target===this)closeTermModal()">
  <div class="modal-box">
    <div style="font-size:28px;text-align:center;margin-bottom:10px">📖</div>

    <p id="termDef" style="color:var(--text);font-size:14px;line-height:1.6;text-align:left"></p>
    <button class="btn" onclick="closeTermModal()" style="width:100%;margin-top:18px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600">Fermer</button>
  </div>
</div>

</div>

<script>
const chapters = [{"id": "osi", "title": "Modèle OSI & Protocoles", "icon": "🌐", "questions": [{"q": "Combien de couches comporte le modèle OSI ?", "options": ["5 couches", "6 couches", "7 couches", "8 couches"], "answer": 2, "def": "Le modèle OSI (Open Systems Interconnection)* structure les communications réseau en couches empilées, chacune ayant un rôle précis.", "why": ["5 couches correspondrait plutôt au modèle TCP/IP simplifié, pas au modèle OSI complet.", "6 couches oublierait une couche du modèle officiel (il en manquerait une par rapport aux 7 définies par l'ISO).", "Correct : le modèle OSI comporte exactement 7 couches (Physique, Liaison, Réseau, Transport, Session, Présentation, Application), normalisées par l'ISO.", "8 couches serait une couche de trop ; certains ajoutent parfois une 8e couche « politique/humaine » de façon humoristique, mais ce n'est pas la norme officielle."]}, {"q": "Quelle couche du modèle OSI traite directement les bits (0 et 1) transmis sur le support physique ?", "options": ["Couche 2 - Liaison de données", "Couche 1 - Physique", "Couche 3 - Réseau", "Couche 4 - Transport"], "answer": 1, "def": "La couche 1 (Physique)* gère la transmission des bits bruts sur le support (câble cuivre, fibre, ondes radio), sans aucune notion d'adressage.", "why": ["La couche 2 regroupe déjà les bits en trames et ajoute des adresses MAC, elle ne traite pas les bits isolément.", "Correct : la couche Physique s'occupe uniquement du signal électrique/optique/radio représentant chaque bit, sans en comprendre le sens.", "La couche 3 manipule des paquets IP, une unité bien plus élevée que le bit brut.", "La couche 4 gère des segments/datagrammes de bout en bout, encore plus éloignée du bit physique."]}, {"q": "Sous quelle forme (unité de données) circulent les informations à la couche 2 (Liaison de données) ?", "options": ["Des paquets", "Des segments", "Des trames (frames)", "De simples bits isolés"], "answer": 2, "def": "La couche 2 encapsule les données en trames*, qui contiennent notamment les adresses MAC source et destination.", "why": ["Les paquets sont l'unité de la couche 3 (Réseau), qui encapsule les adresses IP, pas les adresses MAC.", "Les segments sont l'unité de la couche 4 (Transport, TCP), avec numéros de séquence.", "Correct : la trame est l'unité de la couche 2, elle contient les adresses MAC et est délimitée par un préambule et un CRC de contrôle.", "Les bits isolés sans structure sont le niveau de la couche 1 (Physique), qui n'a pas de notion de trame."]}, {"q": "La couche 3 (Réseau) du modèle OSI transporte des unités de données appelées :", "options": ["Des segments TCP", "Des trames Ethernet", "Des paquets IP", "Des messages UDP applicatifs"], "answer": 2, "def": "La couche 3 (Réseau)* travaille avec des paquets IP, qui contiennent les adresses IP source et destination pour permettre le routage.", "why": ["Les segments TCP appartiennent à la couche 4 (Transport), qui encapsule déjà les paquets IP de couche 3.", "Les trames Ethernet sont l'unité de couche 2 (Liaison), encapsulant elles-mêmes les paquets IP.", "Correct : le paquet IP est l'unité de la couche 3, il contient les adresses IP nécessaires au routage entre réseaux.", "Les messages UDP sont un terme informel désignant les données de couche 4, pas de couche 3."]}, {"q": "Quelle couche du modèle OSI est responsable du chiffrement et du formatage via SSL/TLS ?", "options": ["Couche 4 - Transport", "Couche 5 - Session", "Couche 6 - Présentation", "Couche 7 - Application"], "answer": 2, "def": "La couche 6 (Présentation)* assure la mise en forme des données : chiffrement, compression, encodage (MIME, codecs).", "why": ["La couche Transport (TCP/UDP) gère l'acheminement fiable des segments, pas le chiffrement des données elles-mêmes.", "La couche Session gère l'ouverture/fermeture des sessions de communication, pas le chiffrement.", "Correct : SSL/TLS assure le chiffrement et la conversion de format des données, rôle attribué théoriquement à la couche Présentation dans le modèle OSI.", "La couche Application héberge les protocoles utilisés par l'utilisateur final (HTTP, FTP), qui s'appuient sur SSL/TLS sans en assumer directement le rôle."]}, {"q": "Que gère précisément la couche 6 (Présentation) du modèle OSI ?", "options": ["Le routage des paquets IP", "Le type de données, le codec, la compression et le format MIME", "L'établissement de la session de communication", "Le contrôle de flux entre émetteur et récepteur"], "answer": 1, "def": "La couche 6 gère l'hétérogénéité des formats* : elle convertit les données dans un format compréhensible par l'application, sans se soucier du chemin réseau.", "why": ["Le routage IP est une fonction de couche 3 (Réseau), assurée par les routeurs, pas par la couche Présentation.", "Correct : la couche Présentation gère la représentation des données (type, codec vidéo/audio, compression, encodage MIME, chiffrement).", "L'établissement de session est le rôle de la couche 5 (Session), une couche différente de la Présentation.", "Le contrôle de flux est généralement assuré par la couche 4 (Transport, via TCP), pas par la couche Présentation."]}, {"q": "À quelle couche du modèle OSI se situe le protocole applicatif FTP ?", "options": ["Couche 5 - Session", "Couche 6 - Présentation", "Couche 7 - Application", "Couche 4 - Transport"], "answer": 2, "def": "FTP est un protocole applicatif* qui interagit directement avec l'utilisateur ou le programme final, ce qui le place en couche 7.", "why": ["La couche Session gère l'établissement/la synchronisation du dialogue, un service utilisé par FTP mais qui n'est pas FTP lui-même.", "La couche Présentation gère le format des données échangées, une fonction sous-jacente à FTP mais distincte de lui.", "Correct : FTP est un protocole de couche 7 (Application), au même titre que HTTP, SMTP ou DNS, car il fournit directement un service à l'utilisateur.", "FTP utilise TCP (couche 4) pour le transport fiable de ses données, mais FTP lui-même reste un protocole de couche 7."]}, {"q": "Quelle est la taille de l'en-tête Ethernet (couche 2), en octets ?", "options": ["12 octets", "14 octets", "16 octets", "20 octets"], "answer": 1, "def": "L'en-tête Ethernet* comprend : adresse MAC destination (6 octets) + adresse MAC source (6 octets) + type/longueur (2 octets).", "why": ["12 octets ne compterait que les deux adresses MAC (6+6), sans le champ EtherType de 2 octets.", "Correct : 6 + 6 + 2 = 14 octets exactement pour un en-tête Ethernet standard (sans tag VLAN).", "16 octets correspondrait à un en-tête Ethernet avec un tag VLAN 802.1Q ajouté (14+2 dans certains calculs approximatifs), mais ce n'est pas la taille de base.", "20 octets est la taille de l'en-tête IP (couche 3), à ne pas confondre avec l'en-tête Ethernet de couche 2."]}, {"q": "À quelle couche du modèle OSI la table ARP est-elle utilisée ?", "options": ["Couche 2 - Liaison", "Couche 3 - Réseau", "Couche 4 - Transport", "Couche 1 - Physique"], "answer": 1, "def": "ARP fait le lien entre couche 3 et couche 2*, mais sa fonction (résoudre une IP en MAC) est rattachée à la couche 3 dans la plupart des découpages pédagogiques.", "why": ["La couche 2 utilise le résultat d'ARP (l'adresse MAC) mais ne gère pas elle-même la résolution d'adresse.", "Correct : ARP répond à un besoin de couche 3 (savoir quelle adresse MAC correspond à une IP cible) pour permettre l'envoi effectif de la trame.", "La couche 4 gère les ports et la fiabilité du transport, sans lien avec la résolution d'adresses MAC.", "La couche 1 ne gère que le signal physique, sans aucune notion d'adressage logique ou physique structuré."]}, {"q": "Quel est le format des données à la couche 4 pour le protocole TCP ?", "options": ["Des paquets", "Des segments", "Des trames", "Des datagrammes"], "answer": 1, "def": "TCP encapsule les données en segments*, chacun portant un numéro de séquence et un accusé de réception pour garantir la fiabilité.", "why": ["Les paquets désignent l'unité de couche 3 (IP), qui encapsule justement les segments TCP.", "Correct : le segment est l'unité de TCP, comportant les numéros de séquence/ACK qui permettent la reconstruction ordonnée des données.", "Les trames sont l'unité de couche 2 (Ethernet), bien en dessous du niveau TCP.", "Le terme datagramme est traditionnellement réservé à UDP (qui n'a pas de numérotation de séquence comme TCP)."]}, {"q": "Quel protocole de transport est dit « orienté connexion » ?", "options": ["UDP", "ICMP", "TCP", "ARP"], "answer": 2, "def": "Un protocole orienté connexion* établit d'abord un canal de communication fiable (poignée de main) avant tout échange de données.", "why": ["UDP est justement le protocole sans connexion : il envoie les datagrammes sans négociation ni garantie de livraison.", "ICMP sert aux messages de contrôle/diagnostic (comme le ping), ce n'est pas un protocole de transport orienté connexion.", "Correct : TCP établit une connexion via le three-way handshake* (SYN, SYN-ACK, ACK) avant tout transfert, garantissant fiabilité et ordre des données.", "ARP résout des adresses IP en adresses MAC, un protocole de résolution sans aucune notion de connexion."]}, {"q": "Quel protocole de transport est le plus adapté aux applications temps réel (voix, vidéo, jeux en ligne) ?", "options": ["TCP", "UDP", "ICMP", "IGMP"], "answer": 1, "def": "UDP* est privilégié en temps réel car il n'ajoute aucun mécanisme de retransmission ni d'accusé de réception, minimisant la latence.", "why": ["TCP introduirait un délai supplémentaire à cause des accusés de réception et retransmissions, pénalisant le direct (mieux vaut perdre une image que d'attendre sa retransmission).", "Correct : UDP envoie les données sans attendre de confirmation, ce qui minimise la latence — crucial pour la voix/vidéo en temps réel où un léger flux perdu est moins gênant qu'un délai.", "ICMP sert au diagnostic réseau (ping, messages d'erreur), ce n'est pas un protocole de transport de données applicatives.", "IGMP gère l'adhésion à des groupes multicast, un rôle très spécifique sans rapport avec le transport temps réel classique."]}, {"q": "Quelle est la taille maximale historique d'une requête/réponse DNS classique sur UDP (avant EDNS0) ?", "options": ["256 octets", "512 octets", "1024 octets", "1500 octets"], "answer": 1, "def": "Le RFC 1035 fixe la limite historique des messages DNS sur UDP* à 512 octets ; au-delà, le protocole bascule sur TCP.", "why": ["256 octets serait une limite deux fois trop basse par rapport à la norme historique DNS.", "Correct : 512 octets est la limite fixée par le RFC 1035 pour les messages DNS classiques sur UDP, une réponse plus volumineuse basculant en TCP.", "1024 octets correspondrait à une extension (proche d'EDNS0), pas à la limite historique de base.", "1500 octets correspond au MTU Ethernet standard, une valeur bien supérieure à la limite DNS/UDP historique."]}, {"q": "Quelle est la valeur du MTU (Maximum Transmission Unit) Ethernet standard ?", "options": ["1000 octets", "1500 octets", "9000 octets", "512 octets"], "answer": 1, "def": "Le MTU* définit la taille maximale d'une trame transportable sans fragmentation ; 1500 octets est la norme Ethernet historique.", "why": ["1000 octets n'est pas une valeur standard reconnue pour le MTU Ethernet classique.", "Correct : 1500 octets est le MTU Ethernet standard, hérité des débuts du protocole et toujours largement utilisé aujourd'hui.", "9000 octets correspond au MTU des Jumbo Frames, une extension utilisée en datacenter, pas la valeur standard de base.", "512 octets est la limite historique DNS sur UDP, une valeur totalement différente du MTU Ethernet."]}, {"q": "Qu'est-ce qu'une Jumbo Frame ?", "options": ["Une trame Ethernet classique de 1500 octets", "Une trame Ethernet étendue de 9000 à 9014 octets", "Une trame Ethernet réduite de 512 octets", "Une trame Ethernet sans en-tête"], "answer": 1, "def": "Les Jumbo Frames* dépassent le MTU standard pour réduire le nombre de trames à traiter, diminuant ainsi la charge CPU en datacenter.", "why": ["1500 octets est justement la taille STANDARD, celle qu'une Jumbo Frame dépasse volontairement.", "Correct : une Jumbo Frame va de 9000 à 9014 octets environ, réduisant le nombre de trames nécessaires pour transporter un grand volume de données.", "512 octets serait une trame plus PETITE que la norme, l'inverse du principe d'une Jumbo Frame qui vise à être plus grande.", "Une trame Ethernet a toujours un en-tête (adresses MAC, EtherType) ; une trame « sans en-tête » ne serait pas conforme au standard Ethernet."]}]}, {"id": "reseau", "title": "Réseau & Routage", "icon": "🔀", "questions": [{"q": "Quel protocole de routage fonctionne selon le principe « link-state » (à état de lien) ?", "options": ["RIP", "EIGRP", "OSPF", "BGP"], "answer": 2, "def": "Un protocole link-state* fait connaître à chaque routeur la topologie complète du réseau, qui calcule ensuite le meilleur chemin via l'algorithme de Dijkstra.", "why": ["RIP est un protocole distance-vector très simple, basé uniquement sur le nombre de sauts, sans connaissance de la topologie globale.", "EIGRP est un protocole hybride (souvent qualifié de distance-vector avancé), propriétaire Cisco, distinct du modèle link-state pur.", "Correct : OSPF construit une base de données de topologie complète (LSDB) partagée entre tous les routeurs de la zone, puis calcule les routes via Dijkstra.", "BGP est un protocole de type path-vector utilisé entre systèmes autonomes, pas un protocole link-state interne à un réseau."]}, {"q": "BGP est un protocole de routage de quel type ?", "options": ["Interior Gateway Protocol (IGP)", "Exterior Gateway Protocol (EGP)", "Protocole link-state interne", "Protocole distance-vector interne classique"], "answer": 1, "def": "BGP est le seul EGP* utilisé à grande échelle : il route le trafic ENTRE systèmes autonomes (AS), formant l'ossature d'Internet.", "why": ["Un IGP (comme OSPF ou RIP) route à l'intérieur d'un même système autonome, alors que BGP route justement ENTRE systèmes autonomes différents.", "Correct : BGP est l'unique EGP couramment utilisé sur Internet, permettant l'échange de routes entre des milliers d'AS appartenant à des organisations différentes.", "BGP fonctionne sur un principe de path-vector (chemin d'AS traversés), pas de link-state (topologie complète partagée).", "BGP n'est pas un protocole distance-vector classique comme RIP ; c'est un protocole d'un tout autre ordre de grandeur, conçu pour l'échelle d'Internet."]}, {"q": "Qu'est-ce qu'un VRF (Virtual Routing and Forwarding) ?", "options": ["Un mécanisme créant plusieurs tables de routage virtuellement séparées sur un même routeur", "Un pare-feu virtuel intégré aux routeurs", "Un protocole de segmentation des VLAN", "Un mécanisme de redondance de routeurs virtuels"], "answer": 0, "def": "Un VRF* permet à un seul routeur physique de gérer plusieurs tables de routage indépendantes, comme s'il s'agissait de plusieurs routeurs distincts.", "why": ["Correct : le VRF isole plusieurs instances de routage sur un même équipement physique, utile pour le multi-tenant ou l'isolation stricte de trafic.", "Un VRF ne fait pas office de pare-feu ; il segmente la table de routage, pas les règles de filtrage de trafic.", "La segmentation VLAN se fait en couche 2, le VRF agit en couche 3 (routage) — ce sont deux mécanismes complémentaires mais distincts.", "La redondance de routeurs virtuels (passerelle partagée) est le rôle de HSRP/VRRP/CARP, pas du VRF qui concerne l'isolation de table de routage."]}, {"q": "Que signifie FQDN ?", "options": ["Fully Qualified Domain Name", "Fast Query Domain Network", "Firewall Qualified DNS", "Full Quality Data Name"], "answer": 0, "def": "Un FQDN* est le nom de domaine complet et non ambigu d'une machine, incluant tous les niveaux hiérarchiques jusqu'à la racine DNS.", "why": ["Correct : un FQDN comme 'mail.exemple.com.' identifie de façon absolue une machine dans l'arborescence DNS mondiale (le point final représente la racine).", "'Fast Query Domain Network' n'est pas un sigle réseau reconnu, c'est un intrus construit pour ressembler à FQDN.", "'Firewall Qualified DNS' n'existe pas non plus comme terme standard du DNS.", "'Full Quality Data Name' est également un intrus sans rapport avec la terminologie DNS officielle."]}, {"q": "Quelle est la différence entre un serveur DNS récursif et un serveur DNS itératif ?", "options": ["Récursif : le serveur résout toute la requête lui-même ; Itératif : il renvoie vers un autre serveur plus compétent", "Récursif est plus rapide, Itératif est plus lent, sans autre différence", "Il n'y a aucune différence, ce sont des synonymes", "Récursif utilise UDP, Itératif utilise toujours TCP"], "answer": 0, "def": "Le mode récursif* décharge le client de tout le travail de résolution ; le mode itératif* renvoie simplement la meilleure référence connue à chaque étape.", "why": ["Correct : en mode récursif, le serveur interroge lui-même toute la chaîne DNS et renvoie la réponse finale ; en mode itératif, il indique juste 'demande à ce serveur-là'.", "La vitesse n'est pas la distinction fondamentale entre les deux modes ; la différence porte sur QUI effectue le travail de résolution complet.", "Ce ne sont clairement pas des synonymes : ils décrivent deux comportements de résolution très différents.", "Le choix UDP/TCP dépend de la taille de la réponse (voir la limite historique de 512 octets), pas du mode récursif ou itératif."]}, {"q": "Que diffuse le protocole Spanning Tree (STP) pour détecter les boucles réseau ?", "options": ["Des paquets ICMP", "Des trames BPDU", "Des requêtes ARP", "Des messages SNMP"], "answer": 1, "def": "STP échange des trames BPDU* (Bridge Protocol Data Unit) entre switches pour élire un pont racine et bloquer les liens redondants.", "why": ["ICMP sert au diagnostic réseau (ping, erreurs), sans rapport avec la détection de boucles de couche 2.", "Correct : les BPDU contiennent les informations nécessaires (ID de pont, coût de chemin) pour que STP construise une topologie sans boucle.", "ARP résout des adresses IP en adresses MAC, un mécanisme totalement différent de la prévention des boucles.", "SNMP est un protocole de supervision qui collecte des métriques, il ne participe pas à l'algorithme Spanning Tree."]}, {"q": "Sur combien de bits une adresse MAC est-elle codée ?", "options": ["32 bits", "48 bits", "64 bits", "128 bits"], "answer": 1, "def": "Une adresse MAC* fait 48 bits (6 octets), généralement représentée en hexadécimal séparée par des deux-points ou des tirets.", "why": ["32 bits correspond à la taille d'une adresse IPv4, pas d'une adresse MAC.", "Correct : 48 bits = 6 octets, dont 24 bits (3 octets) identifient le fabricant (OUI) et 24 bits l'interface réseau elle-même.", "64 bits serait supérieur à la taille réelle d'une adresse MAC classique (EUI-48).", "128 bits correspond à la taille d'une adresse IPv6, bien plus grande qu'une adresse MAC."]}, {"q": "Que désignent les 3 premiers octets (24 bits) d'une adresse MAC ?", "options": ["L'identifiant unique de l'hôte final", "L'identifiant du réseau IP", "Le fabricant de la carte réseau (OUI)", "L'identifiant du VLAN d'appartenance"], "answer": 2, "def": "Les 3 premiers octets forment l'OUI* (Organizationally Unique Identifier), attribué par l'IEEE à chaque fabricant de matériel réseau.", "why": ["L'identifiant unique de l'hôte correspond plutôt aux 3 DERNIERS octets, laissés à la discrétion du fabricant.", "Une adresse MAC ne contient aucune information sur le réseau IP ; ce sont deux systèmes d'adressage indépendants (couche 2 vs couche 3).", "Correct : l'OUI identifie le fabricant (par ex. certains préfixes identifient Cisco, Dell, VMware...), garantissant l'unicité mondiale des adresses MAC en combinaison avec les 3 derniers octets.", "Le VLAN est une information de configuration logique du switch, jamais encodée dans l'adresse MAC elle-même."]}, {"q": "À quoi sert le protocole 802.1Q ?", "options": ["Au chiffrement du trafic WiFi", "Au tagging (marquage) des VLAN sur les liens trunk", "À la qualité de service (QoS) exclusivement", "À l'authentification des utilisateurs réseau"], "answer": 1, "def": "802.1Q* insère un tag de 4 octets dans la trame Ethernet, indiquant à quel VLAN elle appartient sur un lien trunk.", "why": ["802.1Q n'a aucun rapport avec le chiffrement WiFi (qui relève de WPA2/WPA3), c'est un protocole filaire de couche 2.", "Correct : 802.1Q est LA norme IEEE de marquage VLAN, indispensable pour transporter plusieurs VLAN sur un même lien physique (trunk).", "802.1Q peut transporter un champ de priorité (802.1p) utilisable pour la QoS, mais son rôle principal reste le tagging VLAN, pas la QoS à lui seul.", "802.1Q ne gère aucune authentification d'utilisateur ; l'authentification réseau relève de protocoles comme 802.1X, un standard différent."]}, {"q": "Qu'est-ce qu'un trunk réseau, dans le contexte des switches ?", "options": ["Un simple lien point-à-point entre deux hôtes", "Un lien (souvent entre switches) transportant plusieurs VLANs simultanément", "Un câble fibre optique par définition", "Un tunnel VPN chiffré entre deux sites"], "answer": 1, "def": "Un trunk* utilise le tagging 802.1Q pour transporter le trafic de plusieurs VLAN sur un seul lien physique, contrairement à un port access limité à un seul VLAN.", "why": ["Un lien entre deux hôtes finaux (PC) est généralement un simple port access, pas un trunk qui relie plutôt des équipements réseau entre eux.", "Correct : le trunk permet à un lien physique unique de transporter les trames de plusieurs VLAN grâce au tag 802.1Q, économisant le câblage.", "Un trunk peut être en cuivre ou en fibre ; ce n'est pas le type de câble qui définit un trunk, mais son rôle logique de transport multi-VLAN.", "Un tunnel VPN chiffre du trafic à travers un réseau public, un concept de couche 3/4 sans rapport avec le tagging VLAN de couche 2."]}, {"q": "Que signifie le sigle LAG (Link Aggregation Group) ?", "options": ["Link Aggregation Group : regroupement de liens physiques en un lien logique", "Local Area Gateway : passerelle d'un réseau local", "Logical Access Gate : portail d'accès logique", "LAN Aggregation : fusion de deux réseaux locaux distincts"], "answer": 0, "def": "Un LAG* combine plusieurs liens physiques (câbles) en un seul lien logique, augmentant la bande passante disponible et la tolérance de panne.", "why": ["Correct : LAG regroupe par exemple 2 liens de 10 Gbps en un lien logique de 20 Gbps, avec redondance si un câble tombe.", "'Local Area Gateway' n'est pas la signification réelle de LAG, c'est un intrus construit pour tromper.", "'Logical Access Gate' n'existe pas non plus comme terme réseau standard.", "Un LAG ne fusionne pas deux réseaux LAN distincts, il agrège des LIENS physiques entre deux mêmes équipements."]}, {"q": "Quel protocole standard (non-propriétaire) normalise l'agrégation de liens ?", "options": ["STP", "LACP", "OSPF", "BGP"], "answer": 1, "def": "LACP* (Link Aggregation Control Protocol, norme IEEE 802.3ad/802.1AX) négocie dynamiquement l'agrégation entre deux équipements compatibles.", "why": ["STP gère la prévention des boucles réseau, un objectif différent (et parfois complémentaire) de l'agrégation de liens.", "Correct : LACP permet à deux équipements de négocier automatiquement quels ports agréger, contrairement à un agrégat statique non standardisé.", "OSPF est un protocole de routage de couche 3, sans lien avec l'agrégation de liens physiques de couche 2.", "BGP route entre systèmes autonomes à l'échelle d'Internet, un rôle très éloigné de l'agrégation de liens locale."]}, {"q": "Qu'est-ce que le DHCP Snooping ?", "options": ["Un serveur DHCP alternatif plus rapide", "Un mécanisme de sécurité qui filtre les réponses DHCP selon le port d'origine", "Un protocole de routage dynamique", "Une variante chiffrée du protocole DHCP"], "answer": 1, "def": "Le DHCP Snooping* classe les ports switch en 'trusted' (autorisés à répondre en DHCP) et 'untrusted' (autorisés uniquement à émettre des requêtes), bloquant les réponses illégitimes.", "why": ["Ce n'est pas un serveur DHCP concurrent, mais une fonctionnalité de sécurité de switch qui filtre le trafic DHCP existant.", "Correct : DHCP Snooping empêche un serveur DHCP non autorisé (rogue DHCP) branché sur un port utilisateur de distribuer de fausses configurations réseau.", "Ce n'est pas un protocole de routage, il agit en couche 2 sur les switches pour filtrer un type de trafic précis (DHCP).", "Le DHCP Snooping ne chiffre rien, il filtre les messages DHCP selon la confiance accordée à chaque port du switch."]}, {"q": "Qu'est-ce qu'un Private VLAN (PVLAN) ?", "options": ["Un VLAN chiffré de bout en bout", "Un mécanisme qui isole des ports au sein d'un même VLAN", "Un VLAN accessible uniquement en interne, sans routage", "Un VLAN masqué et invisible aux autres équipements"], "answer": 1, "def": "Les Private VLANs* subdivisent un VLAN en ports isolés (ne communiquant qu'avec le port 'promiscuous') et communautaires, un raffinement au-delà du simple VLAN.", "why": ["Un PVLAN n'ajoute aucun chiffrement, c'est une technique de segmentation logique supplémentaire au sein d'un VLAN existant.", "Correct : les PVLAN permettent, par exemple en DMZ, d'empêcher deux serveurs du même VLAN de communiquer directement entre eux, limitant les attaques par rebond.", "Un VLAN 'sans routage' n'a pas de sens en soi ; le PVLAN concerne l'isolation DE PORTS à l'intérieur d'un même VLAN, pas l'absence de routage externe.", "Un PVLAN n'est pas invisible : les autres équipements le voient, mais la communication entre certains ports internes est restreinte."]}, {"q": "Quelle est la différence entre une trame « tagged » et une trame « untagged » ?", "options": ["Tagged contient un tag VLAN 802.1Q, Untagged n'en contient pas", "Tagged est chiffrée, Untagged est en clair", "Il n'y a aucune différence pratique", "Tagged utilise TCP, Untagged utilise UDP"], "answer": 0, "def": "Une trame tagged porte un en-tête 802.1Q supplémentaire de 4 octets indiquant son VLAN, utilisée sur les liens trunk ; une trame untagged n'en a pas, typique des ports access.", "why": ["Correct : le tag 802.1Q identifie le VLAN d'appartenance sur un lien trunk ; en son absence (untagged), la trame appartient au VLAN natif du port.", "Le tagging VLAN n'a aucun rapport avec le chiffrement des données, ce sont deux notions indépendantes.", "La différence est bien réelle et fonctionnelle : elle détermine comment le switch interprète et route la trame selon son VLAN.", "Le protocole de transport (TCP/UDP) est une notion de couche 4, totalement indépendante du tagging VLAN de couche 2."]}, {"q": "Quelle est la différence fondamentale entre NAT et Bridge ?", "options": ["NAT traduit les adresses IP (couche 3), Bridge relie deux segments au niveau 2 sans les modifier", "NAT opère en couche 2, Bridge en couche 3", "Il n'y a aucune différence, ce sont deux noms pour le même mécanisme", "NAT chiffre les données, Bridge route les paquets"], "answer": 0, "def": "Le NAT* modifie les adresses IP des paquets (couche 3) ; un bridge* relie deux segments Ethernet de façon transparente (couche 2), sans toucher aux adresses.", "why": ["Correct : le NAT agit en couche 3 en substituant des adresses IP, le bridge agit en couche 2 en faisant transiter les trames sans les modifier.", "C'est l'inverse : le NAT est un mécanisme de couche 3 (adresses IP), le bridge un mécanisme de couche 2 (trames Ethernet).", "Ce sont deux mécanismes très différents dans leur couche d'action et leur fonction, pas des synonymes.", "Ni le NAT ni le bridge ne chiffrent quoi que ce soit ; le NAT traduit des adresses, le bridge relie des segments de façon transparente."]}, {"q": "Le port TCP 3389 est utilisé par quel service ?", "options": ["SSH", "RDP (Bureau à distance Windows)", "HTTP", "FTP"], "answer": 1, "def": "Le port 3389* est le port par défaut du protocole RDP (Remote Desktop Protocol) utilisé pour le bureau à distance sous Windows.", "why": ["SSH utilise le port 22, un service d'administration à distance sécurisée pour systèmes Unix/Linux principalement.", "Correct : RDP écoute par défaut sur le port TCP 3389 pour les connexions de bureau à distance Windows.", "HTTP utilise le port 80, un protocole web sans rapport avec le bureau à distance.", "FTP utilise les ports 20 (données) et 21 (contrôle), pour le transfert de fichiers, pas pour l'affichage à distance d'un bureau."]}, {"q": "Quelle est la différence entre un signal analogique et un signal numérique ?", "options": ["Analogique = signal continu, Numérique = signal discret (0 et 1)", "Analogique est toujours plus rapide que le numérique", "Numérique est un signal continu, Analogique est discret", "Il n'existe aucune différence technique entre les deux"], "answer": 0, "def": "Un signal analogique* peut prendre une infinité de valeurs continues ; un signal numérique* ne prend que des valeurs discrètes (généralement 0 et 1).", "why": ["Correct : le téléphone filaire classique transmet un signal analogique continu, alors que les réseaux informatiques modernes transmettent un signal numérique (bits).", "La vitesse ne dépend pas uniquement de la nature analogique/numérique du signal, mais de nombreux autres facteurs (bande passante, distance, bruit).", "C'est l'inverse : le signal numérique est discret (valeurs distinctes), le signal analogique est continu.", "Il existe une différence fondamentale de nature du signal, avec des implications directes sur le traitement, le bruit et la transmission."]}, {"q": "Quelle est la différence entre le débit (throughput) et la bande passante (bandwidth) ?", "options": ["Bande passante = capacité maximale théorique, Débit = transfert réel observé", "Bande passante = transfert réel, Débit = capacité théorique maximale", "Ce sont deux synonymes désignant exactement la même mesure", "Le débit est toujours supérieur à la bande passante théorique"], "answer": 0, "def": "La bande passante* est une limite théorique du lien (ex: 1 Gbps) ; le débit (throughput)* est ce qui est réellement observé, toujours inférieur à cause de l'overhead protocolaire.", "why": ["Correct : un lien à 1 Gbps de bande passante n'atteindra jamais 1 Gbps de débit réel utile, à cause des en-têtes protocolaires et de la congestion.", "C'est l'inverse : la bande passante est la limite théorique, le débit est la mesure réelle du transfert observé.", "Ce sont deux notions distinctes en pratique : l'une est une capacité maximale, l'autre une mesure de performance effective.", "Le débit réel est toujours INFÉRIEUR ou égal à la bande passante théorique, jamais supérieur (on ne peut pas dépasser la capacité physique du lien)."]}]}, {"id": "securite", "title": "Sécurité Réseau & Pare-feu", "icon": "🛡️", "questions": [{"q": "pfSense est concrètement :", "options": ["Un logiciel antivirus", "Un pare-feu/routeur open source basé sur FreeBSD", "Un serveur DNS dédié", "Un switch manageable niveau 2"], "answer": 1, "def": "pfSense* est une distribution FreeBSD dédiée, offrant filtrage, NAT, VPN et IDS/IPS intégrés (via Snort/Suricata).", "why": ["Un antivirus protège un poste contre les malwares locaux ; pfSense agit au niveau du réseau, pas sur les fichiers d'une machine.", "Correct : pfSense est un système d'exploitation-pare-feu complet, utilisé comme routeur/pare-feu principal d'un réseau.", "pfSense peut faire tourner un service DNS (résolveur/forwarder), mais ce n'est qu'une fonctionnalité parmi d'autres, pas sa nature première.", "Un switch manageable opère en couche 2 pour la commutation ; pfSense est avant tout un équipement de couche 3+ (routage/filtrage)."]}, {"q": "Que fait un proxy (forward proxy) classique ?", "options": ["Il route les paquets entre réseaux distants", "Il fait office d'intermédiaire entre le client et Internet", "Il chiffre systématiquement toutes les données", "Il attribue dynamiquement des adresses IP"], "answer": 1, "def": "Un proxy (forward proxy)* se place côté client : il relaie ses requêtes vers Internet, pouvant filtrer, cacher ou journaliser le trafic.", "why": ["Le routage entre réseaux est une fonction assurée par les routeurs (couche 3), pas la fonction première d'un proxy applicatif.", "Correct : le proxy intercepte les requêtes du client, les relaie vers la destination, et peut mettre en cache ou filtrer le contenu retourné.", "Un proxy ne chiffre pas nécessairement les données ; certains le font (proxy HTTPS), mais ce n'est pas systématique ni sa fonction centrale.", "L'attribution dynamique d'adresses IP est le rôle du DHCP, sans rapport avec la fonction d'intermédiaire d'un proxy."]}, {"q": "Que fait un reverse proxy, à la différence d'un proxy classique ?", "options": ["Il protège les postes clients des menaces externes", "Il fait office d'intermédiaire côté serveur, répartissant les requêtes entrantes", "Il bloque uniquement les connexions VPN", "Il crée et gère les VLAN du réseau"], "answer": 1, "def": "Un reverse proxy* (HAProxy, Nginx) se place devant les serveurs pour répartir la charge et masquer l'infrastructure réelle, à l'inverse du proxy classique côté client.", "why": ["Un reverse proxy protège les SERVEURS (en masquant leur infrastructure), pas directement les postes clients qui se connectent à eux.", "Correct : le reverse proxy reçoit les requêtes entrantes destinées aux serveurs, les répartit (load balancing) et cache l'architecture interne.", "Le reverse proxy n'a pas de rôle spécifique de blocage VPN ; sa fonction est de répartir/filtrer le trafic web entrant vers les serveurs.", "La création de VLAN est une fonction réseau de couche 2, indépendante du rôle applicatif d'un reverse proxy."]}, {"q": "CrowdSec est un outil de quelle nature ?", "options": ["Virtualisation de serveurs", "Sécurité collaborative de type IPS/IDS", "Gestion de projet agile", "Sauvegarde de données"], "answer": 1, "def": "CrowdSec* analyse les logs localement et partage les IP malveillantes détectées avec une communauté d'utilisateurs, renforçant collectivement la détection.", "why": ["CrowdSec n'a aucun rapport avec la virtualisation de machines, c'est un outil de sécurité réseau/système.", "Correct : CrowdSec est un IPS/IDS communautaire qui bloque automatiquement les IP identifiées comme malveillantes par l'ensemble de ses utilisateurs.", "Ce n'est pas un outil de gestion de projet, mais un outil de cybersécurité analysant les journaux système.", "CrowdSec ne sauvegarde aucune donnée ; il détecte et bloque des comportements suspects à partir des logs."]}, {"q": "Wazuh est concrètement :", "options": ["Un pare-feu réseau classique", "Un SIEM open source (Security Information and Event Management)", "Un serveur DNS résolveur", "Un hyperviseur de virtualisation"], "answer": 1, "def": "Wazuh* collecte, agrège et analyse les logs de sécurité de toute une infrastructure pour détecter des incidents, un rôle de SIEM.", "why": ["Wazuh n'effectue aucun filtrage de trafic réseau lui-même, contrairement à un pare-feu classique comme pfSense.", "Correct : Wazuh est un SIEM qui centralise les journaux (agents Windows/Linux) et génère des alertes de sécurité en temps réel.", "Wazuh ne résout pas de noms de domaine, ce n'est pas un serveur DNS.", "Wazuh ne virtualise aucune machine, c'est un outil d'analyse de sécurité logicielle, pas un hyperviseur."]}, {"q": "Que contient principalement la base Exploit-DB ?", "options": ["Des firmwares constructeurs", "Des vulnérabilités et exploits publics référencés", "Des certificats SSL valides", "Une liste d'adresses IP publiques réservées"], "answer": 1, "def": "Exploit-DB* est une base publique de vulnérabilités et de codes d'exploitation (preuves de concept), largement utilisée en pentest.", "why": ["Exploit-DB ne distribue pas de firmwares constructeurs, ce n'est pas son objet.", "Correct : Exploit-DB référence des CVE et des exploits associés, permettant aux pentesters de vérifier si un système est vulnérable à une faille connue.", "Les certificats SSL sont gérés par des autorités de certification (CA), sans rapport avec Exploit-DB.", "Les adresses IP publiques réservées sont gérées par les RIR (registres Internet régionaux), sans lien avec cette base de vulnérabilités."]}, {"q": "Que décrit la matrice MITRE ATT&CK ?", "options": ["Les protocoles réseau standards de l'IETF", "Les techniques, tactiques et procédures (TTP) réellement utilisées par les attaquants", "Les normes ISO de qualité", "Les 7 couches du modèle OSI"], "answer": 1, "def": "MITRE ATT&CK* catalogue de façon structurée les TTP observées chez de vrais attaquants, servant de référence pour modéliser les menaces.", "why": ["Les protocoles IETF sont documentés dans les RFC, un référentiel technique différent et sans lien direct avec ATT&CK.", "Correct : ATT&CK organise les techniques d'attaque (reconnaissance, accès initial, persistance...) observées dans le monde réel, utilisées pour tester les défenses (red/blue team).", "Les normes ISO de qualité (comme ISO 9001) concernent le management, sans rapport avec les techniques d'attaque informatique.", "Le modèle OSI décrit les couches de communication réseau, un sujet totalement différent des tactiques d'attaquants."]}, {"q": "Maltego est un outil dédié à :", "options": ["La virtualisation de serveurs", "L'OSINT et la cartographie de relations entre entités", "Le filtrage pare-feu", "La supervision réseau en temps réel"], "answer": 1, "def": "Maltego* visualise graphiquement les relations entre entités (domaines, IP, personnes, organisations) à partir de sources ouvertes (OSINT).", "why": ["Maltego n'a aucune fonction de virtualisation, c'est un outil de reconnaissance et de cartographie d'informations.", "Correct : Maltego collecte et relie des informations publiques (OSINT) pour révéler des connexions cachées entre entités, utile en reconnaissance.", "Maltego ne filtre aucun trafic réseau, ce n'est pas un pare-feu.", "Maltego n'est pas un outil de supervision d'infrastructure en continu, mais un outil ponctuel d'analyse de relations OSINT."]}, {"q": "Nessus est un outil dédié à :", "options": ["Le scan et l'audit de vulnérabilités", "La gestion des VLAN sur un switch", "Le routage dynamique entre réseaux", "Le chiffrement des communications VPN"], "answer": 0, "def": "Nessus* (Tenable) est l'un des scanners de vulnérabilités les plus utilisés, détectant failles, mauvaises configurations et correctifs manquants.", "why": ["Correct : Nessus analyse un système ou un réseau à la recherche de vulnérabilités connues (CVE) et de défauts de configuration.", "La gestion des VLAN est une fonction de switch/pare-feu, totalement distincte du rôle d'audit de Nessus.", "Le routage dynamique relève de protocoles comme OSPF/BGP, sans rapport avec un outil d'audit de sécurité.", "Nessus ne chiffre rien lui-même ; il peut détecter des faiblesses de configuration VPN, mais ne gère pas le chiffrement en tant que tel."]}, {"q": "À quoi sert Fail2ban ?", "options": ["À créer des tunnels VPN chiffrés", "À bloquer automatiquement les IP après des tentatives de connexion échouées répétées", "À monitorer en continu la bande passante réseau", "À gérer le cycle de vie des certificats SSL"], "answer": 1, "def": "Fail2ban* analyse les journaux systèmes (auth.log, nginx...) et bannit temporairement les IP dépassant un seuil de tentatives échouées (brute force).", "why": ["Fail2ban ne crée aucun tunnel VPN, c'est un outil de protection contre les attaques par force brute, pas un logiciel de VPN.", "Correct : après un certain nombre d'échecs d'authentification (SSH, formulaire web...), Fail2ban bannit automatiquement l'IP source pour une durée définie.", "Fail2ban ne mesure pas la bande passante, il surveille des motifs d'échec d'authentification dans les journaux.", "Fail2ban n'a aucun rôle dans la gestion des certificats SSL, ce n'est pas son domaine d'action."]}, {"q": "Pegasus est concrètement :", "options": ["Un protocole de routage réseau", "Un logiciel espion (spyware) sophistiqué", "Un outil open source de sauvegarde", "Un hyperviseur de virtualisation"], "answer": 1, "def": "Pegasus* (NSO Group) est un spyware capable d'infecter des smartphones sans interaction (zero-click), accédant messages, caméra, micro et localisation.", "why": ["Pegasus n'a aucun rapport avec le routage réseau, c'est un logiciel malveillant ciblant les terminaux mobiles.", "Correct : Pegasus exploite des failles zero-day pour infecter un téléphone à l'insu de son propriétaire, sans qu'il ait besoin de cliquer sur quoi que ce soit.", "Pegasus n'est pas open source ni destiné à la sauvegarde ; c'est un logiciel espion commercial controversé.", "Pegasus ne virtualise rien, il s'agit d'un logiciel espion ciblant des appareils mobiles individuels."]}, {"q": "Qu'est-ce que le KRACK Attack ?", "options": ["Une attaque exploitant une faille du protocole WPA2 WiFi", "Une attaque de déni de service par saturation volumétrique", "Une injection de code SQL dans une base de données", "Une attaque de type homme du milieu sur le DNS"], "answer": 0, "def": "KRACK (Key Reinstallation Attack)* exploite une faille dans la négociation de clé WPA2, permettant de réinstaller une clé déjà utilisée et de déchiffrer le trafic.", "why": ["Correct : KRACK cible spécifiquement le four-way handshake de WPA2, en forçant la réinstallation d'une clé de chiffrement déjà connue de l'attaquant.", "Une attaque DDoS vise à saturer un service, un mécanisme complètement différent de l'exploitation de faille cryptographique de KRACK.", "Une injection SQL cible une application web mal sécurisée, sans rapport avec le protocole de sécurité WiFi WPA2.", "KRACK ne cible pas le DNS, mais spécifiquement la négociation de clé du protocole de sécurité WiFi WPA2."]}, {"q": "Pourquoi isoler les serveurs d'une DMZ avec des Private VLAN ?", "options": ["Pour améliorer uniquement la performance réseau", "Pour empêcher les attaques par rebond entre serveurs compromis", "Pour faciliter le routage inter-VLAN", "Pour simplifier la configuration DHCP"], "answer": 1, "def": "Les Private VLAN* empêchent un serveur DMZ compromis de communiquer directement avec les autres serveurs du même VLAN, limitant la propagation d'une attaque.", "why": ["L'objectif premier des PVLAN en DMZ est la sécurité (isolation), pas la performance réseau, même si la réduction du trafic diffusé peut avoir un effet secondaire positif.", "Correct : sans isolation, un attaquant ayant compromis un serveur web pourrait pivoter directement vers un serveur de base de données du même VLAN.", "Les PVLAN compliquent plutôt le routage inter-VLAN (ils le restreignent volontairement), ce n'est pas leur objectif de simplification.", "Le DHCP est un service distinct, sans rapport avec la finalité sécuritaire des Private VLAN."]}, {"q": "Où sont stockés les mots de passe (hashés) des utilisateurs sous Linux ?", "options": ["/etc/passwd", "/etc/shadow", "/var/log/auth", "/root/passwords"], "answer": 1, "def": "/etc/shadow* contient les empreintes (hash) des mots de passe, lisible uniquement par root, contrairement à /etc/passwd lisible par tous.", "why": ["/etc/passwd liste les comptes utilisateurs (UID, shell, home) mais ne contient plus les hash de mots de passe depuis longtemps, pour des raisons de sécurité.", "Correct : /etc/shadow stocke les hash (généralement SHA-512) et les règles d'expiration des mots de passe, en accès restreint à root.", "/var/log/auth contient les journaux d'authentification (tentatives de connexion), pas les mots de passe eux-mêmes.", "/root/passwords n'est pas un emplacement standard du système Linux ; les mots de passe ne sont jamais stockés en clair dans un tel fichier."]}, {"q": "Pourquoi faut-il sécuriser les serveurs DNS internes d'un réseau local (LAN) ?", "options": ["Pour améliorer uniquement la vitesse de résolution", "Un attaquant pourrait cartographier toute la topologie du réseau via les requêtes DNS", "Pour permettre le fonctionnement du DHCP", "Pour segmenter automatiquement les VLAN"], "answer": 1, "def": "Les requêtes DNS internes* révèlent les noms d'hôtes, les services exposés et la structure du réseau, une mine d'informations pour un attaquant.", "why": ["La sécurisation du DNS interne vise avant tout la confidentialité de l'information, pas seulement la performance de résolution.", "Correct : un DNS interne compromis ou espionné permet à un attaquant de cartographier précisément les machines et services du système d'information.", "Le DHCP fonctionne indépendamment du DNS ; sécuriser le DNS n'est pas une condition de fonctionnement du DHCP.", "La segmentation VLAN est une action réseau distincte, sans lien automatique avec la sécurisation du service DNS."]}, {"q": "Les injections SQL et les attaques XSS ciblent principalement :", "options": ["Les routeurs réseau", "Les applications et sites web", "Les commutateurs (switches)", "Les hyperviseurs de virtualisation"], "answer": 1, "def": "SQLi et XSS* sont des attaques applicatives : SQLi injecte du code SQL malveillant, XSS injecte du JavaScript exécuté dans le navigateur d'une victime.", "why": ["Les routeurs sont ciblés par d'autres types d'attaques (exploitation de firmware, mauvaise configuration), pas typiquement par SQLi/XSS.", "Correct : ces deux attaques exploitent des failles dans le code des applications web (formulaires mal filtrés, sortie non échappée).", "Les switches opèrent en couche 2, un niveau très différent de celui visé par des attaques applicatives comme SQLi/XSS.", "Les hyperviseurs virtualisent des machines ; SQLi/XSS ciblent le code d'une application web, pas la couche de virtualisation."]}, {"q": "Pourquoi déporter (centraliser) tous les journaux (logs) d'une infrastructure ?", "options": ["Uniquement pour gagner de l'espace disque local", "Pour préserver l'intégrité des preuves en cas de compromission", "Uniquement pour faciliter le routage réseau", "Pour remplacer le besoin de sauvegardes"], "answer": 1, "def": "Centraliser les logs sur un serveur distant (SIEM)* protège les preuves : un attaquant qui efface ses traces localement ne peut pas les effacer ailleurs.", "why": ["Le gain d'espace disque est un effet secondaire possible, mais ce n'est pas la raison principale de la centralisation des logs en sécurité.", "Correct : en cas de compromission, un attaquant efface souvent ses traces locales ; des logs déjà exportés vers un SIEM externe restent intacts pour l'investigation.", "Le routage réseau est une fonction indépendante des journaux applicatifs/système, sans lien direct.", "Les logs ne remplacent pas les sauvegardes de données : ce sont deux mécanismes complémentaires, avec des objectifs différents (preuve vs restauration)."]}, {"q": "Que signifie le modèle de sécurité Zero Trust ?", "options": ["Faire confiance par défaut au réseau interne de l'entreprise", "Ne jamais faire confiance implicitement, toujours vérifier chaque accès", "Un type spécifique de VPN chiffré", "Un protocole particulier de routage dynamique"], "answer": 1, "def": "Zero Trust* remet en cause la confiance accordée traditionnellement au réseau interne : chaque accès doit être authentifié et autorisé, peu importe sa provenance.", "why": ["C'est justement l'inverse du principe Zero Trust, qui rejette la confiance implicite accordée traditionnellement au LAN interne.", "Correct : dans un modèle Zero Trust, même un utilisateur déjà connecté au LAN doit re-prouver son identité pour chaque ressource sensible.", "Zero Trust est un modèle architectural global, pas un protocole VPN particulier (même si le VPN peut faire partie de sa mise en œuvre).", "Ce n'est pas un protocole de routage ; Zero Trust est une philosophie de sécurité transversale à toute l'infrastructure."]}, {"q": "Que faut-il superviser dans une politique de sécurité réseau cohérente ?", "options": ["Uniquement les serveurs de production critiques", "L'ensemble de l'infrastructure considérée comme sensible (pare-feu, clusters, switches...)", "Uniquement les connexions internet sortantes (WAN)", "Les imprimantes réseau uniquement"], "answer": 1, "def": "Une supervision incomplète* laisse des angles morts : un pare-feu ou un switch non surveillé peut devenir un point d'entrée ignoré des attaquants.", "why": ["Se limiter aux serveurs de production laisse de côté des équipements réseau (pare-feu, switches) tout aussi critiques pour la sécurité globale.", "Correct : pare-feux, switches, hyperviseurs, clusters et serveurs doivent tous être supervisés pour éviter les angles morts exploitables.", "Se limiter au trafic WAN sortant ignorerait des menaces internes ou des pannes d'équipements internes, tout aussi critiques.", "Les imprimantes peuvent être un point d'entrée (souvent négligé), mais elles ne représentent qu'une petite partie du périmètre à superviser globalement."]}, {"q": "À quoi servent les VACL (VLAN Access Control Lists) ?", "options": ["À filtrer le trafic AU SEIN d'un même VLAN (intra-VLAN)", "À créer de nouveaux VLAN sur un switch", "À router le trafic entre plusieurs VLAN", "À chiffrer systématiquement le contenu d'un VLAN"], "answer": 0, "def": "Les ACL classiques ne s'appliquent qu'au trafic routé ENTRE VLAN ; les VACL* comblent ce manque en filtrant aussi le trafic intra-VLAN, non routé.", "why": ["Correct : une ACL de routeur classique ne voit jamais le trafic qui reste à l'intérieur d'un même VLAN (entre deux hôtes du même segment) ; la VACL le peut.", "Une VACL ne crée aucun VLAN, elle filtre le trafic à l'intérieur d'un VLAN déjà existant.", "Le routage inter-VLAN est assuré par un routeur ou une interface virtuelle (SVI), pas par une VACL qui filtre plutôt qu'elle ne route.", "Une VACL filtre le trafic selon des règles (IP, port...), elle ne chiffre rien par elle-même."]}]}, {"id": "vpn", "title": "VPN & Tunnels", "icon": "🔒", "questions": [{"q": "IPSec fonctionne à quel niveau du modèle OSI ?", "options": ["Niveau 2 - Liaison", "Niveau 3 - Réseau", "Niveau 4 - Transport", "Niveau 7 - Application"], "answer": 1, "def": "IPSec* opère en couche 3 en chiffrant/authentifiant directement les paquets IP, ce qui le rend transparent pour les applications situées au-dessus.", "why": ["IPSec ne travaille pas sur les trames de couche 2 ; ce niveau est plutôt celui de protocoles comme L2TP.", "Correct : IPSec encapsule et protège les paquets IP eux-mêmes, une opération de couche 3, ce qui permet de sécuriser tout le trafic IP sans modifier les applications.", "SSL/TLS opère plutôt entre la couche 4 et 7, une approche différente d'IPSec qui reste centrée sur le paquet IP.", "IPSec est transparent pour les applications de couche 7 ; il agit en dessous, au niveau du paquet réseau."]}, {"q": "Qu'est-ce qu'un VPN de type « Roadwarrior » ?", "options": ["Un VPN reliant deux sites fixes en permanence", "Un VPN pour un utilisateur nomade individuel se connectant depuis n'importe où", "Un VPN fonctionnant uniquement en couche 2", "Un VPN sans aucun chiffrement"], "answer": 1, "def": "Le mode Roadwarrior* (ou nomade) permet à un télétravailleur de se connecter individuellement au réseau d'entreprise, peu importe son point d'accès Internet.", "why": ["Un VPN reliant deux sites fixes en permanence est un VPN site-à-site (LAN-to-LAN), un cas d'usage différent du Roadwarrior individuel.", "Correct : le Roadwarrior désigne un utilisateur mobile isolé (portable en déplacement) qui établit son propre tunnel VPN vers l'entreprise.", "Rien n'impose au Roadwarrior de fonctionner en couche 2 spécifiquement ; il peut tout aussi bien s'appuyer sur IPSec (couche 3) ou SSL VPN.", "Un VPN, quel que soit son type, a précisément pour but d'apporter chiffrement et authentification, contrairement à cette affirmation."]}, {"q": "Qu'est-ce qu'un VPN Nomade, par opposition à un VPN LAN-to-LAN ?", "options": ["Un VPN fixe reliant deux sites en permanence", "Un VPN destiné aux utilisateurs mobiles/distants individuels", "Un VPN fonctionnant sans aucun chiffrement", "Un VPN réservé exclusivement à la fibre optique"], "answer": 1, "def": "Un VPN nomade (client-to-site)* connecte des individus distants au réseau d'entreprise, à la différence du VPN site-à-site qui relie deux réseaux entiers en permanence.", "why": ["C'est justement la définition du VPN LAN-to-LAN (site-à-site), l'opposé du VPN nomade individuel demandé ici.", "Correct : le VPN nomade s'adresse à des utilisateurs individuels distants (télétravailleurs), contrairement au VPN site-à-site qui relie deux réseaux complets.", "Un VPN implique par définition un tunnel chiffré ; l'absence de chiffrement contredirait le principe même du VPN.", "Le VPN nomade fonctionne sur n'importe quel support Internet disponible (4G, fibre, ADSL...), pas exclusivement la fibre optique."]}, {"q": "GRE (Generic Routing Encapsulation) est un protocole de :", "options": ["Chiffrement fort des données", "Encapsulation de tunnels, sans chiffrement natif", "Routage dynamique inter-AS", "Authentification centralisée des utilisateurs"], "answer": 1, "def": "GRE* encapsule n'importe quel protocole réseau dans des paquets IP pour créer un tunnel, mais ne fournit AUCUN chiffrement par lui-même.", "why": ["C'est une confusion fréquente : GRE encapsule les données mais ne les chiffre absolument pas, contrairement à IPSec.", "Correct : GRE crée un tunnel d'encapsulation pur ; il est souvent combiné à IPSec pour ajouter le chiffrement qui lui manque nativement.", "GRE n'est pas un protocole de routage comme BGP ou OSPF ; il transporte simplement des paquets encapsulés d'un point à un autre.", "GRE ne gère aucune authentification d'utilisateur ; il s'agit d'un simple mécanisme d'encapsulation de tunnel."]}, {"q": "À quelle couche du modèle OSI le protocole L2TP crée-t-il ses tunnels ?", "options": ["Couche 2 - Liaison de données", "Couche 3 - Réseau", "Couche 4 - Transport", "Couche 7 - Application"], "answer": 0, "def": "L2TP (Layer 2 Tunneling Protocol)* transporte des trames de couche 2 à travers un réseau IP, souvent combiné à IPSec pour le chiffrement.", "why": ["Correct : comme son nom l'indique, L2TP encapsule des trames de couche 2, contrairement à IPSec qui agit directement sur les paquets IP de couche 3.", "La couche 3 (Réseau) est plutôt le niveau où opère IPSec, souvent associé à L2TP pour sécuriser le tunnel.", "La couche 4 (Transport) gère TCP/UDP, un niveau différent de celui visé par le nom même du protocole L2TP.", "L2TP est un protocole de tunneling bas niveau, bien en dessous de la couche 7 (Application)."]}, {"q": "À quoi sert la Phase 1 du protocole IKE (Internet Key Exchange) ?", "options": ["À transférer directement les données utilisateur chiffrées", "À négocier et établir les Security Associations (SA) de contrôle", "À fermer définitivement le tunnel VPN", "À scanner les ports ouverts du serveur distant"], "answer": 1, "def": "IKE Phase 1* établit un canal sécurisé de contrôle (authentification mutuelle, négociation des algorithmes), préalable indispensable à l'échange de données.", "why": ["Le transfert effectif des données chiffrées se fait après la négociation, une fois les deux SA d'IPSec établies en Phase 2.", "Correct : la Phase 1 crée le canal de contrôle sécurisé (souvent appelé tunnel ISAKMP), sur lequel la Phase 2 négociera ensuite les SA pour le trafic réel.", "La fermeture du tunnel est un événement de fin de session, sans rapport avec le rôle initial de négociation de la Phase 1.", "IKE n'a aucune fonction de scan de ports ; c'est un protocole de négociation cryptographique, pas un outil de reconnaissance réseau."]}, {"q": "Que signifie SPD dans le contexte d'IPSec ?", "options": ["Security Policy Database", "Secure Protocol Definition", "Session Path Discovery", "System Process Daemon"], "answer": 0, "def": "La SPD* définit QUELS types de trafic doivent être protégés par IPSec et selon quelles règles, avant même toute négociation de clés.", "why": ["Correct : la SPD (base de politiques de sécurité) précise les règles à appliquer (chiffrer, laisser passer, bloquer) selon les caractéristiques du trafic.", "'Secure Protocol Definition' n'est pas la signification officielle du sigle SPD dans IPSec.", "'Session Path Discovery' est un intrus construit pour ressembler à SPD, sans rapport avec le vocabulaire IPSec réel.", "'System Process Daemon' est un terme générique système, sans lien avec la terminologie spécifique d'IPSec."]}, {"q": "Que signifie SAD dans le contexte d'IPSec ?", "options": ["Security Association Database", "Secure Access Directory", "System Authentication Data", "Session Activity Database"], "answer": 0, "def": "La SAD* stocke les Security Associations actives (clés, algorithmes, paramètres négociés) résultant de la négociation IKE, à la différence de la SPD qui définit les politiques.", "why": ["Correct : la SAD conserve l'état concret des tunnels IPSec actifs (SA), alors que la SPD ne fait que définir les règles théoriques à appliquer.", "'Secure Access Directory' n'est pas la signification officielle du sigle SAD dans IPSec.", "'System Authentication Data' est un intrus construit, sans rapport avec le vocabulaire technique réel d'IPSec.", "'Session Activity Database' ressemble au vrai terme mais n'est pas la signification correcte du sigle SAD."]}, {"q": "À quoi sert ISAKMP dans le cadre d'IPSec ?", "options": ["Au routage dynamique entre réseaux distants", "À définir le cadre de négociation et de gestion des clés/associations de sécurité", "À la supervision réseau en temps réel", "À la sauvegarde automatisée des configurations"], "answer": 1, "def": "ISAKMP* fournit le cadre générique (format des messages, procédures) pour négocier, établir et gérer les SA ; IKE en est l'implémentation concrète la plus utilisée.", "why": ["ISAKMP ne fait aucun routage ; c'est un protocole de gestion de clés et d'associations de sécurité, sans lien avec le choix du chemin réseau.", "Correct : ISAKMP structure le dialogue de négociation cryptographique, sur lequel s'appuie concrètement le protocole IKE.", "ISAKMP n'a aucune fonction de supervision d'infrastructure, c'est un protocole de sécurité cryptographique.", "ISAKMP ne sauvegarde rien ; il concerne uniquement la négociation et la gestion des associations de sécurité IPSec."]}, {"q": "Un tunnel réseau est-il toujours chiffré par nature ?", "options": ["Oui, systématiquement, par définition d'un tunnel", "Non, un tunnel peut exister sans chiffrement (ex : GRE simple)", "Uniquement si le tunnel utilise IPv6", "Uniquement si le tunnel est établi entre deux pare-feux Cisco"], "answer": 1, "def": "Un tunnel* n'est qu'un mécanisme d'encapsulation ; le chiffrement est une couche de sécurité ADDITIONNELLE (IPSec, TLS...) qui n'est pas systématique.", "why": ["C'est une confusion fréquente : GRE, par exemple, crée un tunnel fonctionnel mais totalement en clair, sans aucun chiffrement.", "Correct : un tunnel GRE simple encapsule sans chiffrer ; il faut lui ajouter IPSec (ou un autre mécanisme) pour obtenir la confidentialité des données.", "La version d'IP utilisée (IPv4 ou IPv6) n'a aucune incidence sur la présence ou l'absence de chiffrement d'un tunnel.", "Le chiffrement d'un tunnel ne dépend pas de la marque du matériel utilisé, mais du protocole de sécurité effectivement mis en œuvre par-dessus l'encapsulation."]}, {"q": "À quoi sert MPLS (Multi-Protocol Label Switching) ?", "options": ["Au chiffrement fort des communications inter-sites", "À la commutation rapide par labels dans les réseaux opérateurs", "À la supervision applicative des serveurs", "À l'attribution dynamique d'adresses IP"], "answer": 1, "def": "MPLS* accélère l'acheminement des paquets en remplaçant les décisions de routage IP classiques par la simple lecture d'un label, surtout utilisé dans les cœurs de réseaux opérateurs.", "why": ["MPLS n'apporte aucun chiffrement par défaut ; sa force est la rapidité de commutation par labels, pas la confidentialité des données.", "Correct : MPLS insère un label court entre les couches 2 et 3, permettant aux routeurs opérateurs de commuter le trafic très rapidement sans réanalyser l'en-tête IP complet à chaque saut.", "MPLS n'est pas un outil de supervision applicative ; c'est une technologie de transport et de commutation réseau.", "L'attribution dynamique d'adresses IP est le rôle du DHCP, sans rapport avec la commutation par labels de MPLS."]}, {"q": "Qu'est-ce qu'un VPN Host-to-Host ?", "options": ["Un tunnel sécurisé directement entre deux machines individuelles", "Un VPN reliant automatiquement deux réseaux entiers", "Un VPN destiné à un hôte se connectant à un réseau complet", "Un VPN par définition non chiffré"], "answer": 0, "def": "Le VPN Host-to-Host* sécurise une communication point-à-point entre deux machines précises, sans impliquer de passerelle ni de réseau entier.", "why": ["Correct : contrairement au VPN LAN-to-LAN qui relie deux réseaux, le Host-to-Host protège uniquement le flux entre deux machines identifiées.", "Relier deux réseaux entiers automatiquement décrit plutôt un VPN LAN-to-LAN (site-à-site), pas le Host-to-Host qui reste limité à deux machines.", "Un hôte se connectant à un réseau complet décrit plutôt un VPN nomade (client-to-site), un cas d'usage différent du Host-to-Host strict.", "Un VPN, quel que soit son type, vise justement à apporter chiffrement et authentification ; l'absence de chiffrement contredirait sa définition même."]}, {"q": "Que connecte un VPN LAN-to-LAN (site-à-site) ?", "options": ["Deux machines individuelles isolées", "Deux réseaux locaux distants, en permanence", "Un hôte nomade au cloud public", "Un VLAN à un autre VLAN du même site"], "answer": 1, "def": "Un VPN LAN-to-LAN* relie durablement deux réseaux locaux distants via Internet, comme s'ils formaient un seul réseau physique continu.", "why": ["Relier deux machines individuelles isolées correspond plutôt à un VPN Host-to-Host, pas à un VPN LAN-to-LAN qui relie des réseaux entiers.", "Correct : ce type de VPN relie en permanence deux sites (ex: siège et agence), permettant aux deux réseaux de communiquer comme s'ils étaient physiquement proches.", "Un hôte nomade se connectant ponctuellement décrit plutôt le VPN client-to-site (Roadwarrior), pas le VPN LAN-to-LAN permanent.", "Relier deux VLAN d'un même site est une opération de routage inter-VLAN local, sans rapport avec un VPN traversant Internet."]}, {"q": "Qu'est-ce que le Web Tunneling (tunneling HTTP) ?", "options": ["De la navigation web classique sans particularité", "L'encapsulation d'un protocole arbitraire dans des requêtes HTTP/HTTPS", "Un type spécifique de proxy transparent", "Une méthode de routage propre au web"], "answer": 1, "def": "Le Web Tunneling* déguise un protocole quelconque en trafic HTTP/HTTPS classique, permettant de traverser des pare-feux restrictifs qui laissent passer le web mais bloquent le reste.", "why": ["Ce n'est pas de la navigation web ordinaire ; c'est une technique de contournement qui camoufle un autre protocole derrière des requêtes HTTP.", "Correct : en encapsulant un flux (souvent un VPN) dans du HTTP/HTTPS, on traverse des pare-feux d'entreprise très restrictifs qui n'autorisent que le port 443.", "Ce n'est pas un simple proxy transparent ; le web tunneling déguise activement un protocole différent en trafic web légitime.", "Il ne s'agit pas d'une méthode de routage, mais d'une technique de camouflage de protocole à travers HTTP/HTTPS."]}, {"q": "Comment est généralement considéré le protocole PPTP aujourd'hui ?", "options": ["Comme extrêmement sécurisé, recommandé en production", "Comme obsolète et peu sécurisé, à éviter", "Comme le meilleur protocole VPN disponible actuellement", "Comme un protocole de routage dynamique"], "answer": 1, "def": "PPTP* est vulnérable à de nombreuses attaques connues (MS-CHAPv2 cassé, RC4 faible), et son usage est officiellement déconseillé depuis des années.", "why": ["C'est l'inverse : PPTP est considéré comme obsolète, ses mécanismes cryptographiques ayant été cassés depuis longtemps.", "Correct : à cause de failles connues et anciennes, PPTP ne doit plus être utilisé ; des alternatives comme WireGuard ou OpenVPN sont largement préférées.", "Des protocoles comme WireGuard ou OpenVPN sont aujourd'hui bien plus recommandés que PPTP, considéré comme dépassé.", "PPTP est un protocole de tunneling VPN, pas un protocole de routage dynamique comme OSPF ou BGP."]}, {"q": "Tailscale repose techniquement sur quel protocole de chiffrement de tunnel ?", "options": ["Un pare-feu propriétaire fermé", "WireGuard, dans une architecture réseau maillée (mesh)", "Un SIEM de supervision de sécurité", "Un simple outil de sauvegarde de fichiers"], "answer": 1, "def": "Tailscale* crée un réseau mesh où chaque nœud communique directement en P2P avec les autres, en s'appuyant sur le protocole WireGuard pour le chiffrement.", "why": ["Tailscale n'est pas un pare-feu, mais une solution de VPN mesh construite au-dessus du protocole ouvert WireGuard.", "Correct : chaque appareil connecté via Tailscale établit un tunnel WireGuard chiffré directement avec les autres nœuds du réseau, sans configuration manuelle de ports.", "Tailscale n'analyse aucun journal de sécurité, ce n'est pas un SIEM mais une solution de connectivité réseau chiffrée.", "Tailscale ne sauvegarde aucune donnée ; sa fonction est de créer un réseau privé virtuel maillé entre appareils."]}]}, {"id": "virtualisation", "title": "Virtualisation & Conteneurisation", "icon": "📦", "questions": [{"q": "Quels sont les deux grands types d'hyperviseur ?", "options": ["Type 1 (bare-metal) et Type 2 (hosted)", "Type A et Type B, selon le fabricant", "Hyperviseur natif et Hyperviseur virtuel", "Hyperviseur primaire et Hyperviseur secondaire"], "answer": 0, "def": "Un hyperviseur* de Type 1 s'installe directement sur le matériel (ESXi, Proxmox, Hyper-V) ; un Type 2 s'installe sur un OS hôte existant (VirtualBox).", "why": ["Correct : Type 1 (bare-metal, plus performant, utilisé en production) et Type 2 (hosted, plus simple, utilisé pour des tests sur poste de travail) sont la classification standard.", "Il n'existe pas de classification officielle 'Type A/Type B' liée au fabricant ; la distinction reconnue est bare-metal vs hosted.", "Les termes 'natif' et 'virtuel' ne sont pas la terminologie standard employée pour classer les hyperviseurs.", "'Primaire/secondaire' n'est pas non plus la terminologie reconnue de classification des hyperviseurs."]}, {"q": "À quoi sert l'option Docker --icc=false ?", "options": ["À accélérer artificiellement les conteneurs", "À désactiver la communication directe entre conteneurs (Inter-Container Communication)", "À activer le mode réseau bridge par défaut", "À supprimer automatiquement les images inutilisées"], "answer": 1, "def": "--icc=false* empêche les conteneurs de communiquer librement entre eux sur le bridge Docker, une bonne pratique de sécurité (moindre privilège).", "why": ["Cette option n'a aucun effet de performance ; elle restreint la communication réseau entre conteneurs, sans rapport avec la vitesse d'exécution.", "Correct : sans cette option, tous les conteneurs sur le même réseau bridge peuvent se joindre librement ; --icc=false force une communication explicite (via liens ou règles dédiées).", "Le mode bridge est souvent déjà le réseau par défaut de Docker ; cette option ne l'active pas, elle restreint la communication à l'intérieur de ce réseau.", "Cette option ne supprime aucune image ; c'est une commande de nettoyage (docker image prune) qui remplirait ce rôle, pas --icc=false."]}, {"q": "Quelle est la différence entre une image Docker et un conteneur ?", "options": ["L'image est le modèle immuable, le conteneur est son instance en exécution", "Il n'y a aucune différence, ce sont des synonymes", "Le conteneur est le modèle, l'image en est l'instance", "L'image s'exécute directement sans conteneur"], "answer": 0, "def": "Une image* est un modèle figé (comme une classe en programmation) ; un conteneur* est une instance en cours d'exécution de cette image, avec son propre état.", "why": ["Correct : on peut créer plusieurs conteneurs différents à partir d'une même image, chacun ayant sa propre couche d'écriture en plus de l'image partagée en lecture seule.", "Ce ne sont clairement pas des synonymes : l'un est un modèle statique, l'autre une instance active à un instant donné.", "C'est exactement l'inverse : l'image est le modèle de référence, le conteneur en est l'exécution concrète.", "Une image ne s'exécute jamais directement ; il faut créer un conteneur à partir d'elle pour obtenir un processus en cours d'exécution."]}, {"q": "Quelle est la principale différence entre un conteneur Docker et une machine virtuelle (VM) ?", "options": ["Le conteneur partage le noyau de l'hôte, la VM dispose de son propre OS complet", "Il n'y a aucune différence fonctionnelle", "La VM est systématiquement plus légère qu'un conteneur", "Docker s'appuie obligatoirement sur un hyperviseur classique"], "answer": 0, "def": "Les conteneurs* s'isolent via les namespaces/cgroups du noyau Linux hôte (pas d'OS dupliqué), contrairement à une VM qui virtualise le matériel et embarque un OS complet.", "why": ["Correct : cette absence de duplication d'OS rend les conteneurs beaucoup plus légers et rapides à démarrer qu'une machine virtuelle classique.", "La différence est majeure en termes de performance, d'isolation et de poids ; ce ne sont pas des mécanismes interchangeables.", "C'est l'inverse : un conteneur est généralement bien plus léger qu'une VM complète, car il ne duplique pas tout un système d'exploitation.", "Docker n'utilise pas un hyperviseur classique de virtualisation matérielle ; il repose sur les mécanismes d'isolation natifs du noyau Linux (namespaces, cgroups)."]}, {"q": "Portainer est concrètement :", "options": ["Un hyperviseur de virtualisation matérielle", "Une interface web de gestion pour Docker/Kubernetes", "Un pare-feu applicatif", "Un outil de supervision réseau bas niveau"], "answer": 1, "def": "Portainer* simplifie l'administration de Docker, Docker Swarm et Kubernetes via une interface graphique, sans devoir tout gérer en ligne de commande.", "why": ["Portainer ne virtualise aucune machine ; il gère des conteneurs déjà en fonctionnement sur un moteur existant (Docker/Kubernetes).", "Correct : Portainer offre un tableau de bord web pour visualiser et gérer conteneurs, images, volumes et réseaux, sans ligne de commande.", "Portainer n'a pas de fonction de filtrage réseau ; c'est un outil de gestion, pas un pare-feu.", "Portainer se concentre sur la gestion applicative des conteneurs, ce n'est pas un outil de supervision réseau bas niveau (Zabbix jouerait ce rôle)."]}, {"q": "CasaOS / ZimaSpace est concrètement :", "options": ["Un système d'exploitation cloud personnel pour homelab", "Un pare-feu open source spécialisé", "Un protocole réseau de couche 3", "Un outil professionnel de pentesting"], "answer": 0, "def": "CasaOS* propose une interface web simplifiée pour gérer des applications Docker sur un NAS ou mini-PC, orientée auto-hébergement grand public.", "why": ["Correct : CasaOS vise à démocratiser l'auto-hébergement, en rendant la gestion d'applications conteneurisées accessible sans expertise Linux poussée.", "CasaOS n'est pas un pare-feu ; c'est un système d'exploitation orienté gestion d'applications personnelles auto-hébergées.", "CasaOS opère au niveau applicatif (gestion de conteneurs), pas au niveau d'un protocole réseau de couche 3.", "CasaOS n'est pas un outil de test d'intrusion ; c'est une solution grand public de serveur personnel."]}, {"q": "Que signifie l'Auto Scalability (mise à l'échelle automatique) ?", "options": ["Une mise à l'échelle uniquement manuelle et planifiée", "L'ajustement automatique des ressources/instances selon la charge réelle", "Une sauvegarde automatique périodique des données", "Une compression automatique des fichiers de logs"], "answer": 1, "def": "L'auto-scaling* adapte dynamiquement le nombre d'instances (conteneurs, VM) à la charge observée en temps réel, sans intervention humaine."
